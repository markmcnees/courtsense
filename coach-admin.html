<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>CourtSense Onboarding Review</title>
<script src="cs-config-gen.js?v=3100e294"></script>
<style>
  :root{
    --navy:#082A4F;
    --blue:#0081AB;
    --gold:#F2B22E;
    --teal:#217F7F;
    --sand:#F7C880;
    --paper:#FBF7F0;
    --ink:#13243A;
    --slate:#5C6B7A;
    --white:#FFFFFF;
    --line:#E4DDCF;
    --ok:#217F7F;
    --err:#B4362E;
  }
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Barlow',-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--paper);
    color:var(--ink);
    font-size:15px;
    line-height:1.45;
  }
  header{
    background:var(--navy);color:var(--white);
    padding:20px 26px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  }
  header h1{
    font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:28px;
    letter-spacing:1.4px;margin:0;line-height:1;
  }
  header .sub{color:var(--sand);font-size:13px;letter-spacing:.4px;}
  header .count{
    margin-left:auto;font-size:13px;font-weight:600;background:var(--blue);
    padding:4px 12px;border-radius:20px;
  }
  .bar{
    padding:14px 26px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  }
  .bar button{
    font-family:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);
    background:var(--white);color:var(--navy);border-radius:8px;padding:7px 14px;cursor:pointer;
  }
  .bar button:hover{border-color:var(--blue);color:var(--blue);}
  .bar .filter{margin-left:auto;display:flex;gap:4px;}
  .bar .filter button.active{background:var(--navy);color:var(--white);border-color:var(--navy);}
  .wrap{max-width:820px;margin:0 auto;padding:22px 20px 60px;}
  .status-msg{padding:14px 16px;border-radius:10px;font-size:14px;margin-bottom:16px;display:none;}
  .status-msg.info{background:#EAF3F6;border:1px solid #cfe0e6;color:#1c4a5c;display:block;}
  .status-msg.empty{background:var(--white);border:1px dashed var(--line);color:var(--slate);text-align:center;padding:40px 16px;display:block;}

  .card{
    background:var(--white);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;margin-bottom:18px;box-shadow:0 1px 3px rgba(8,42,79,.05);
  }
  .card-top{
    padding:16px 18px;display:flex;align-items:flex-start;gap:14px;
    border-left:6px solid var(--blue);
  }
  .card-emoji{
    width:44px;height:44px;border-radius:10px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:20px;
    background:var(--paper);border:1px solid var(--line);
  }
  .card-head{flex:1;min-width:0;}
  .card-school{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1px;line-height:1;color:var(--navy);margin:0 0 3px;}
  .card-coach{font-size:14px;color:var(--ink);font-weight:600;}
  .card-sub{font-size:13px;color:var(--slate);}
  .badge{
    font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    padding:3px 10px;border-radius:20px;flex:0 0 auto;
  }
  .badge.pending{background:var(--gold);color:#5a4310;}
  .badge.approved{background:var(--teal);color:var(--white);}
  .badge.rejected{background:#e8d5d3;color:var(--err);}
  .logo-cell .logo-box{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:60px;min-height:44px;padding:6px;border:1px solid #d5dae0;border-radius:8px;
    background-color:#fff;
    background-image:
      linear-gradient(45deg,#e2e6ea 25%,transparent 25%),
      linear-gradient(-45deg,#e2e6ea 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#e2e6ea 75%),
      linear-gradient(-45deg,transparent 75%,#e2e6ea 75%);
    background-size:16px 16px;
    background-position:0 0,0 8px,8px -8px,-8px 0;
  }
  .logo-cell .logo-box img{max-height:80px;max-width:100%;display:block;}
  .logo-cell .logo-fname{display:block;font-size:11.5px;color:var(--slate);margin-top:4px;}
  .logo-cell .btn.show-logo{padding:5px 12px;font-size:13px;}
  .logo-edit{margin-top:8px;}
  .logo-edit .btn{padding:5px 12px;font-size:13px;}
  .logo-edit .logo-new{margin-top:8px;}
  .logo-edit .logo-new img{max-height:96px;max-width:200px;display:block;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/12px 12px;border:1px solid #ddd;border-radius:6px;margin-bottom:6px;}
  .logo-edit .logo-msg{font-size:12.5px;margin-top:6px;}

  .card-body{padding:2px 18px 14px;display:none;}
  .card.open .card-body{display:block;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;font-size:13.5px;margin-top:8px;}
  @media (max-width:560px){ .grid{grid-template-columns:1fr;} }
  .grid .row{padding:5px 0;border-bottom:1px solid var(--paper);}
  .grid .k{color:var(--slate);font-size:12px;text-transform:uppercase;letter-spacing:.4px;}
  .grid .v{color:var(--ink);word-break:break-word;}
  .grid .v a{color:var(--blue);}
  .grid .full{grid-column:1 / -1;}
  .swatches{display:flex;gap:6px;margin-top:2px;}
  .sw{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);}
  .color-edit{margin-top:8px;}
  .color-edit .btn{padding:5px 12px;font-size:13px;}
  .color-edit .color-panel{margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);max-width:420px;}
  .color-edit .c-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .color-edit .c-row label{font-size:12.5px;font-weight:600;min-width:64px;}
  .color-edit input[type=color]{width:40px;height:32px;padding:0;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;}
  .color-edit input.c-hex{width:96px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-family:monospace;font-size:13px;}
  .color-edit .c-accent-on{font-size:12.5px;font-weight:400;display:flex;align-items:center;gap:4px;}
  .color-edit .c-preview{margin:6px 0 8px;}
  .color-edit .cp-header{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:#fff;padding:10px 14px;border-radius:8px;text-shadow:0 2px 8px rgba(0,0,0,0.2);}
  .color-edit .cp-buttons{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .color-edit .cp-btn{font-size:13px;font-weight:700;padding:7px 12px;border-radius:8px;}
  .color-edit .c-readout{font-size:12.5px;line-height:1.5;margin-bottom:8px;}
  .color-edit .c-readout .pass{color:#2e7d32;}
  .color-edit .c-readout .warn{color:#8a5a00;}
  .color-edit .c-readout .refuse{color:var(--err);font-weight:600;}
  .color-edit .color-msg{font-size:12.5px;margin-top:6px;}
  .color-note{font-size:12.5px;color:var(--slate);margin-top:8px;}

  .card-actions{
    padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;
    background:#FCFAF6;
  }
  .card-actions .expand{
    font-family:inherit;font-size:13px;font-weight:600;background:none;border:none;
    color:var(--blue);cursor:pointer;padding:0;
  }
  .card-actions .spacer{flex:1;}
  .btn{
    font-family:inherit;font-size:14px;font-weight:600;border:none;border-radius:8px;
    padding:9px 18px;cursor:pointer;letter-spacing:.3px;
  }
  .btn.approve{background:var(--teal);color:var(--white);}
  .btn.approve:hover{background:#1a6666;}
  .btn.reject{background:var(--white);color:var(--err);border:1px solid #e0c4c1;}
  .btn.reject:hover{background:#fbeeed;}
  .btn.resend-claim{background:var(--white);color:var(--navy);border:1px solid var(--line);}
  .btn.resend-claim:hover{background:#f1f4f8;}
  .btn:disabled{opacity:.5;cursor:default;}
  .email-coach{font-size:13px;color:var(--slate);display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;}
  .reviewed-note{font-size:12.5px;color:var(--slate);font-style:italic;}

  .approved-panel{
    margin-top:2px;padding:12px 14px;background:#EAF4EF;border:1px solid #bfe0d1;border-radius:9px;
    font-size:13px;color:#1c5c3a;display:none;
  }
  .card.approved-show .approved-panel{display:block;}
  .approved-panel strong{color:var(--navy);}
  .approved-panel code{font-family:ui-monospace,Menlo,monospace;background:var(--white);padding:1px 5px;border-radius:4px;border:1px solid var(--line);}

  /* finish-setup panel (approve flow) */
  .finish{
    margin-top:2px;padding:16px 18px;background:#F4F8F6;border:1px solid #cfe0d8;
    border-radius:11px;display:none;
  }
  .card.finishing .finish{display:block;}
  .finish h4{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:19px;letter-spacing:.6px;color:var(--navy);margin:0 0 4px;}
  .finish .fnote{font-size:12.5px;color:var(--slate);margin:0 0 12px;}
  .finish .frow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .finish .ff{flex:1;min-width:130px;}
  .finish label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--slate);margin-bottom:3px;}
  .finish input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-family:inherit;font-size:14px;background:var(--white);}
  .finish input:focus{outline:2px solid var(--blue);border-color:var(--blue);}
  .finish .ferr{color:var(--err);font-size:12px;font-weight:600;margin-top:3px;display:none;}
  .finish .ff.bad input{border-color:var(--err);}
  .finish .ff.bad .ferr{display:block;}
  .finish .genbtn{
    font-family:inherit;font-size:14px;font-weight:600;background:var(--navy);color:var(--white);
    border:none;border-radius:8px;padding:9px 18px;cursor:pointer;
  }
  .finish .genbtn:hover{background:var(--blue);}
  .out-block{margin-top:14px;}
  .out-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
  .out-head h5{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--navy);margin:0;}
  .copy-btn{font-family:inherit;font-size:11px;font-weight:600;background:var(--blue);color:var(--white);border:none;border-radius:6px;padding:4px 11px;cursor:pointer;}
  .copy-btn:hover{background:var(--navy);}
  .copy-btn.done{background:var(--teal);}
  .finish pre{margin:0;background:var(--ink);color:#E8EEF4;border-radius:8px;padding:11px 13px;overflow-x:auto;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.5;white-space:pre;}

  footer{text-align:center;color:var(--slate);font-size:12px;padding:20px;}
</style>
</head>
<body>

<header>
  <h1>Onboarding Review</h1>
  <span class="sub">CourtSense coach submissions</span>
  <span class="count" id="count">--</span>
</header>

<div class="bar">
  <button id="refreshBtn">Refresh</button>
  <button id="keyBtn">Change admin key</button>
  <div class="filter">
    <button data-filter="pending" class="active">Pending</button>
    <button data-filter="all">All</button>
    <button data-filter="schools">Schools</button>
  </div>
</div>

<div class="wrap">
  <div class="status-msg" id="statusMsg"></div>
  <div id="list"></div>
</div>

<footer>Admin only. Submissions carry coach contact info; keep this screen private.</footer>

<script>
// Logo kit: add or replace a school logo. Any PNG, JPG or SVG is drawn onto a canvas in this
// browser (fit to 512 px on the long side, transparency kept) and only the PNG it makes is
// sent, so the worker only ever stores PNG bytes. Pure helpers here; the page wires them up.
// The image and the admin key are never written anywhere but the one request.
window.csLogoKit=(function(){
  var MAX_FILE=5*1024*1024;      // refuse bigger files before reading them
  var MAX_DATA_URL=699999;       // the worker's cap (validLogoDataUrl: under 700000 characters)
  var LONG_SIDE=512;
  var TYPES=['image/png','image/jpeg','image/svg+xml'];
  function fileProblem(f){
    if(!f) return 'Pick a file.';
    var name=String(f.name||'').toLowerCase();
    var okType=TYPES.indexOf(f.type)>=0||/\.(png|jpe?g|svg)$/.test(name);
    if(!okType) return 'Use a PNG, JPG or SVG file.';
    if(f.size>MAX_FILE) return 'That file is over 5 MB. Use a smaller one.';
    return '';
  }
  // Canvas size for an image: the long side at most 512, never scaled up past its own size.
  // An SVG with no size of its own draws at 512 square.
  function fitSize(w,h){
    w=+w||0; h=+h||0;
    if(!w||!h) return {w:LONG_SIDE, h:LONG_SIDE};
    var s=Math.min(1, LONG_SIDE/Math.max(w,h));
    return {w:Math.max(1,Math.round(w*s)), h:Math.max(1,Math.round(h*s))};
  }
  function outputProblem(dataUrl){
    if(typeof dataUrl!=='string'||dataUrl.indexOf('data:image/png;base64,')!==0) return 'That image could not be turned into a PNG. Try another file.';
    if(dataUrl.length>MAX_DATA_URL) return 'That logo is too detailed to store (over 500 KB as a PNG). Try a simpler or smaller file.';
    return '';
  }
  function buttonLabel(hasLogo){ return hasLogo?'Replace logo':'Add logo'; }
  // target is {id} for a submission or {slug} for a live school.
  function requestBody(key,target,dataUrl,filename){
    var b={adminKey:key, logoDataUrl:dataUrl, logoFilename:String(filename||'logo').replace(/\.[^.]*$/,'')+'.png'};
    if(target&&target.id) b.id=target.id; else if(target&&target.slug) b.slug=target.slug;
    return b;
  }
  // The file as a PNG data URL through an <img> and a canvas. Resolves '' on failure.
  function toPng(file,doc){
    doc=doc||document;
    return new Promise(function(resolve){
      var rd=new FileReader();
      rd.onerror=function(){ resolve(''); };
      rd.onload=function(){
        var img=new Image();
        img.onerror=function(){ resolve(''); };
        img.onload=function(){
          try{
            var sz=fitSize(img.naturalWidth,img.naturalHeight), c=doc.createElement('canvas');
            c.width=sz.w; c.height=sz.h;
            var ctx=c.getContext('2d'); ctx.clearRect(0,0,sz.w,sz.h); ctx.drawImage(img,0,0,sz.w,sz.h);
            resolve(c.toDataURL('image/png'));
          }catch(e){ resolve(''); }
        };
        img.src=String(rd.result||'');
      };
      rd.readAsDataURL(file);
    });
  }
  // One save. onForbidden runs on a 403 so the page can drop the stored admin key.
  function save(opts){
    return opts.fetch(opts.worker+'/onboard/admin-set-logo',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(requestBody(opts.key,opts.target,opts.dataUrl,opts.filename))})
      .then(function(r){ return r.json().then(function(j){ return {status:r.status,j:j}; },function(){ return {status:r.status,j:null}; }); })
      .then(function(o){
        if(o.status===403&&o.j&&o.j.code==='forbidden'){ if(opts.onForbidden) opts.onForbidden(); return {ok:false, error:'Admin key rejected. Click Refresh, then try again.'}; }
        if(o.j&&o.j.ok) return {ok:true, target:o.j.target, slug:o.j.slug||''};
        return {ok:false, error:(o.j&&o.j.error)||('Could not save the logo (HTTP '+o.status+').')};
      }, function(){ return {ok:false, error:'Could not reach the worker. Try again.'}; });
  }
  return {MAX_FILE:MAX_FILE, MAX_DATA_URL:MAX_DATA_URL, fileProblem:fileProblem, fitSize:fitSize, outputProblem:outputProblem,
    buttonLabel:buttonLabel, requestBody:requestBody, toPng:toPng, save:save};
})();
</script>
<script>
// Color kit: set a school's primary (and optional accent) color. The palette math is the
// worker's provisionColors (itself a port of cs-config-gen.js), so the preview shows exactly
// what the worker will write. The contrast rule matches the worker too: white text on primary
// and black text on accent must reach 3:1; under 4.5:1 saves with a warning. Pure helpers here;
// the page wires them up. The admin key is never written anywhere but the one request.
window.csColorKit=(function(){
  var FALLBACK='#0081AB';       // the worker's fallback primary (CourtSense blue)
  var APP_GOLD='#d4a843';       // app.js uses this when a school has no accent
  var REFUSE_BELOW=3, PASS_AT=4.5;
  var SITE='https://courtsense.app';
  function clampHex(h){
    var s=String(h==null?'':h).trim();
    if(/^#[0-9a-fA-F]{6}$/.test(s)) return s;
    if(/^#[0-9a-fA-F]{3}$/.test(s)) return '#'+s[1]+s[1]+s[2]+s[2]+s[3]+s[3];
    return null;
  }
  function hexToRgb(h){ var s=clampHex(h)||'#000000'; return {r:parseInt(s.slice(1,3),16), g:parseInt(s.slice(3,5),16), b:parseInt(s.slice(5,7),16)}; }
  function rgbToHex(r,g,b){
    function f(n){ var v=Math.max(0,Math.min(255,Math.round(n))); var x=v.toString(16); return x.length<2?'0'+x:x; }
    return '#'+f(r)+f(g)+f(b);
  }
  function shade(hex,amt){
    var c=hexToRgb(hex);
    if(amt<0){ var k=1+amt; return rgbToHex(c.r*k,c.g*k,c.b*k); }
    return rgbToHex(c.r+(255-c.r)*amt, c.g+(255-c.g)*amt, c.b+(255-c.b)*amt);
  }
  function tint(hex){ var c=hexToRgb(hex); return rgbToHex(c.r+(255-c.r)*0.9, c.g+(255-c.g)*0.9, c.b+(255-c.b)*0.9); }
  // Same keys, values and key order as the worker's provisionColors(color1, color2).
  function palette(color1,color2){
    var prim=clampHex(color1)||FALLBACK;
    var c={primary:prim, primaryDark:shade(prim,-0.2), primaryDeeper:shade(prim,-0.38), primaryLight:shade(prim,0.3), primaryBg:tint(prim)};
    var acc=clampHex(color2);
    if(acc){ c.accent=acc; c.gold=acc; }
    return c;
  }
  function luminance(hex){
    var c=hexToRgb(hex);
    function ch(v){ var s=v/255; return s<=0.03928?s/12.92:Math.pow((s+0.055)/1.055,2.4); }
    return 0.2126*ch(c.r)+0.7152*ch(c.g)+0.0722*ch(c.b);
  }
  function contrastRatio(a,b){ var la=luminance(a), lb=luminance(b); return (Math.max(la,lb)+0.05)/(Math.min(la,lb)+0.05); }
  function contrastCheck(bg,text){
    var r=contrastRatio(bg,text);
    return {ratio:Math.round(r*100)/100, level:r<REFUSE_BELOW?'refuse':r<PASS_AT?'warn':'pass'};
  }
  // One line per color for the readout, and whether Save is allowed.
  function readout(primary,accent){
    var lines=[], ok=true;
    function line(label,hex,text,textName,fix){
      var c=contrastCheck(hex,text);
      var msg=c.level==='pass'?'easy to read.':c.level==='warn'?'readable for large text only. You can still save.':'too hard to read. '+fix;
      if(c.level==='refuse') ok=false;
      lines.push({level:c.level, text:label+': '+textName+' text at '+c.ratio+':1, '+msg});
    }
    var p=clampHex(primary);
    if(!p){ lines.push({level:'refuse', text:'Primary: enter a hex color like #0B2D5B.'}); ok=false; }
    else line('Primary',p,'#ffffff','white','Pick a darker color.');
    if(accent!=null){
      var a=clampHex(accent);
      if(!a){ lines.push({level:'refuse', text:'Accent: enter a hex color like #D4A843.'}); ok=false; }
      else line('Accent',a,'#000000','black','Pick a lighter color.');
    }
    return {ok:ok, lines:lines};
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  // The header bar (white school name on the app's deeper, primary, dark gradient), a primary
  // button with white text, and a gold-style button with black text, as the app draws them.
  function previewHtml(name,colors,gold){
    var c=colors||palette('','');
    var g=clampHex(gold)||APP_GOLD;
    return '<div class="cp-header" style="background:linear-gradient(135deg,'+c.primaryDeeper+' 0%,'+c.primary+' 50%,'+c.primaryDark+' 100%);">'+esc(name||'School name')+'</div>'+
      '<div class="cp-buttons">'+
        '<span class="cp-btn" style="background:'+c.primary+';color:#ffffff;">Save score</span>'+
        '<span class="cp-btn" style="background:'+g+';color:#1a1a1a;">Upload scoresheet</span>'+
      '</div>';
  }
  // target is {id} for a submission or {slug} for a live school. accent is left out unless set.
  function requestBody(key,target,primary,accent){
    var b={adminKey:key, primary:primary};
    if(accent) b.accent=accent;
    if(target&&target.id) b.id=target.id; else if(target&&target.slug) b.slug=target.slug;
    return b;
  }
  // One save. onForbidden runs on a 403 so the page can drop the stored admin key.
  function save(opts){
    return opts.fetch(opts.worker+'/onboard/admin-set-colors',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(requestBody(opts.key,opts.target,opts.primary,opts.accent))})
      .then(function(r){ return r.json().then(function(j){ return {status:r.status,j:j}; },function(){ return {status:r.status,j:null}; }); })
      .then(function(o){
        if(o.status===403&&o.j&&o.j.code==='forbidden'){ if(opts.onForbidden) opts.onForbidden(); return {ok:false, error:'Admin key rejected. Click Refresh, then try again.'}; }
        if(o.j&&o.j.ok) return {ok:true, target:o.j.target, slug:o.j.slug||'', colors:o.j.colors||null, contrast:o.j.contrast||null};
        return {ok:false, error:(o.j&&o.j.error)||('Could not save the colors (HTTP '+o.status+').')};
      }, function(){ return {ok:false, error:'Could not reach the worker. Try again.'}; });
  }
  // A school with its own folder page (200) has its colors written into that page, so a
  // Firebase write would not change it. A folderless school (404) boots from its Firebase
  // config through 404.html, so the control applies. Anything else is 'unknown'.
  function shellUrl(slug){ return SITE+'/'+encodeURIComponent(String(slug||''))+'/'; }
  function shellCheck(fetchFn,slug){
    return fetchFn(shellUrl(slug),{method:'HEAD',cache:'no-store'})
      .then(function(r){ return r.status===200?'folder':r.status===404?'firebase':'unknown'; }, function(){ return 'unknown'; });
  }
  function slotState(kind){
    if(kind==='firebase') return {control:true, note:''};
    if(kind==='folder') return {control:false, note:'Colors for this school live in its own page.'};
    return {control:false, note:'Could not check this school\'s page. Click Refresh to try again.'};
  }
  return {FALLBACK:FALLBACK, APP_GOLD:APP_GOLD, REFUSE_BELOW:REFUSE_BELOW, PASS_AT:PASS_AT, clampHex:clampHex, palette:palette,
    contrastRatio:contrastRatio, contrastCheck:contrastCheck, readout:readout, previewHtml:previewHtml, requestBody:requestBody,
    save:save, shellUrl:shellUrl, shellCheck:shellCheck, slotState:slotState};
})();
</script>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var AUTH_WORKER='https://courtsense-email-worker.markmcnees-479.workers.dev';
  var ADMIN_KEY='';
  var SUBS=[];
  var SCHOOLS=null; // cache of the live-schools list; null = not yet fetched
  var SHELL_KIND={}; // slug -> 'folder' | 'firebase' | 'unknown', from csColorKit.shellCheck; cleared on Refresh
  var FILTER='pending';

  // ---- admin key handling (reuses the admin-players.html pattern) ----
  function ensureAdminKey(){
    if(!ADMIN_KEY) ADMIN_KEY=(localStorage.getItem('courtsenseAdminKey')||'').trim();
    if(!ADMIN_KEY){
      ADMIN_KEY=((window.prompt('Worker admin key:')||'').trim());
      if(ADMIN_KEY) localStorage.setItem('courtsenseAdminKey',ADMIN_KEY);
    }
    return ADMIN_KEY;
  }
  function clearAdminKey(){
    localStorage.removeItem('courtsenseAdminKey'); ADMIN_KEY='';
  }

  function showStatus(msg,cls){
    var el=$('statusMsg');
    el.textContent=msg;
    el.className='status-msg '+(cls||'info');
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  // ---- load submissions ----
  function load(){
    var key=ensureAdminKey();
    if(!key){ showStatus('Admin key needed to load submissions.','info'); return; }
    showStatus('Loading submissions...','info');
    fetch(AUTH_WORKER+'/onboard/admin-list',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({adminKey:key})
    }).then(function(r){
      return r.json().then(function(res){ return {status:r.status,res:res}; });
    }).then(function(o){
      if(o.status===403 && o.res && o.res.code==='forbidden'){
        clearAdminKey();
        showStatus('Admin key rejected. Click Refresh to enter it again.','info');
        return;
      }
      if(!o.res || !o.res.ok){
        showStatus('Load failed: '+((o.res&&o.res.error)||('HTTP '+o.status)),'info');
        return;
      }
      SUBS=o.res.submissions||[];
      // newest first by submittedAt string (ISO sorts lexically)
      SUBS.sort(function(a,b){ return (b.submittedAt||'').localeCompare(a.submittedAt||''); });
      render();
    }).catch(function(){
      showStatus('Could not reach the worker. Check your connection and try again.','info');
    });
  }

  // ---- status action ----
  function setStatus(id, status, cardEl, emailCoach){
    var key=ensureAdminKey();
    if(!key) return;
    var btns=cardEl.querySelectorAll('.btn');
    btns.forEach(function(b){ b.disabled=true; });
    var payload={adminKey:key,id:id,status:status};
    if(emailCoach===true) payload.emailCoach=true;
    fetch(AUTH_WORKER+'/onboard/admin-status',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    }).then(function(r){
      return r.json().then(function(res){ return {status:r.status,res:res}; });
    }).then(function(o){
      if(o.status===403 && o.res && o.res.code==='forbidden'){
        clearAdminKey(); btns.forEach(function(b){ b.disabled=false; });
        showStatus('Admin key rejected. Click Refresh to re-enter it.','info');
        return;
      }
      if(!o.res || !o.res.ok){
        btns.forEach(function(b){ b.disabled=false; });
        showStatus('Update failed: '+((o.res&&o.res.error)||('HTTP '+o.status)),'info');
        return;
      }
      // update local state and re-render
      for(var i=0;i<SUBS.length;i++){ if(SUBS[i].id===id){ SUBS[i].status=status; break; } }
      render();
      if(emailCoach===true){
        showStatus(o.res.coachEmailed
          ? 'Rejected. The coach got a polite email.'
          : 'Rejected. The email to the coach did not go out yet; it will retry on the hourly run.','info');
      }
    }).catch(function(){
      btns.forEach(function(b){ b.disabled=false; });
      showStatus('Could not reach the worker. Try again.','info');
    });
  }

  // ---- resend the one-time PIN link ----
  // Mints a fresh link (older ones stop working) and sends the welcome email again. The
  // worker refuses once the coach has set a PIN. The link itself never reaches this page.
  function resendClaim(id, btn, outEl){
    var key=ensureAdminKey();
    if(!key) return;
    if(!window.confirm('Send the coach a new PIN link? Any older link stops working.')) return;
    var orig=btn.textContent;
    btn.disabled=true; btn.textContent='Sending...';
    function say(text, good){
      if(outEl){ outEl.innerHTML='<p class="fnote" style="margin-top:8px;color:'+(good?'#2e7d32':'var(--err)')+';">'+esc(text)+'</p>'; }
      else showStatus(text,'info');
    }
    fetch(AUTH_WORKER+'/onboard/admin-resend-claim',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({adminKey:key,id:id})
    }).then(function(r){
      return r.json().then(function(res){ return {status:r.status,res:res}; }, function(){ return {status:r.status,res:null}; });
    }).then(function(o){
      btn.disabled=false; btn.textContent=orig;
      if(o.status===403 && o.res && o.res.code==='forbidden'){ clearAdminKey(); say('Admin key rejected. Click Refresh to re-enter it.', false); return; }
      if(!o.res || !o.res.ok){ say((o.res&&o.res.error)||('Could not resend (HTTP '+o.status+').'), false); return; }
      say(o.res.welcomeEmailSent
        ? 'A new PIN link went to the coach.'
        : 'The email did not go out yet; it will retry on the hourly run.', !!o.res.welcomeEmailSent);
    }).catch(function(){
      btn.disabled=false; btn.textContent=orig;
      say('Could not reach the worker. Try again.', false);
    });
  }

  // ---- render ----
  function fieldRow(k,v,full){
    if(v==null || v==='') return '';
    return '<div class="row'+(full?' full':'')+'"><div class="k">'+esc(k)+'</div><div class="v">'+v+'</div></div>';
  }
  function link(v){ if(!v) return null; var u=/^https?:\/\//.test(v)?v:'https://'+v; return '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(v)+'</a>'; }
  function mailto(v){ if(!v) return null; return '<a href="mailto:'+esc(v)+'">'+esc(v)+'</a>'; }
  // Live app link for a provisioned slug. Same slug rule as provision; anything else shows nothing.
  function appLink(slug){
    slug=String(slug||'');
    if(!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug)) return null;
    return '<a href="'+esc('https://courtsense.app/'+slug+'/')+'" target="_blank" rel="noopener">courtsense.app/'+esc(slug)+'/</a>';
  }

  function fmtPhone(v){
    if(!v) return null;
    var d=String(v).replace(/\D/g,'');
    if(d.length===11 && d.charAt(0)==='1') d=d.slice(1); // strip US country code
    if(d.length===10) return '('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6);
    return esc(v); // non-standard length: show as entered
  }

  // Logo cell: when the submission has a logo, show a placeholder box with a
  // "Show logo" button that fetches the data URL on demand (admin-logo endpoint).
  function logoCell(s){
    if(!s.hasLogo && !s.logoIncluded) return 'Not provided';
    var fname=esc(s.logoFilename||'file');
    return '<div class="logo-cell">'+
      '<div class="logo-box"><button class="btn show-logo" type="button">Show logo</button></div>'+
      '<span class="logo-fname">'+fname+'</span>'+
      '<div class="logo-err" style="display:none;color:var(--err);font-size:12px;margin-top:4px;"></div>'+
    '</div>';
  }

  function cardHtml(s){
    var govLine=[s.govBody,s.state].filter(Boolean).join(', ');
    // Full mailing address on one line: street, city, state zip. Older submissions
    // (from before city/state/zip existed) only have s.address; filter drops the gaps.
    var addr=[s.address, s.city, [s.addressState,s.zip].filter(Boolean).join(' ')].filter(Boolean).join(', ');
    var colorSw='';
    if(s.color1||s.color2){
      colorSw='<div class="swatches">'+
        (s.color1?'<span class="sw" style="background:'+esc(s.color1)+'"></span>':'')+
        (s.color2?'<span class="sw" style="background:'+esc(s.color2)+'"></span>':'')+
        '</div>';
    }
    var body='<div class="grid">'+
      fieldRow('App', s.status==='approved'?appLink(s.provisionedSlug):null)+
      fieldRow('Coach', esc((s.coachFirstName||'')+' '+(s.coachLastName||''))+(s.coachRole?' &middot; '+esc(s.coachRole):''))+
      fieldRow('Email', mailto(s.coachEmail))+
      fieldRow('Cell', fmtPhone(s.coachCell))+
      fieldRow('Teams', esc(s.gender))+
      fieldRow('Address', esc(addr), true)+
      fieldRow('School phone', fmtPhone(s.phone))+
      fieldRow('Website', link(s.website))+
      fieldRow('Governing body', esc(govLine))+
      fieldRow('Class', esc(s.classification))+
      fieldRow('Division', esc(s.division))+
      fieldRow('District', esc(s.district))+
      fieldRow('Region', esc(s.region))+
      fieldRow('Home venue', esc(s.homeVenue))+
      fieldRow('Season', esc(s.seasonYear))+
      fieldRow('Colors', colorSw+(s.status==='rejected'?'':colorEditHtml(s.color1, s.color2)), true)+
      fieldRow('Logo', logoCell(s)+(s.status==='rejected'?'':logoEditHtml(s.hasLogo)), true)+
      fieldRow('Notes', esc(s.notes), true)+
      fieldRow('Submitted', esc(s.submittedAt), true)+
    '</div>';

    var slugGuess=(window.CSConfigGen? CSConfigGen.shortSlug(s.schoolName) : (s.schoolName||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''));
    var finishPanel='<div class="finish">'+
      '<h4>Finish setup for this school</h4>'+
      '<p class="fnote">Confirm the slug, then create the app. The coach gets a one-time link to set their own PIN. The slug is permanent once the school saves data.</p>'+
      '<div class="frow">'+
        '<div class="ff" data-f="slug"><label>URL slug</label><input class="f-slug" value="'+esc(slugGuess||'school')+'"><div class="ferr">Enter a slug (lowercase, dashes ok).</div></div>'+
        '<div class="ff" data-f="emoji"><label>Team emoji</label><input class="f-emoji" maxlength="4" value="\uD83C\uDFD0"></div>'+
      '</div>'+
      '<button class="genbtn">Create their app</button>'+
      '<div class="gen-out"></div>'+
    '</div>';

    var actions;
    if(s.status==='pending'){
      // "Email the coach" is off by default: most rejects are junk entries.
      actions='<button class="expand">Details</button><div class="spacer"></div>'+
        '<label class="email-coach"><input type="checkbox" class="f-email-coach"> Email the coach</label>'+
        '<button class="btn reject">Reject</button>'+
        '<button class="btn approve">Approve</button>';
    }else{
      actions='<button class="expand">Details</button><div class="spacer"></div>'+
        (s.status==='approved'&&s.provisionedSlug?'<button class="btn resend-claim" type="button">Resend PIN link</button>':'')+
        '<span class="reviewed-note">'+esc(s.status)+(s.reviewedAt?' &middot; '+esc(s.reviewedAt.slice(0,10)):'')+'</span>';
    }

    return '<div class="card" data-id="'+esc(s.id)+'">'+
      '<div class="card-top">'+
        '<div class="card-emoji">'+ (s.gender==='boys'?'\uD83C\uDFD0':'\uD83C\uDFD0') +'</div>'+
        '<div class="card-head">'+
          '<div class="card-school">'+esc(s.schoolName||'(no name)')+'</div>'+
          '<div class="card-coach">'+esc((s.coachFirstName||'')+' '+(s.coachLastName||''))+'</div>'+
          '<div class="card-sub">'+esc(govLine||'')+'</div>'+
        '</div>'+
        '<span class="badge '+esc(s.status||'pending')+'">'+esc(s.status||'pending')+'</span>'+
      '</div>'+
      '<div class="card-body">'+body+finishPanel+'</div>'+
      '<div class="card-actions">'+actions+'</div>'+
    '</div>';
  }

  function render(){
    if(FILTER==='schools'){ renderSchoolsView(); return; }
    var visible=SUBS.filter(function(s){ return FILTER==='all' ? true : (s.status||'pending')==='pending'; });
    var pendingCount=SUBS.filter(function(s){ return (s.status||'pending')==='pending'; }).length;
    $('count').textContent=pendingCount+' pending';
    var list=$('list');
    if(visible.length===0){
      $('statusMsg').className='status-msg';
      list.innerHTML='<div class="status-msg empty">'+(FILTER==='pending'?'No pending submissions. New coach submissions will appear here.':'No submissions yet.')+'</div>';
      return;
    }
    $('statusMsg').className='status-msg';
    list.innerHTML=visible.map(cardHtml).join('');
    // wire per-card handlers
    list.querySelectorAll('.card').forEach(function(card){
      var id=card.getAttribute('data-id');
      var sub=null;
      for(var i=0;i<SUBS.length;i++){ if(SUBS[i].id===id){ sub=SUBS[i]; break; } }
      var exp=card.querySelector('.expand');
      if(exp) exp.addEventListener('click',function(){ card.classList.toggle('open'); });
      var ap=card.querySelector('.btn.approve');
      var rj=card.querySelector('.btn.reject');
      // Approve opens the finish panel (does not mark approved until config is generated)
      if(ap) ap.addEventListener('click',function(){
        card.classList.add('open');
        card.classList.add('finishing');
        var slugIn=card.querySelector('.f-slug'); if(slugIn) slugIn.focus();
      });
      if(rj) rj.addEventListener('click',function(){
        var ec=card.querySelector('.f-email-coach');
        var emailCoach=!!(ec&&ec.checked);
        var msg=emailCoach
          ? 'Reject this submission? The coach gets a short, polite email.'
          : 'Reject this submission? Use this only for fake or junk entries. The coach is not notified.';
        if(window.confirm(msg)){
          setStatus(id,'rejected',card,emailCoach);
        }
      });
      var rc=card.querySelector('.btn.resend-claim');
      if(rc) rc.addEventListener('click',function(){ resendClaim(id, rc); });
      // Generate config inside the finish panel
      var gen=card.querySelector('.genbtn');
      if(gen) gen.addEventListener('click',function(){
        generateConfig(card, sub, id);
      });
      // Show logo: fetch the data URL on demand and render an inline preview
      var showLogo=card.querySelector('.show-logo');
      if(showLogo) showLogo.addEventListener('click',function(){ fetchLogo(id, showLogo, card); });
      wireLogoEdit(card.querySelector('.logo-edit'), {id:id}, function(res){
        if(sub){ sub.hasLogo=true; sub.logoIncluded=true; }
        if(res.target==='school') SCHOOLS=null; // the Schools tab reloads with the new state
        render();
      });
      wireColorEdit(card.querySelector('.color-edit'), {id:id}, sub?sub.schoolName:'', function(res, sent){
        if(sub){ sub.color1=sent.primary; if(sent.accent) sub.color2=sent.accent; }
        if(res.target==='school') SCHOOLS=null; // the Schools tab reloads with the new state
        render();
      });
    });
  }

  // ---- Change colors (pending, approved, and live schools) ----
  // primary and accent are the current values, used to start the pickers.
  function colorEditHtml(primary, accent){
    var p=csColorKit.clampHex(primary)||csColorKit.FALLBACK;
    var a=csColorKit.clampHex(accent)||'';
    var hex=function(cls,v,off){ return '<input class="c-hex '+cls+'" type="text" maxlength="7" spellcheck="false" autocomplete="off" value="'+esc(v)+'"'+(off?' disabled':'')+'>'; };
    return '<div class="color-edit" data-primary="'+esc(p)+'" data-accent="'+esc(a)+'">'+
      '<button class="btn set-colors" type="button">Change colors</button>'+
      '<div class="color-panel" style="display:none;">'+
        '<div class="c-row"><label>Primary</label><input class="c-pick c-primary-pick" type="color" value="'+esc(p.toLowerCase())+'">'+hex('c-primary-hex',p)+'</div>'+
        '<div class="c-row"><label class="c-accent-on"><input class="c-accent-toggle" type="checkbox"> Accent</label>'+
          '<input class="c-pick c-accent-pick" type="color" value="'+esc((a||csColorKit.APP_GOLD).toLowerCase())+'" disabled>'+hex('c-accent-hex',a||csColorKit.APP_GOLD,true)+'</div>'+
        '<div class="c-preview"></div>'+
        '<div class="c-readout"></div>'+
        '<div style="display:flex;gap:8px;"><button class="btn save-colors" type="button">Save colors</button><button class="btn cancel-colors" type="button">Cancel</button></div>'+
      '</div>'+
      '<div class="color-msg" style="display:none;"></div>'+
    '</div>';
  }
  // Pick, preview, check contrast, then Save or Cancel. The accent is sent only when its box
  // is ticked; otherwise the worker keeps the school's current accent.
  function wireColorEdit(box, target, name, onSaved){
    if(!box) return;
    var q=function(c){ return box.querySelector(c); };
    var btn=q('.set-colors'), panel=q('.color-panel'), msg=q('.color-msg');
    var pPick=q('.c-primary-pick'), pHex=q('.c-primary-hex'), aOn=q('.c-accent-toggle'), aPick=q('.c-accent-pick'), aHex=q('.c-accent-hex');
    var prev=q('.c-preview'), out=q('.c-readout'), sv=q('.save-colors'), cancel=q('.cancel-colors');
    var startP=box.getAttribute('data-primary'), startA=box.getAttribute('data-accent');
    function say(t,good){ msg.textContent=t||''; msg.style.display=t?'block':'none'; msg.style.color=good?'#2e7d32':'var(--err)'; }
    function current(){ return {primary:pHex.value.trim(), accent:aOn.checked?aHex.value.trim():null}; }
    function draw(){
      var c=current();
      var r=csColorKit.readout(c.primary, c.accent);
      var colors=csColorKit.palette(c.primary, '');
      prev.innerHTML=csColorKit.previewHtml(name, colors, c.accent!=null?c.accent:(startA||csColorKit.APP_GOLD));
      out.innerHTML=r.lines.map(function(l){ return '<div class="'+l.level+'">'+esc(l.text)+'</div>'; }).join('');
      sv.disabled=!r.ok;
    }
    function syncPick(pick,hexBox){ var h=csColorKit.clampHex(hexBox.value); if(h) pick.value=h.toLowerCase(); }
    function reset(){
      pHex.value=startP; pPick.value=startP.toLowerCase();
      aOn.checked=false; aHex.value=startA||csColorKit.APP_GOLD; aPick.value=(startA||csColorKit.APP_GOLD).toLowerCase();
      aHex.disabled=true; aPick.disabled=true;
      sv.disabled=false; sv.textContent='Save colors';
      panel.style.display='none'; btn.disabled=false;
    }
    btn.addEventListener('click',function(){ say(''); panel.style.display='block'; btn.disabled=true; draw(); });
    pPick.addEventListener('input',function(){ pHex.value=pPick.value.toUpperCase(); draw(); });
    pHex.addEventListener('input',function(){ syncPick(pPick,pHex); draw(); });
    aPick.addEventListener('input',function(){ aHex.value=aPick.value.toUpperCase(); draw(); });
    aHex.addEventListener('input',function(){ syncPick(aPick,aHex); draw(); });
    aOn.addEventListener('change',function(){ aHex.disabled=!aOn.checked; aPick.disabled=!aOn.checked; draw(); });
    cancel.addEventListener('click',function(){ reset(); say(''); });
    sv.addEventListener('click',function(){
      var c=current();
      if(!csColorKit.readout(c.primary, c.accent).ok) return;
      var key=ensureAdminKey(); if(!key) return;
      var sent={primary:csColorKit.clampHex(c.primary), accent:c.accent!=null?csColorKit.clampHex(c.accent):null};
      sv.disabled=true; sv.textContent='Saving...';
      csColorKit.save({fetch:window.fetch.bind(window), worker:AUTH_WORKER, key:key, target:target, primary:sent.primary, accent:sent.accent, onForbidden:clearAdminKey})
        .then(function(res){
          if(!res.ok){ sv.disabled=false; sv.textContent='Save colors'; say(res.error); return; }
          var warn=res.contrast&&((res.contrast.primary&&res.contrast.primary.level==='warn')||(res.contrast.accent&&res.contrast.accent.level==='warn'));
          reset(); say(warn?'Colors saved. Some text is only readable at large sizes.':'Colors saved.',true);
          if(onSaved) onSaved(res, sent);
        });
    });
  }

  // ---- Add or replace a logo (pending, approved, and live schools) ----
  function logoEditHtml(hasLogo){
    return '<div class="logo-edit">'+
      '<button class="btn set-logo" type="button">'+esc(csLogoKit.buttonLabel(!!hasLogo))+'</button>'+
      '<input class="logo-file" type="file" accept="image/png,image/jpeg,image/svg+xml,.png,.jpg,.jpeg,.svg" style="display:none;">'+
      '<div class="logo-new" style="display:none;"></div>'+
      '<div class="logo-msg" style="display:none;"></div>'+
    '</div>';
  }
  // Pick, convert, preview, then Save or Cancel. The PNG lives only in this closure until
  // it is sent; nothing is stored in the page or the browser.
  function wireLogoEdit(box, target, onSaved){
    if(!box) return;
    var btn=box.querySelector('.set-logo'), input=box.querySelector('.logo-file'), prev=box.querySelector('.logo-new'), msg=box.querySelector('.logo-msg');
    var pending={dataUrl:'', name:''};
    function say(t,good){ msg.textContent=t||''; msg.style.display=t?'block':'none'; msg.style.color=good?'#2e7d32':'var(--err)'; }
    function reset(){ pending={dataUrl:'', name:''}; prev.innerHTML=''; prev.style.display='none'; input.value=''; btn.disabled=false; }
    btn.addEventListener('click',function(){ say(''); input.click(); });
    input.addEventListener('change',function(){
      var f=input.files&&input.files[0]; if(!f) return;
      var bad=csLogoKit.fileProblem(f);
      if(bad){ reset(); say(bad); return; }
      btn.disabled=true; say('Preparing...',true);
      csLogoKit.toPng(f).then(function(url){
        btn.disabled=false;
        var why=csLogoKit.outputProblem(url);
        if(why){ reset(); say(why); return; }
        pending={dataUrl:url, name:f.name};
        say('');
        prev.innerHTML='<img alt="New logo preview"><div style="display:flex;gap:8px;"><button class="btn save-logo" type="button">Save logo</button><button class="btn cancel-logo" type="button">Cancel</button></div>';
        prev.querySelector('img').src=url;
        prev.style.display='block';
        prev.querySelector('.cancel-logo').addEventListener('click',function(){ reset(); say(''); });
        prev.querySelector('.save-logo').addEventListener('click',function(){
          var key=ensureAdminKey(); if(!key) return;
          var sv=this; sv.disabled=true; sv.textContent='Saving...';
          csLogoKit.save({fetch:window.fetch.bind(window), worker:AUTH_WORKER, key:key, target:target, dataUrl:pending.dataUrl, filename:pending.name, onForbidden:clearAdminKey})
            .then(function(res){
              if(!res.ok){ sv.disabled=false; sv.textContent='Save logo'; say(res.error); return; }
              reset(); say('Logo saved.',true);
              if(onSaved) onSaved(res);
            });
        });
      });
    });
  }

  function fetchLogo(id, btn, card){
    var key=ensureAdminKey();
    if(!key) return;
    var cell=btn.closest('.logo-cell');
    var errEl=cell?cell.querySelector('.logo-err'):null;
    if(errEl){ errEl.style.display='none'; errEl.textContent=''; }
    var orig=btn.textContent;
    btn.disabled=true; btn.textContent='Loading...';
    fetch(AUTH_WORKER+'/onboard/admin-logo',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({adminKey:key,id:id})
    }).then(function(r){
      return r.json().then(function(res){ return {status:r.status,res:res}; });
    }).then(function(o){
      if(o.status===403 && o.res && o.res.code==='forbidden'){
        clearAdminKey(); btn.disabled=false; btn.textContent=orig;
        if(errEl){ errEl.textContent='Admin key rejected. Click Refresh, then try again.'; errEl.style.display='block'; }
        return;
      }
      if(o.res && o.res.ok && o.res.logoDataUrl){
        var box=btn.closest('.logo-box');
        if(box){
          var img=document.createElement('img');
          img.src=o.res.logoDataUrl; img.alt='Logo preview';
          box.innerHTML=''; box.appendChild(img);
        }
      }else{
        btn.disabled=false; btn.textContent=orig;
        if(errEl){ errEl.textContent=(o.res&&o.res.error)||('Could not load logo (HTTP '+o.status+')'); errEl.style.display='block'; }
      }
    }).catch(function(){
      btn.disabled=false; btn.textContent=orig;
      if(errEl){ errEl.textContent='Could not reach the worker. Try again.'; errEl.style.display='block'; }
    });
  }

  // ── Schools view: list every live school and open any as coach ─────────────
  function renderSchoolsView(force){
    if(SCHOOLS && !force){ renderSchoolsList(SCHOOLS); return; }
    var key=ensureAdminKey();
    if(!key){ showStatus('Admin key needed to load schools.','info'); return; }
    showStatus('Loading schools...','info');
    fetch(AUTH_WORKER+'/onboard/admin-schools',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({adminKey:key})
    }).then(function(r){
      return r.json().then(function(res){ return {status:r.status,res:res}; });
    }).then(function(o){
      if(o.status===403 && o.res && o.res.code==='forbidden'){
        clearAdminKey();
        showStatus('Admin key rejected. Click Refresh to enter it again.','info');
        return;
      }
      if(!o.res || !o.res.ok){
        showStatus('Load failed: '+((o.res&&o.res.error)||('HTTP '+o.status)),'info');
        return;
      }
      SCHOOLS=o.res.schools||[];
      renderSchoolsList(SCHOOLS);
    }).catch(function(){
      showStatus('Could not reach the worker. Check your connection and try again.','info');
    });
  }

  function schoolCardHtml(s){
    var name=s.schoolName||'(no name)';
    var slug=s.slug||'';
    var logoNote=s.hasLogo?'Logo ✓':'No logo';
    return '<div class="card school-card" data-slug="'+esc(slug)+'" data-dbroot="'+esc(s.dbRoot||'')+'">'+
      '<div class="card-top" style="align-items:center;">'+
        '<div class="card-head">'+
          '<div class="card-school">'+esc(name)+'</div>'+
          '<div class="card-sub">'+(appLink(slug)||esc('/'+slug+'/'))+' &middot; '+logoNote+'</div>'+
        '</div>'+
        '<button class="btn approve open-coach">Open as coach</button>'+
      '</div>'+
      '<div style="padding:0 18px 10px;">'+logoEditHtml(s.hasLogo)+'</div>'+
      // Colors: filled in once csColorKit.shellCheck says whether this school has its own page.
      '<div class="color-slot" style="padding:0 18px 10px;">'+
        '<div style="font-size:12.5px;font-weight:600;margin-bottom:4px;">Colors</div>'+
        '<div class="swatches">'+
          (s.primary?'<span class="sw" title="Primary" style="background:'+esc(s.primary)+'"></span>':'')+
          (s.accent?'<span class="sw" title="Accent" style="background:'+esc(s.accent)+'"></span>':'')+
        '</div>'+
        '<div class="color-note">Checking this school\'s page...</div>'+
      '</div>'+
      '<div class="school-err" style="display:none;color:var(--err);font-size:12.5px;padding:0 18px 12px;"></div>'+
      // Coach PIN rotation. Masked entry plus a confirm field, so a typo cannot lock a
      // coach out of their own school. Both fields are cleared after every submit,
      // success or refusal, so the value never sits in the page waiting to be read.
      '<div class="pin-rotate" style="padding:0 18px 14px;">'+
        '<div style="font-size:12.5px;font-weight:600;margin-bottom:6px;">Change coach PIN</div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">'+
          '<input class="f-newpin" type="password" inputmode="numeric" autocomplete="new-password" maxlength="4" placeholder="New 4 digit PIN" style="width:150px;padding:8px 10px;border:1px solid var(--gray-light,#ccc);border-radius:6px;font-size:14px;">'+
          '<input class="f-newpin2" type="password" inputmode="numeric" autocomplete="new-password" maxlength="4" placeholder="Confirm PIN" style="width:150px;padding:8px 10px;border:1px solid var(--gray-light,#ccc);border-radius:6px;font-size:14px;">'+
          '<button class="btn rotate-pin" type="button">Change PIN</button>'+
        '</div>'+
        '<div class="pin-msg" style="display:none;font-size:12.5px;margin-top:8px;"></div>'+
      '</div>'+
    '</div>';
  }

  function renderSchoolsList(schools){
    $('count').textContent=schools.length+' school'+(schools.length===1?'':'s');
    $('statusMsg').className='status-msg';
    var list=$('list');
    if(!schools.length){ list.innerHTML='<div class="status-msg empty">No schools yet.</div>'; return; }
    list.innerHTML=schools.map(schoolCardHtml).join('');
    list.querySelectorAll('.school-card').forEach(function(card){
      var slug=card.getAttribute('data-slug');
      var dbRoot=card.getAttribute('data-dbroot');
      var btn=card.querySelector('.open-coach');
      if(btn) btn.addEventListener('click',function(){ openAsCoach(slug, dbRoot, btn, card); });
      var rbtn=card.querySelector('.rotate-pin');
      if(rbtn) rbtn.addEventListener('click',function(){ rotatePin(dbRoot, rbtn, card); });
      wireLogoEdit(card.querySelector('.logo-edit'), {slug:slug}, function(){
        for(var i=0;i<schools.length;i++){ if(schools[i].slug===slug){ schools[i].hasLogo=true; break; } }
        renderSchoolsList(schools);
      });
      fillColorSlot(card, slug, schools);
    });
  }

  // A folder-page school keeps its colors in its own page, so it gets a note, not the control.
  function fillColorSlot(card, slug, schools){
    var slot=card.querySelector('.color-slot'); if(!slot) return;
    var s=null;
    for(var i=0;i<schools.length;i++){ if(schools[i].slug===slug){ s=schools[i]; break; } }
    function apply(kind){
      if(!slot.isConnected) return; // the list was redrawn while the check ran
      var st=csColorKit.slotState(kind);
      var note=slot.querySelector('.color-note');
      if(!st.control){ note.textContent=st.note; return; }
      note.remove();
      slot.insertAdjacentHTML('beforeend', colorEditHtml(s&&s.primary, s&&s.accent));
      wireColorEdit(slot.querySelector('.color-edit'), {slug:slug}, s?s.schoolName:'', function(res){
        if(s&&res.colors){ s.primary=res.colors.primary||null; s.accent=res.colors.accent||null; }
        renderSchoolsList(schools);
      });
    }
    if(SHELL_KIND[slug]){ apply(SHELL_KIND[slug]); return; }
    csColorKit.shellCheck(window.fetch.bind(window), slug).then(function(kind){ SHELL_KIND[slug]=kind; apply(kind); });
  }

  function openAsCoach(slug, dbRoot, btn, card){
    var key=ensureAdminKey();
    if(!key) return;
    var errEl=card.querySelector('.school-err');
    if(errEl){ errEl.style.display='none'; errEl.textContent=''; }
    if(!dbRoot){ if(errEl){ errEl.textContent='This school has no dbRoot on file.'; errEl.style.display='block'; } return; }
    var orig=btn.textContent;
    btn.disabled=true; btn.textContent='Opening...';
    fetch(AUTH_WORKER+'/auth/admin-coach-session',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({adminKey:key,dbRoot:dbRoot})
    }).then(function(r){
      return r.json().then(function(res){ return {status:r.status,res:res}; });
    }).then(function(o){
      if(o.status===403 && o.res && o.res.code==='forbidden'){
        clearAdminKey(); btn.disabled=false; btn.textContent=orig;
        if(errEl){ errEl.textContent='Admin key rejected. Click Refresh, then try again.'; errEl.style.display='block'; }
        return;
      }
      if(o.res && o.res.ok && o.res.token){
        window.open('https://courtsense.app/'+encodeURIComponent(slug)+'/?csadmin='+encodeURIComponent(o.res.token),'_blank');
        btn.disabled=false; btn.textContent=orig;
      }else{
        btn.disabled=false; btn.textContent=orig;
        if(errEl){ errEl.textContent=(o.res&&o.res.error)||('Could not open (HTTP '+o.status+')'); errEl.style.display='block'; }
      }
    }).catch(function(){
      btn.disabled=false; btn.textContent=orig;
      if(errEl){ errEl.textContent='Could not reach the worker. Try again.'; errEl.style.display='block'; }
    });
  }

  // Coach PIN rotation. The worker owns every rule: length, guessable shapes, values
  // still published in the config registry, and no-op rotations. This side only checks
  // that the two fields agree, then reports whatever the worker says.
  function rotatePin(dbRoot, btn, card){
    var msgEl=card.querySelector('.pin-msg');
    var a=card.querySelector('.f-newpin');
    var b=card.querySelector('.f-newpin2');
    function say(text, good){
      if(!msgEl) return;
      msgEl.textContent=text;
      msgEl.style.color=good?'var(--ok,#1a7f37)':'var(--err)';
      msgEl.style.display='block';
    }
    // Cleared on every exit path, so a PIN never lingers in the DOM.
    function clearFields(){ if(a) a.value=''; if(b) b.value=''; }

    var pin=(a&&a.value||'').trim();
    var pin2=(b&&b.value||'').trim();
    if(!dbRoot){ say('This school has no dbRoot on file.', false); clearFields(); return; }
    if(pin!==pin2){ say('The two PINs do not match.', false); clearFields(); return; }
    if(!/^\d{4}$/.test(pin)){ say('The PIN must be exactly 4 digits.', false); clearFields(); return; }

    var key=ensureAdminKey();
    if(!key){ clearFields(); return; }

    var orig=btn.textContent;
    btn.disabled=true; btn.textContent='Changing...';
    fetch(AUTH_WORKER+'/auth/coach-rotate-pin',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({adminKey:key,dbRoot:dbRoot,pin:pin})
    }).then(function(r){
      return r.json().then(function(res){ return {status:r.status,res:res}; });
    }).then(function(o){
      clearFields();
      btn.disabled=false; btn.textContent=orig;
      if(o.status===403 && o.res && o.res.code==='forbidden'){
        clearAdminKey();
        say('Admin key rejected. Click Refresh, then try again.', false);
        return;
      }
      if(o.res && o.res.ok){
        var ended=o.res.sessionsEnded||0;
        var tail=o.res.sessionsCleared===false
          ? ' Signed-in coaches were NOT signed out; check the worker log.'
          : (ended===1 ? ' 1 signed-in coach was signed out.' : ' '+ended+' signed-in coaches were signed out.');
        say('PIN changed.'+tail, true);
        return;
      }
      say((o.res&&o.res.error)||('Could not change the PIN (HTTP '+o.status+')'), false);
    }).catch(function(){
      clearFields();
      btn.disabled=false; btn.textContent=orig;
      say('Could not reach the worker. Try again.', false);
    });
  }

  function generateConfig(card, sub, id){
    if(!sub) return;
    var slugFF=card.querySelector('.ff[data-f="slug"]');
    var slug=(card.querySelector('.f-slug').value||'').trim();
    var emoji=(card.querySelector('.f-emoji').value||'').trim();
    var btn=card.querySelector('.genbtn');
    var out=card.querySelector('.gen-out');

    // validate. No PIN here: the coach sets their own through the one-time link.
    slugFF.classList.remove('bad');
    if(!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug)){ slugFF.classList.add('bad'); return; }

    var key=ensureAdminKey();
    if(!key){ if(out) out.innerHTML='<div class="fnote" style="color:var(--err);">Admin key needed.</div>'; return; }

    var origLabel=btn?btn.textContent:'Provision school';
    if(btn){ btn.disabled=true; btn.textContent='Provisioning...'; }
    if(out) out.innerHTML='';

    fetch('https://courtsense-email-worker.markmcnees-479.workers.dev/onboard/provision',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ adminKey:key, id:id, slug:slug, teamEmoji:emoji })
    }).then(function(r){
      return r.json().then(function(res){ return {status:r.status,res:res}; }, function(){ return {status:r.status,res:null}; });
    }).then(function(o){
      // 403: same handling as the other admin calls (clear key, re-prompt on next action).
      if(o.status===403 && o.res && o.res.code==='forbidden'){
        clearAdminKey();
        if(btn){ btn.disabled=false; btn.textContent=origLabel; }
        if(out) out.innerHTML='<div class="fnote" style="color:var(--err);">Admin key rejected. Click Refresh to re-enter it.</div>';
        return;
      }
      // Any failure (incl. 409 slug-taken): show the endpoint error, re-enable so the
      // admin can change the slug and retry.
      if(!o.res || !o.res.ok){
        if(btn){ btn.disabled=false; btn.textContent=origLabel; }
        if(out) out.innerHTML='<div class="fnote" style="color:var(--err);">'+esc((o.res&&o.res.error)||('Provisioning failed (HTTP '+o.status+').'))+'</div>';
        return;
      }
      // Success. Provisioning already marked the submission approved server-side; mirror it
      // locally and swap the finish panel for a success block that KEEPS the live URL on
      // screen. No PIN exists to show: the coach sets it from the emailed link. Deliberately
      // no full render() here: it rebuilds cards from cardHtml (no success block) and, under
      // the default Pending filter, would drop this card and lose the URL. Instead reflect
      // approved on this card in place.
      for(var i=0;i<SUBS.length;i++){ if(SUBS[i].id===id){ SUBS[i].status='approved'; SUBS[i].provisionedSlug=slug; break; } }
      var url=o.res.url||('https://courtsense.app/'+slug+'/');
      var finish=card.querySelector('.finish');
      if(finish){
        finish.innerHTML=
          '<h4>School provisioned.</h4>'+
          '<div class="grid" style="margin-top:6px;">'+
            '<div class="row full"><div class="k">Live URL</div><div class="v"><a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(url)+'</a></div></div>'+
          '</div>'+
          (o.res.welcomeEmailSent
            ? '<p class="fnote" style="margin-top:10px;color:#2e7d32;">PIN link sent to the coach.</p>'
            : '<p class="fnote" style="margin-top:10px;color:var(--err);">The welcome email did not go out yet. Use Resend PIN link.</p>')+
          '<button class="btn resend-claim" type="button" style="margin-top:6px;">Resend PIN link</button>'+
          '<div class="resend-out"></div>';
        var rcb=finish.querySelector('.btn.resend-claim');
        if(rcb) rcb.addEventListener('click',function(){ resendClaim(id, rcb, finish.querySelector('.resend-out')); });
      }
      var badge=card.querySelector('.badge');
      if(badge){ badge.className='badge approved'; badge.textContent='approved'; }
      card.querySelectorAll('.card-actions .btn').forEach(function(b){ b.disabled=true; });
      $('count').textContent=SUBS.filter(function(s){ return (s.status||'pending')==='pending'; }).length+' pending';
    }).catch(function(){
      if(btn){ btn.disabled=false; btn.textContent=origLabel; }
      if(out) out.innerHTML='<div class="fnote" style="color:var(--err);">Could not reach the worker. Try again.</div>';
    });
  }

  function block(title,key,text){
    return '<div class="out-block"><div class="out-head"><h5>'+esc(title)+'</h5>'+
      '<button class="copy-btn">Copy</button></div><pre>'+esc(text)+'</pre></div>';
  }

  // ---- controls ----
  $('refreshBtn').addEventListener('click',function(){
    if(FILTER==='schools'){ SCHOOLS=null; SHELL_KIND={}; renderSchoolsView(true); }
    else load();
  });
  $('keyBtn').addEventListener('click',function(){ clearAdminKey(); load(); });
  document.querySelectorAll('.filter button').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.filter button').forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      FILTER=b.getAttribute('data-filter');
      render();
    });
  });

  load();
})();
</script>
