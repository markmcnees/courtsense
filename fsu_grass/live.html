<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>FSU Grass Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --garnet:#782F40;
    --garnet-dark:#5A2331;
    --garnet-deep:#471a26;
    --gold:#CEB888;
    --gold-dark:#A8894C;
    --cream:#F4EFE7;
    --paper:#FBF7F0;
    --ink:#1d1115;
    --slate:#4f3f44;
    --white:#FFFFFF;
    --line:#d9ccbd;
    --green:#1f5a26;
    --green-bg:#e3f0e4;
    --mine:#fff3c4;
    --mine-line:#b8860b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Barlow',system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.45;font-size:18px;-webkit-font-smoothing:antialiased;}
  .hero{background:linear-gradient(160deg,var(--garnet) 0%,var(--garnet-deep) 100%);color:var(--white);padding:24px 16px 26px;text-align:center;position:relative;}
  .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--gold) 0%,var(--gold-dark) 100%);}
  .eyebrow{font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);}
  .hero h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(36px,9vw,56px);letter-spacing:1.5px;line-height:1;font-weight:400;margin-top:4px;}
  .hero .when{color:var(--cream);font-size:18px;margin-top:8px;}
  .hero .when:empty{display:none;}
  .pills{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-radius:999px;padding:6px 14px;background:var(--white);color:var(--garnet-deep);}
  .pill.live{background:rgba(255,255,255,.14);color:var(--white);text-transform:none;letter-spacing:0;font-weight:600;}
  .dot{width:10px;height:10px;border-radius:50%;background:#7CFC8A;box-shadow:0 0 0 3px rgba(124,252,138,.25);}
  .pill.live.slow .dot{background:var(--gold);box-shadow:none;}
  .wrap{max-width:720px;margin:0 auto;padding:16px 16px 40px;}
  .card{background:var(--white);border-radius:14px;box-shadow:0 6px 24px rgba(71,26,38,0.12);padding:18px 16px;margin-bottom:16px;}
  .card.center{text-align:center;padding:30px 20px;}
  .cico{font-size:46px;line-height:1;margin-bottom:10px;}
  h2{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--garnet);letter-spacing:.8px;line-height:1.05;margin-bottom:10px;font-weight:400;}
  h3{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--garnet);letter-spacing:.6px;line-height:1.1;margin:4px 0 8px;font-weight:400;}
  .muted{color:var(--slate);font-size:16px;}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
  .tab{flex:0 0 auto;min-height:48px;padding:10px 18px;border-radius:10px;border:2px solid var(--garnet);background:var(--white);color:var(--garnet);font-family:'Barlow',sans-serif;font-size:18px;font-weight:700;cursor:pointer;}
  .tab.on{background:var(--garnet);color:var(--white);}
  .find{display:flex;flex-direction:column;gap:6px;}
  .find label{font-size:14px;font-weight:700;color:var(--garnet);text-transform:uppercase;letter-spacing:.7px;}
  .find select{font-family:'Barlow',sans-serif;font-size:18px;min-height:52px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%;}
  .court-now{display:grid;grid-template-columns:1fr;gap:10px;}
  @media (min-width:600px){ .court-now{grid-template-columns:1fr 1fr;} }
  .cn{border:2px solid var(--line);border-radius:12px;padding:12px 14px;}
  .cn-court{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--garnet);letter-spacing:.6px;line-height:1;}
  .cn-teams{font-size:20px;font-weight:700;margin-top:6px;line-height:1.3;}
  .cn-teams .vs{display:block;font-size:14px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.6px;}
  .cn-meta{font-size:16px;color:var(--slate);margin-top:6px;}
  table.st{width:100%;border-collapse:collapse;font-size:18px;}
  table.st th{font-size:13px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.6px;text-align:right;padding:6px 6px;border-bottom:2px solid var(--line);}
  table.st th.l,table.st td.l{text-align:left;}
  table.st td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;}
  table.st td.rk{width:34px;text-align:center;font-weight:700;color:var(--garnet);}
  table.st td.tn{font-weight:700;word-break:break-word;}
  table.st tr.adv td.rk{background:var(--green-bg);color:var(--green);}
  table.st tr.cut td{border-bottom:3px solid var(--green);}
  .legend{font-size:15px;color:var(--slate);margin-top:8px;}
  .legend b{color:var(--green);}
  .wave{font-size:14px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.8px;margin:16px 0 6px;}
  .mcard{background:var(--white);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 14px;}
  .mcard-h{font-size:15px;font-weight:700;color:var(--slate);margin-bottom:8px;line-height:1.35;}
  .mcard-t{display:flex;align-items:center;gap:10px;min-height:34px;font-size:19px;}
  .mcard-seed{flex:0 0 auto;min-width:36px;font-size:14px;font-weight:800;color:var(--white);background:var(--garnet);border-radius:7px;padding:2px 7px;text-align:center;}
  .mcard-n{flex:1 1 auto;min-width:0;font-weight:600;overflow-wrap:break-word;}
  .mcard-t.win .mcard-n{font-weight:800;color:var(--ink);}
  .mcard-s{flex:0 0 auto;white-space:nowrap;font-weight:800;font-variant-numeric:tabular-nums;color:var(--green);}
  .mcard-tbd{color:var(--slate);font-style:italic;font-weight:600;}
  .mcard-np{font-size:16px;color:var(--slate);margin-top:4px;}
  .mcard-ref{font-size:16px;color:var(--ink);margin-top:6px;}
  .bye-note{font-size:16px;font-style:italic;color:var(--slate);margin:0 0 12px;}
  .rhead{font-size:15px;font-weight:800;color:var(--ink);text-transform:uppercase;letter-spacing:.8px;margin:6px 0 10px;}
  .mcard.mine{background:var(--mine);border-color:var(--mine-line);}
  .mh{display:flex;justify-content:space-between;gap:10px;font-size:15px;color:var(--slate);font-weight:600;margin-bottom:6px;flex-wrap:wrap;}
  .side{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:19px;padding:3px 0;}
  .side .nm{font-weight:600;word-break:break-word;}
  .side.win .nm{font-weight:800;color:var(--green);}
  .side .sc{display:flex;gap:12px;font-variant-numeric:tabular-nums;font-weight:700;flex:0 0 auto;}
  .side .sc span{min-width:26px;text-align:right;}
  .side .sc .w{color:var(--green);}
  .seed{font-size:14px;color:var(--slate);font-weight:700;margin-right:6px;}
  .unplayed{font-size:15px;color:var(--slate);font-style:italic;}
  .mine{background:var(--mine);border-color:var(--mine-line) !important;}
  table.st tr.mine td{background:var(--mine);}
  .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:middle;background:#ece4f0;color:#4a2a5e;}
  .tag.tie{background:#fbeee0;color:#7a4106;}
  .champ{background:var(--garnet);color:var(--white);opacity:1;border-radius:12px;padding:16px;text-align:center;margin-bottom:12px;}
  .champ .lbl{font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--white);}
  .champ .nm, .champ .nm .tag{color:var(--white);}
  .champ .nm{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:1px;line-height:1.1;margin-top:4px;}
  .live-dot{display:inline-flex;align-items:center;gap:6px;background:#c81e1e;color:#fff;font-size:13px;font-weight:800;letter-spacing:1px;border-radius:6px;padding:3px 8px;vertical-align:middle;}
  .live-dot::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:lp 1.2s ease-in-out infinite;}
  @keyframes lp{0%,100%{opacity:1;}50%{opacity:.25;}}
  .liveline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:18px;font-weight:800;color:#b3121b;margin-top:6px;font-variant-numeric:tabular-nums;}
  .cn.is-live{border-color:#c81e1e;}
  .br{display:flex;gap:16px;overflow-x:auto;align-items:flex-start;padding-bottom:6px;}
  .br-col{flex:0 0 320px;min-width:320px;}
  @media (max-width:700px){ .br{flex-direction:column;overflow-x:visible;} .br-col{flex:none;min-width:0;width:100%;} }
  .places{font-size:17px;line-height:1.7;margin:0 0 12px;}
  .places b{color:var(--garnet);display:inline-block;min-width:44px;}
  .foot{text-align:center;padding:4px 16px 36px;font-size:14px;color:var(--slate);}
  .foot a{color:var(--garnet);font-weight:700;text-decoration:none;}
</style>
</head>
<body>

<header class="hero">
  <div class="eyebrow">FSU Grass Club</div>
  <h1 id="t-name">Tournament</h1>
  <div class="when" id="t-when"></div>
  <div class="pills"><span class="pill" id="t-status" hidden></span><span class="pill live" id="t-live" hidden><span class="dot" aria-hidden="true"></span><span id="t-live-txt"></span></span></div>
</header>

<main class="wrap" id="app" aria-live="polite">
  <div class="card center"><p class="muted">Loading the tournament...</p></div>
</main>

<footer class="foot">
  <a href="https://courtsense.app">Powered by CourtSense</a>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script>
// ===== TN ENGINE START =====
// ---- Club tournament engine (divisions, pools, playoffs) ------------------
// Pure functions only: no DOM, no Firebase, no globals read or written, and nothing passed in is
// ever mutated. Every name starts with tn. scripts/tn-engine-test.js runs this block on its own.
// Later steps store one tournament at grass_club_matches/tournaments/{tid} in this shape:
//   meta      { name, date, status:'registration'|'setup'|'pools'|'playoffs'|'final', createdAt, updatedAt }
//   divisions { divId: { name, category:'coed'|'mens'|'womens'|'open', teamSize:2|3|4, rosterMax,
//               coed:{minGuys,minGirls}|null, poolCount, advancePerPool, courts:[n],
//               pool:{bestOf:1|3, scoreTo, cap, thirdSetTo}, playoff:{bestOf:1|3, scoreTo, cap, thirdSetTo} } }
//   teams     { teamId: { divId, name, seed, pool, captainAccountId, players:[ {accountId, name, gender} ] } }
//   pools     { divId: { poolKey: { teamIds:[], courts:[], matches:[ {mid, round, wave, court, t1, t2, ref} ] } } }
//   bracket   { divId: { rounds:[ [ {mid, round, slot, t1, t2, fromA?, fromB?, seedA?, seedB?, court?, bye?} ] ] } }
//   results   { mid: { t1, t2, sets:[ {a,b} ], winner, at, by, byRole } }
// A single game is sets of length 1. In a result, a is t1's points and b is t2's. Every player is a
// CourtSense account, identified by accountId (the tally_kotb_pickup/players key), and there are no
// guests. Tournament players are not club members: nothing here reads or writes the club roster.
// Gender is 'M' | 'F' | null; 'male' and 'female' in any case are read the same way, and anything
// else (the account's 'unspecified' included) counts toward neither coed minimum.
// results is keyed by mid for the whole tournament, so pool and bracket mids take an optional
// prefix (the divId) that keeps two divisions' "A-r1-m1" or "po-r1-m1" apart.
// Tournament results stay apart from Kings Night: nothing here touches practiceTournaments.

// Firebase hands arrays back as objects when they have gaps, so every list goes through tnArr.
function tnArr(v){
  if(Array.isArray(v)) return v.filter(function(x){ return x!=null; });
  if(v&&typeof v==='object') return Object.keys(v).sort(function(a,b){ return a-b; }).map(function(k){ return v[k]; }).filter(function(x){ return x!=null; });
  return [];
}
function tnClone(v){ return v==null?null:JSON.parse(JSON.stringify(v)); }
function tnNum(v){
  if(typeof v==='number') return (isFinite(v)&&v>=0&&Math.floor(v)===v)?v:null;
  var s=String(v==null?'':v).trim();
  return /^\d{1,3}$/.test(s)?parseInt(s,10):null;
}
function tnGender(g){
  var s=String(g==null?'':g).trim().toLowerCase();
  return (s==='m'||s==='male')?'M':(s==='f'||s==='female')?'F':null;
}
function tnPoolKey(i){ return i<26?String.fromCharCode(65+i):'P'+(i+1); }
function tnMidPrefix(p){ return (p==null||p==='')?'':String(p)+'-'; }

// Round robin by the circle method, ported from the 4v4 league generator. An odd count gets a BYE
// sentinel that never appears in the output. Returns rounds, each a list of { a, b } pairings.
function tnRoundRobin(teamIds){
  var BYE='__BYE__', ids=tnArr(teamIds).slice();
  if(ids.length<2) return [];
  if(ids.length%2===1) ids.push(BYE);
  var n=ids.length, rounds=[], rot=ids.slice(1);
  for(var r=0;r<n-1;r++){
    var seq=[ids[0]].concat(rot), round=[];
    for(var i=0;i<n/2;i++){
      var a=seq[i], b=seq[n-1-i];
      if(a!==BYE&&b!==BYE) round.push({a:a, b:b});
    }
    rounds.push(round);
    rot=[rot[rot.length-1]].concat(rot.slice(0,-1));
  }
  return rounds;
}

// Teams in seed order: seeded teams by seed ascending, then unseeded teams by name, then id.
// teams may be a list of { id or teamId, seed, name } or the teams map keyed by teamId.
function tnTeamList(teams){
  if(Array.isArray(teams)) return teams.filter(Boolean).map(function(t){ return {id:(t.teamId!=null?t.teamId:t.id), seed:t.seed, name:t.name||''}; });
  return Object.keys(teams||{}).filter(function(k){ return !!teams[k]; }).map(function(k){ return {id:k, seed:teams[k].seed, name:teams[k].name||''}; });
}
function tnSeedVal(s){
  if(s==null||s==='') return null;
  var n=+s; return (isFinite(n)&&n>0)?n:null;
}
function tnSeedOrder(list){
  return list.slice().sort(function(a,b){
    var sa=tnSeedVal(a.seed), sb=tnSeedVal(b.seed);
    if(sa!=null&&sb!=null&&sa!==sb) return sa-sb;
    if((sa!=null)!==(sb!=null)) return sa!=null?-1:1;
    var c=String(a.name).localeCompare(String(b.name));
    if(c) return c;
    return String(a.id)<String(b.id)?-1:String(a.id)>String(b.id)?1:0;
  });
}
// Snake the seed order into pools A, B, C...: 1 2 3 then 6 5 4 then 7 8 9. Each pool lists its
// teams in seed order. Returns { A:[teamId...], B:[...] }.
function tnSnakePools(teams,poolCount){
  var P=Math.max(1,Math.floor(+poolCount)||1), out={};
  for(var i=0;i<P;i++) out[tnPoolKey(i)]=[];
  tnSeedOrder(tnTeamList(teams)).forEach(function(t,idx){
    var row=Math.floor(idx/P), col=idx%P;
    if(row%2===1) col=P-1-col;
    out[tnPoolKey(col)].push(t.id);
  });
  return out;
}

// Every match of one pool. Rounds come from tnRoundRobin and stay in order. A round with more
// matches than the pool has courts spills into later waves, so waves count up across the pool and
// no team ever plays twice in one wave. Courts go in order within each wave. Each match gets a ref:
// a pool team not playing in that wave and not already reffing in it, fewest ref duties first, then
// the team on a bye that round, then pool order. ref is null when every team is on the sand.
// Returns { teamIds, courts, matches } ready to store at pools/{divId}/{poolKey}.
function tnSchedulePool(poolKey,teamIds,courts,idPrefix){
  var ids=tnArr(teamIds), cs=tnArr(courts), C=Math.max(1,cs.length), pre=tnMidPrefix(idPrefix);
  var refCount={}, order={}, matches=[], wave=0;
  ids.forEach(function(id,i){ refCount[id]=0; order[id]=i; });
  tnRoundRobin(ids).forEach(function(round,ri){
    var inRound={};
    round.forEach(function(p){ inRound[p.a]=1; inRound[p.b]=1; });
    var list=round.map(function(p,mi){ return {mid:pre+poolKey+'-r'+(ri+1)+'-m'+(mi+1), round:ri+1, t1:p.a, t2:p.b}; });
    for(var start=0;start<list.length;start+=C){
      wave++;
      var batch=list.slice(start,start+C), busy={};
      batch.forEach(function(m){ busy[m.t1]=1; busy[m.t2]=1; });
      batch.forEach(function(m,ci){
        var cands=ids.filter(function(id){ return !busy[id]; }).sort(function(a,b){
          return (refCount[a]-refCount[b])||((inRound[a]?1:0)-(inRound[b]?1:0))||(order[a]-order[b]);
        });
        var ref=cands.length?cands[0]:null;
        if(ref!=null){ busy[ref]=1; refCount[ref]++; }
        matches.push({mid:m.mid, round:m.round, wave:wave, court:cs.length?cs[ci]:null, t1:m.t1, t2:m.t2, ref:ref});
      });
    }
  });
  tnBalanceRefs(matches,ids);
  return {teamIds:ids.slice(), courts:cs.slice(), matches:matches};
}
// The first pass above can leave ref duty uneven (five teams on one court lands at 3 and 1). This
// moves duty from the busiest team along a chain of hand offs (X gives a match to Y, Y gives one to
// Z...) to a team at least two duties lighter, where each new ref is free in that match's wave.
// Every move lowers the spread, so it stops; changes only the matches list it is handed.
function tnBalanceRefs(matches,ids){
  var playing={}, reffing={};
  matches.forEach(function(m){
    var p=(playing[m.wave]=playing[m.wave]||{}); p[m.t1]=1; p[m.t2]=1;
    if(m.ref!=null) (reffing[m.wave]=reffing[m.wave]||{})[m.ref]=1;
  });
  for(var guard=0;guard<500;guard++){
    var c={}; ids.forEach(function(id){ c[id]=0; });
    matches.forEach(function(m){ if(m.ref!=null) c[m.ref]++; });
    var starts=ids.slice().sort(function(a,b){ return c[b]-c[a]; }), hit=null, prev=null;
    for(var si=0;si<starts.length&&!hit;si++){
      var s=starts[si], queue=[s];
      prev={}; prev[s]={from:null, m:null};
      while(queue.length&&!hit){
        var X=queue.shift();
        if(X!==s&&c[X]<=c[s]-2){ hit=X; break; }
        matches.forEach(function(m){
          if(m.ref!==X) return;
          ids.forEach(function(Y){
            if(prev[Y]||playing[m.wave][Y]||(reffing[m.wave]||{})[Y]) return;
            prev[Y]={from:X, m:m}; queue.push(Y);
          });
        });
      }
    }
    if(!hit) return;
    for(var Z=hit;prev[Z].from!=null;Z=prev[Z].from){
      var step=prev[Z], w=step.m.wave;
      reffing[w][step.from]=0; reffing[w][Z]=1; step.m.ref=Z;
    }
  }
}

// One set against its target. A set ends when a side reaches the target with a 2 point lead, or
// reaches the cap (the cap overrides win by 2). Returns an error string, or '' when the set is valid.
function tnSetError(s,target,cap){
  var a=tnNum(s&&s.a), b=tnNum(s&&s.b);
  if(a==null||b==null) return 'scores must be whole numbers';
  if(a===b) return 'a set cannot end tied';
  var w=Math.max(a,b), l=Math.min(a,b), c=(cap&&cap>=target)?cap:0;
  if(w<target) return 'not finished, the winner needs '+target;
  if(c&&w>c) return 'over the cap of '+c;
  if(w===target&&l<=target-2) return '';
  if(c&&w===c&&l===c-1) return '';
  if(w>target&&w-l===2) return '';
  return w===target?'must be won by 2':'past '+target+' a set ends at a 2 point lead'+(c?' or at '+c:'');
}
// The winner of a match from its sets. fmt { bestOf:1|3, scoreTo, cap, thirdSetTo }: set 3 plays to
// thirdSetTo when it is set, with win by 2 and no cap (the cap is written for scoreTo). Returns
// { winner:'t1'|'t2'|null, valid, reason }; winner is null and valid true while the match is
// unfinished, and valid is false for any bad set or a set played after the match was decided.
function tnMatchWinner(result,fmt){
  var f=fmt||{}, bestOf=(+f.bestOf===3)?3:1, need=(bestOf===3)?2:1;
  var scoreTo=+f.scoreTo||21, cap=+f.cap||0, third=+f.thirdSetTo||0;
  var sets=tnArr(result&&result.sets);
  if(!sets.length) return {winner:null, valid:true, reason:'No sets entered'};
  if(sets.length>bestOf) return {winner:null, valid:false, reason:'More sets than best of '+bestOf};
  var w1=0, w2=0;
  for(var i=0;i<sets.length;i++){
    if(w1===need||w2===need) return {winner:null, valid:false, reason:'Set '+(i+1)+' was entered after the match was decided'};
    var isThird=(i===2&&third>0);
    var err=tnSetError(sets[i],isThird?third:scoreTo,isThird?0:cap);
    if(err) return {winner:null, valid:false, reason:'Set '+(i+1)+': '+err};
    if(tnNum(sets[i].a)>tnNum(sets[i].b)) w1++; else w2++;
  }
  if(w1===need) return {winner:'t1', valid:true, reason:''};
  if(w2===need) return {winner:'t2', valid:true, reason:''};
  return {winner:null, valid:true, reason:'Match not finished'};
}
// The result's sides for a scheduled match: { t1, t2 } with a scores belonging to t1. The result's
// own t1 and t2 win when present, and must be the match's two teams; null when they are not.
function tnResultSides(m,r){
  var t1=(r&&r.t1!=null)?r.t1:m.t1, t2=(r&&r.t2!=null)?r.t2:m.t2;
  if(!t1||!t2||t1===t2) return null;
  var ok=(t1===m.t1&&t2===m.t2)||(t1===m.t2&&t2===m.t1);
  return ok?{t1:t1, t2:t2}:null;
}

// Standings for one pool. Only finished, valid results whose teams match the scheduled match count.
// Order: wins; head to head when exactly two teams share a win total; then set difference, point
// difference, fewest points against. Teams still level after that keep teamIds order (the pool's
// seed order) and carry tieUnresolved:true. rank is the 1 based position.
function tnPoolStandings(teamIds,matches,results,fmt){
  var ids=tnArr(teamIds), res=results||{}, rows={}, h2h={};
  ids.forEach(function(id,i){ rows[id]={teamId:id, mp:0, w:0, l:0, setsW:0, setsL:0, ptsFor:0, ptsAgainst:0, pd:0, rank:0, tieUnresolved:false, _o:i}; });
  tnArr(matches).forEach(function(m){
    var r=m&&res[m.mid]; if(!r) return;
    var x=tnResultSides(m,r); if(!x) return;
    var A=rows[x.t1], B=rows[x.t2]; if(!A||!B) return;
    var mw=tnMatchWinner(r,fmt); if(!mw.valid||!mw.winner) return;
    tnArr(r.sets).forEach(function(s){
      var a=tnNum(s.a), b=tnNum(s.b);
      A.ptsFor+=a; A.ptsAgainst+=b; B.ptsFor+=b; B.ptsAgainst+=a;
      if(a>b){ A.setsW++; B.setsL++; } else { B.setsW++; A.setsL++; }
    });
    A.mp++; B.mp++;
    var win=(mw.winner==='t1')?A:B, lose=(win===A)?B:A;
    win.w++; lose.l++;
    h2h[win.teamId+'|'+lose.teamId]=(h2h[win.teamId+'|'+lose.teamId]||0)+1;
  });
  var list=ids.map(function(id){ var r=rows[id]; r.pd=r.ptsFor-r.ptsAgainst; return r; });
  list.sort(function(a,b){ return (b.w-a.w)||(a._o-b._o); });
  var out=[], i=0;
  while(i<list.length){
    var j=i; while(j<list.length&&list[j].w===list[i].w) j++;
    out=out.concat(tnBreakTie(list.slice(i,j),h2h));
    i=j;
  }
  return out.map(function(r,k){ var c=tnClone(r); delete c._o; c.rank=k+1; return c; });
}
function tnStatCmp(a,b){
  return ((b.setsW-b.setsL)-(a.setsW-a.setsL))||(b.pd-a.pd)||(a.ptsAgainst-b.ptsAgainst);
}
function tnBreakTie(group,h2h){
  if(group.length<2) return group;
  if(group.length===2){
    var a=group[0], b=group[1], ha=h2h[a.teamId+'|'+b.teamId]||0, hb=h2h[b.teamId+'|'+a.teamId]||0;
    if(ha!==hb) return ha>hb?[a,b]:[b,a];
  }
  var g=group.slice().sort(function(x,y){ return tnStatCmp(x,y)||(x._o-y._o); });
  for(var k=1;k<g.length;k++){
    if(!tnStatCmp(g[k-1],g[k])){ g[k-1].tieUnresolved=true; g[k].tieUnresolved=true; }
  }
  return g;
}

// Cross pool playoff seeds. divisionStandings is { poolKey: tnPoolStandings rows }. Every pool's
// first place team is ranked among the other first places (win %, set difference, point difference,
// fewest points against, then pool key), then every second place, and so on down to
// advancePerPool. Returns [ { seed, teamId, pool, poolRank } ] in seed order.
function tnSeedPlayoffs(divisionStandings,advancePerPool){
  var S=divisionStandings||{}, K=Math.max(0,Math.floor(+advancePerPool)||0), out=[];
  var keys=Object.keys(S).sort();
  var pct=function(r){ return r.mp?r.w/r.mp:0; };
  for(var k=0;k<K;k++){
    var tier=[];
    keys.forEach(function(pk){
      var rows=tnArr(S[pk]).slice().sort(function(a,b){ return (a.rank||0)-(b.rank||0); });
      if(rows[k]) tier.push({row:rows[k], pool:pk});
    });
    tier.sort(function(x,y){ return (pct(y.row)-pct(x.row))||tnStatCmp(x.row,y.row)||(x.pool<y.pool?-1:x.pool>y.pool?1:0); });
    tier.forEach(function(t){ out.push({seed:out.length+1, teamId:t.row.teamId, pool:t.pool, poolRank:k+1}); });
  }
  return out;
}

// Seed numbers in bracket order for a power of two: 1 8 4 5 2 7 3 6 for eight, the same pattern
// for sixteen. Consecutive pairs are first round matches.
function tnBracketOrder(size){
  var o=[1];
  while(o.length<size){
    var n=o.length*2, nx=[];
    o.forEach(function(s){ nx.push(s,n+1-s); });
    o=nx;
  }
  return o;
}
// Single elimination from tnSeedPlayoffs output. The draw is the next power of two and byes fall to
// the top seeds. A first round match between two teams from the same pool swaps its lower seed with
// the next seed in the same pool finish tier (then the one before) when that clears it without
// making another same pool match; otherwise it stands. A bye match carries bye:true and its team
// moves straight on. Later matches name their feeders in fromA and fromB. Returns { rounds }.
// opts.thirdPlace (4 or more teams) adds {prefix}po-3rd to the last round: the two semifinal
// losers (fromLoser) play for third.
function tnBuildBracket(seeds,idPrefix,opts){
  var list=tnArr(seeds).slice().sort(function(a,b){ return (+a.seed||0)-(+b.seed||0); });
  var N=list.length, pre=tnMidPrefix(idPrefix);
  if(N<2) return {rounds:[]};
  var size=2; while(size<N) size*=2;
  var at=function(n){ return list[n-1]; };
  var slots=tnBracketOrder(size).map(function(n){ return n<=N?n:null; });
  var samePool=function(x,y){ return x!=null&&y!=null&&at(x).pool!=null&&at(x).pool===at(y).pool; };
  var tierOf=function(n){ return at(n).poolRank||0; };
  for(var p=0;p<slots.length;p+=2){
    var x=slots[p], y=slots[p+1];
    if(!samePool(x,y)) continue;
    var hi=Math.min(x,y), lo=Math.max(x,y), loIdx=(slots[p]===lo)?p:p+1;
    [lo+1,lo-1].some(function(c){
      if(c<1||c>N||c===hi||tierOf(c)!==tierOf(lo)) return false;
      var j=slots.indexOf(c), o=slots[j%2===0?j+1:j-1];
      if(o==null||o===lo) return false;
      if(samePool(hi,c)||samePool(o,lo)) return false;
      slots[loIdx]=c; slots[j]=lo;
      return true;
    });
  }
  var rounds=[], r1=[];
  for(var q=0;q<slots.length;q+=2){
    var A=slots[q], B=slots[q+1];
    if(A==null){ A=B; B=null; }
    var m={mid:pre+'po-r1-m'+(q/2+1), round:1, slot:q/2+1, t1:at(A).teamId, t2:B!=null?at(B).teamId:null, seedA:at(A).seed};
    if(B!=null) m.seedB=at(B).seed; else m.bye=true;
    r1.push(m);
  }
  rounds.push(r1);
  for(var r=2, count=size/4; count>=1; r++, count/=2){
    var rd=[];
    for(var s=1;s<=count;s++){
      rd.push({mid:pre+'po-r'+r+'-m'+s, round:r, slot:s, t1:null, t2:null,
        fromA:pre+'po-r'+(r-1)+'-m'+(2*s-1), fromB:pre+'po-r'+(r-1)+'-m'+(2*s)});
    }
    rounds.push(rd);
  }
  if(opts&&opts.thirdPlace&&N>=4&&rounds.length>=2){
    var semis=rounds[rounds.length-2];
    rounds[rounds.length-1].push({mid:pre+'po-3rd', round:rounds.length, slot:2, t1:null, t2:null,
      fromA:semis[0].mid, fromB:semis[1].mid, fromLoser:true});
  }
  var filled=tnAdvance({rounds:rounds},{},null);
  return {rounds:filled.rounds};
}
// Winners carried forward through a copy of the bracket; the input is never changed and no result
// is ever removed. Each later match takes its teams from its feeders' winners. A result that no
// longer fits its match (the teams changed after a feeder edit, the teams are not both known yet,
// a result on a bye, or an invalid score) is left in place, gives no winner, and is listed in
// conflicts as { mid, kind, reason }. A fromLoser match (third place) takes its feeders' losers.
// Returns { rounds, conflicts, champion, won, lost } (won and lost: mid to team id or null).
function tnAdvance(bracket,results,fmt){
  var rounds=tnArr(bracket&&bracket.rounds).map(function(rd){ return tnArr(rd).map(function(m){ return tnClone(m); }); });
  var res=results||{}, conflicts=[], winners={}, losers={};
  var get=function(map,mid){ return Object.prototype.hasOwnProperty.call(map,mid)?map[mid]:null; };
  rounds.forEach(function(rd,ri){
    rd.forEach(function(m){
      if(ri>0&&(m.fromA||m.fromB)){ var src=m.fromLoser?losers:winners; m.t1=m.fromA?get(src,m.fromA):null; m.t2=m.fromB?get(src,m.fromB):null; }
      var w=tnBracketWinner(m,res[m.mid],fmt,conflicts);
      winners[m.mid]=w;
      losers[m.mid]=(w&&!m.bye)?(w===m.t1?m.t2:m.t1):null;
    });
  });
  var last=rounds.length?rounds[rounds.length-1]:[], fin=last.filter(function(m){ return !m.fromLoser; });
  return {rounds:rounds, conflicts:conflicts, champion:(fin.length===1?get(winners,fin[0].mid):null), won:winners, lost:losers};
}
function tnBracketWinner(m,r,fmt,conflicts){
  var t1=m.t1||null, t2=m.t2||null;
  if(m.bye){
    if(r) conflicts.push({mid:m.mid, kind:'bye', reason:'A result was saved for a bye'});
    return t1||t2;
  }
  if(!r) return null;
  if(!t1||!t2){ conflicts.push({mid:m.mid, kind:'teams_unknown', reason:'A result is saved but both teams are not known yet'}); return null; }
  var x=tnResultSides({t1:t1, t2:t2},r);
  if(!x){ conflicts.push({mid:m.mid, kind:'teams_changed', reason:'The saved result is for different teams than this match now has'}); return null; }
  var mw=tnMatchWinner(r,fmt);
  if(!mw.valid){ conflicts.push({mid:m.mid, kind:'invalid', reason:mw.reason}); return null; }
  if(!mw.winner) return null;
  return mw.winner==='t1'?x.t1:x.t2;
}

// Every problem with a tournament's setup, as [ { code, message, divId?, teamId?, poolKey?, accountId? } ].
// Empty means ready. "In no pool" is only checked once a division has pools.
function tnValidateTournament(t){
  var T=t||{}, divs=T.divisions||{}, teams=T.teams||{}, pools=T.pools||{}, issues=[];
  var add=function(code,message,extra){
    var x={code:code, message:message};
    Object.keys(extra||{}).forEach(function(k){ x[k]=extra[k]; });
    issues.push(x);
  };
  var dName=function(d){ return (divs[d]&&divs[d].name)||d; };
  var tName=function(id){ return (teams[id]&&teams[id].name)||id; };
  var teamsByDiv={}, seat={};
  Object.keys(divs).forEach(function(d){ teamsByDiv[d]=[]; });
  Object.keys(pools).forEach(function(d){
    Object.keys(pools[d]||{}).forEach(function(pk){
      var ids=tnArr((pools[d][pk]||{}).teamIds);
      if(ids.length<2) add('pool_too_small','Pool '+pk+' in '+dName(d)+' has fewer than 2 teams',{divId:d, poolKey:pk});
      ids.forEach(function(id){ (seat[id]=seat[id]||[]).push({divId:d, poolKey:pk}); });
    });
  });
  Object.keys(divs).forEach(function(d){
    var dv=divs[d]||{}, size=+dv.teamSize, max=(dv.rosterMax!=null)?+dv.rosterMax:size;
    if([2,3,4].indexOf(size)<0) add('bad_team_size',dName(d)+' team size must be 2, 3, or 4',{divId:d});
    else if(!(max>=size)) add('bad_roster_max',dName(d)+' roster max is smaller than the team size',{divId:d});
    if(dv.coed&&((+dv.coed.minGuys||0)+(+dv.coed.minGirls||0))>max) add('coed_impossible',dName(d)+' coed minimums need more players than the roster max allows',{divId:d});
  });
  Object.keys(teams).forEach(function(id){
    var tm=teams[id]; if(!tm) return;
    var d=tm.divId, dv=divs[d];
    if(!dv){ add('team_no_division',tName(id)+' is not in a division',{teamId:id}); return; }
    teamsByDiv[d].push(id);
    var players=tnArr(tm.players), size=+dv.teamSize, max=(dv.rosterMax!=null)?+dv.rosterMax:size;
    players.forEach(function(p,i){
      if(!String((p&&p.accountId)||'').trim()) add('player_missing_accountId',tName(id)+' player '+(i+1)+((p&&p.name)?' ('+p.name+')':'')+' is not linked to a CourtSense account',{divId:d, teamId:id});
    });
    if([2,3,4].indexOf(size)>=0){
      if(players.length<size) add('roster_short',tName(id)+' has '+players.length+' players and needs at least '+size,{divId:d, teamId:id});
      if(max>=size&&players.length>max) add('roster_long',tName(id)+' has '+players.length+' players and the roster max is '+max,{divId:d, teamId:id});
    }
    if(dv.coed){
      var men=0, women=0;
      players.forEach(function(p){ var g=tnGender(p&&p.gender); if(g==='M') men++; else if(g==='F') women++; });
      if(men<(+dv.coed.minGuys||0)) add('coed_short_guys',tName(id)+' needs at least '+dv.coed.minGuys+' guys on the roster',{divId:d, teamId:id});
      if(women<(+dv.coed.minGirls||0)) add('coed_short_girls',tName(id)+' needs at least '+dv.coed.minGirls+' girls on the roster',{divId:d, teamId:id});
    }
    var s=seat[id]||[], inDivs=[];
    s.forEach(function(x){ if(inDivs.indexOf(x.divId)<0) inDivs.push(x.divId); });
    if(inDivs.length>1||(inDivs.length===1&&inDivs[0]!==d)) add('team_two_divisions',tName(id)+' is placed in a pool outside its own division',{divId:d, teamId:id});
    var own=s.filter(function(x){ return x.divId===d; });
    if(own.length>1) add('team_two_pools',tName(id)+' is in more than one pool',{divId:d, teamId:id});
    if(!own.length&&pools[d]&&Object.keys(pools[d]).length) add('team_no_pool',tName(id)+' is not in a pool',{divId:d, teamId:id});
  });
  Object.keys(teamsByDiv).forEach(function(d){
    var owner={};
    teamsByDiv[d].forEach(function(id){
      var mine={};
      tnArr(teams[id].players).forEach(function(p){
        var r=String((p&&p.accountId)||'').trim(); if(!r) return;
        if(mine[r]){ add('player_twice_on_team',tName(id)+' lists '+((p&&p.name)||r)+' twice',{divId:d, teamId:id, accountId:r}); return; }
        mine[r]=1;
        if(owner[r]) add('player_on_two_teams',((p&&p.name)||r)+' is on both '+tName(owner[r])+' and '+tName(id)+' in '+dName(d),{divId:d, teamId:id, accountId:r});
        else owner[r]=id;
      });
    });
  });
  Object.keys(divs).forEach(function(d){
    var dv=divs[d]||{}, n=teamsByDiv[d].length, pk=Object.keys(pools[d]||{});
    var pc=pk.length||(+dv.poolCount||0), adv=+dv.advancePerPool||0;
    if(pc*adv>n) add('too_many_advancing',dName(d)+' advances '+(pc*adv)+' teams but has '+n,{divId:d});
    pk.forEach(function(k){
      var sz=tnArr((pools[d][k]||{}).teamIds).length;
      if(sz>=2&&adv>sz) add('pool_advance_exceeds_size','Pool '+k+' in '+dName(d)+' has '+sz+' teams and advances '+adv,{divId:d, poolKey:k});
    });
  });
  return issues;
}

// ---- Pickup partner page listing for one club division --------------------------------
// While a club tournament's registration is open, each division is listed on the pickup
// "Find a Tournament Partner" directory at tally_kotb_pickup/tournaments/club-{tid}-{divId},
// in pickup's own record shape. Returns { key, fields } where fields are paths RELATIVE to
// that listing node, ready to prefix and merge into one multi-path update. The listing node
// itself and its pool (written by players) are never in the map. existing is the listing as
// it stands (or null): its createdAt is kept, and any stale division entry is cleared.
// Returns { key, error } instead when the division cannot be listed.
function tnPickupCategory(cat){ return cat==='mens'?'mens':cat==='womens'?'womens':'coed'; }
function tnPickupListingKey(tid,divId){ return 'club-'+tid+'-'+divId; }
function tnPickupListing(o){
  var key=tnPickupListingKey(o.tid,o.divId), meta=o.meta||{}, div=o.div||{}, ex=o.existing||null;
  if(key.length>60) return {key:key, error:'too_long'};
  var date=String(meta.date||'');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return {key:key, error:'no_date'};
  var loc=String(meta.location||'').trim();
  if(!loc) return {key:key, error:'no_location'};
  var size=+div.teamSize;
  if([2,3,4].indexOf(size)<0) return {key:key, error:'bad_size'};
  // Pickup keys a division by day, category and level (divIdFor). Club "open" has no pickup
  // category, so it lists as coed; every club division lists at level open.
  var cat=tnPickupCategory(div.category), level='open', pdiv=date+'-'+cat+'-'+level;
  var f={};
  f.id=key;
  f.name=(String(meta.name||'Club tournament').trim()+': '+String(div.name||'Division').trim()).slice(0,150);
  f.startDate=date; f.endDate=date; f.days=[date];
  f.location=loc.slice(0,150);
  f.locationAddress=String(meta.locationAddress||'').trim().slice(0,250)||null;
  f.eventUrl=String(o.regLink||'').slice(0,500);
  f.surface='grass';
  f.format=size+'v'+size;
  f.organizer=String(o.org||'').slice(0,100);
  f.createdBy=String(o.createdBy||'').slice(0,200);
  f.createdByName=String(o.org||'').slice(0,100);
  f.createdAt=(ex&&typeof ex.createdAt==='number')?ex.createdAt:o.now;
  f.status='open';
  f.source='club'; f.clubTid=o.tid; f.clubDivId=o.divId;
  f['divisions/'+pdiv]={id:pdiv, day:date, category:cat, level:level, regStatus:'open'};
  Object.keys((ex&&ex.divisions)||{}).forEach(function(k){ if(k!==pdiv) f['divisions/'+k]=null; });
  return {key:key, fields:f};
}
// Hide a listing the way pickup hides one (its directory skips status 'cancelled'). Only
// for a listing that exists: a lone status write would fail the node's required-fields rule.
function tnPickupHide(existing){ return (existing&&existing.name)?{status:'cancelled'}:null; }

// ---- Schedule (America/New_York) -------------------------------------------------------
// Club tournaments run on Eastern time. The registration deadline is entered as a local date
// and time and stored as epoch ms, so every device and the worker agree on the instant.
// US daylight saving (since 2007): EDT from the second Sunday of March at 2:00 AM local to
// the first Sunday of November at 2:00 AM local; EST otherwise. In the repeated hour on the
// November change, the earlier (EDT) instant is used. Returns null for a bad date or time.
function tnNthSunday(y,month,n){ // month 1 to 12, nth Sunday as a day of the month
  var first=new Date(Date.UTC(y,month-1,1)).getUTCDay();
  return 1+((7-first)%7)+(n-1)*7;
}
function tnNyEpoch(dateStr,timeStr){
  var d=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateStr||'')), t=/^(\d{2}):(\d{2})$/.exec(String(timeStr||''));
  if(!d||!t) return null;
  var y=+d[1], mo=+d[2], da=+d[3], h=+t[1], mi=+t[2];
  if(mo<1||mo>12||da<1||da>31||h>23||mi>59) return null;
  var local=(mo*100+da)*10000+h*100+mi; // MMDDhhmm, comparable within a year
  var start=(3*100+tnNthSunday(y,3,2))*10000+200, end=(11*100+tnNthSunday(y,11,1))*10000+200;
  // Before 2:00 AM on the November Sunday is still EDT (so the repeated 1:00 hour reads as
  // its first, EDT pass); from 2:00 AM local it is EST.
  var edt=local>=start&&local<end;
  return Date.UTC(y,mo-1,da,h,mi)+(edt?4:5)*3600000;
}
// "08:30" -> "8:30 AM", "23:59" -> "11:59 PM". '' for anything else.
function tnTimeLabel(hhmm){
  var t=/^(\d{2}):(\d{2})$/.exec(String(hhmm||''));
  if(!t) return '';
  var h=+t[1], ampm=h>=12?'PM':'AM', h12=h%12||12;
  return h12+':'+t[2]+' '+ampm;
}
// "YYYY-MM-DD" -> "Sunday, October 11". Read at noon UTC so no time zone moves the day.
function tnDayLabel(dateStr){
  var d=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateStr||''));
  if(!d) return '';
  var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var dt=new Date(Date.UTC(+d[1],+d[2]-1,+d[3],12));
  return days[dt.getUTCDay()]+', '+months[+d[2]-1]+' '+(+d[3]);
}
// Time left as words: "2 days 4 hours", "5 hours 10 minutes", "12 minutes", "less than a minute".
function tnCountdown(ms){
  if(!(ms>0)) return '';
  var m=Math.floor(ms/60000), d=Math.floor(m/1440), h=Math.floor((m%1440)/60), mm=m%60;
  var w=function(n,u){ return n+' '+u+(n===1?'':'s'); };
  if(d) return w(d,'day')+(h?' '+w(h,'hour'):'');
  if(h) return w(h,'hour')+(mm?' '+w(mm,'minute'):'');
  return mm?w(mm,'minute'):'less than a minute';
}
// The day before a YYYY-MM-DD date, for the default registration deadline.
function tnDayBefore(dateStr){
  var d=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateStr||''));
  if(!d) return '';
  var dt=new Date(Date.UTC(+d[1],+d[2]-1,+d[3]-1));
  return dt.getUTCFullYear()+'-'+String(dt.getUTCMonth()+1).padStart(2,'0')+'-'+String(dt.getUTCDate()).padStart(2,'0');
}

// ---- Team ratings for seeding -------------------------------------------------------
// ratings is one entry per player: a number, or null when the player is unrated. The team
// rating is the mean of the numbers present; a team with none has no rating.
function tnTeamRating(ratings){
  var nums=tnArr(ratings).filter(function(x){ return typeof x==='number'&&isFinite(x); });
  var total=Array.isArray(ratings)?ratings.length:nums.length;
  return {avg:nums.length?Math.round(nums.reduce(function(a,b){ return a+b; },0)/nums.length):null, rated:nums.length, total:total};
}
// ---- Pools for game day -------------------------------------------------------------
// Split a division's courts across its pools. With at least as many courts as pools, each
// pool gets its own contiguous block and the blocks differ in size by at most one (earlier
// pools take the extra court). With fewer courts than pools, pools share: pool i plays on
// court i mod the number of courts, and pools on the same court take their waves in turn.
// Returns one court list per pool.
function tnSplitCourts(courts,poolCount){
  var cs=tnArr(courts), P=Math.max(1,Math.floor(+poolCount)||1), out=[], i;
  if(!cs.length){ for(i=0;i<P;i++) out.push([]); return out; }
  if(cs.length>=P){
    var base=Math.floor(cs.length/P), extra=cs.length%P, k=0;
    for(i=0;i<P;i++){ var n=base+(i<extra?1:0); out.push(cs.slice(k,k+n)); k+=n; }
  } else {
    for(i=0;i<P;i++) out.push([cs[i%cs.length]]);
  }
  return out;
}
// A full pool preview for one division: snake the seeded teams into pools, split the
// courts, and schedule each pool with mids prefixed by the divId. teams is a list of
// { id, seed, name }. Returns { pools:{ key:{ teamIds, courts, matches } }, split:[ { pool,
// courts } ], shared } where shared means pools have to share courts.
function tnBuildPoolsPreview(divId,teams,poolCount,courts){
  var P=Math.max(1,Math.floor(+poolCount)||1), cs=tnArr(courts);
  var snake=tnSnakePools(teams,P), keys=Object.keys(snake), split=tnSplitCourts(cs,keys.length), pools={};
  keys.forEach(function(k,i){ pools[k]=tnSchedulePool(k,snake[k],split[i],divId); });
  return {pools:pools, split:keys.map(function(k,i){ return {pool:k, courts:split[i]}; }), shared:cs.length>0&&cs.length<keys.length};
}

// Strongest first: rated teams by average descending, then unrated teams, each tie broken
// by name. Returns a new list; the input is untouched.
function tnSortByRating(rows){
  return tnArr(rows).slice().sort(function(a,b){
    var x=a.teamRating, y=b.teamRating;
    if((x==null)!==(y==null)) return x==null?1:-1;
    if(x!=null&&y!=null&&x!==y) return y-x;
    return String(a.name||'').localeCompare(String(b.name||''));
  });
}
// ---- Live point scoring --------------------------------------------------------------
// Side switches and the technical timeout for one format (a division's pool or playoff).
// Missing settings take the defaults: switch every 7 points when sets go to 21 or more (5
// otherwise), every 5 in the third set, and a technical timeout at scoreTo combined points
// in sets 1 and 2 only, never in the third (deciding) set. tto is on unless set to false.
function tnLiveRules(fmt){
  var f=fmt||{}, to=Number(f.scoreTo)||21;
  var sw=tnNum(f.switchEvery), sw3=tnNum(f.thirdSetSwitchEvery), at=tnNum(f.ttoAt);
  return {switchEvery:(sw&&sw>0)?sw:(to>=21?7:5), thirdSetSwitchEvery:(sw3&&sw3>0)?sw3:5,
    tto:f.tto!==false, ttoAt:(at&&at>0)?at:to};
}
// The target and cap for set i (0 based), as tnMatchWinner reads them: the third set plays
// to thirdSetTo with no cap when thirdSetTo is set.
function tnSetTarget(fmt,i){
  var f=fmt||{}, third=Number(f.thirdSetTo)||0;
  if(i===2&&third>0) return {target:third, cap:0};
  return {target:Number(f.scoreTo)||21, cap:Number(f.cap)||0};
}
// What to tell the scorer after a live action. sets are the live sets so far, i the current
// set index, point true when this action just added a point. setOver: set i is finished and
// valid. matchOver: the sets through i decide the match. switchSides and tto only follow a
// point that did not end the set.
function tnLivePrompts(fmt,sets,i,point){
  var list=tnArr(sets), s=list[i]||{}, a=tnNum(s.a)||0, b=tnNum(s.b)||0, total=a+b;
  var r=tnLiveRules(fmt), tg=tnSetTarget(fmt,i);
  var setOver=a!==b&&tnSetError({a:a, b:b},tg.target,tg.cap)==='';
  var mw=tnMatchWinner({sets:list.slice(0,i+1)},fmt);
  var third=(i===2), every=third?r.thirdSetSwitchEvery:r.switchEvery, live=!!point&&!setOver&&total>0;
  return {switchSides:live&&total%every===0, tto:live&&r.tto&&!third&&total===r.ttoAt,
    setOver:setOver, matchOver:mw.valid&&!!mw.winner};
}

// ---- Playoff formats -------------------------------------------------------------------
// bracket/{divId} and silver/{divId} hold one of:
//   { format:'single', opts:{ thirdPlace }, rounds:[ [match...] ] }
//   { format:'double', opts:{ finalReset }, winners:[rounds], losers:[rounds], final:[gf1, gf2?] }
// A match names its feeders in fromA and fromB: the winner of that mid, or its loser when
// fromLoser (both sides; the single third place match) or fromALoser / fromBLoser (double)
// is set. tnScheduleBracket adds order (the play sequence) and court to every match that will
// be played; byes and empty matches get neither.

// Placements from a single elimination tnAdvance: 1st and 2nd from the final, 3rd and 4th from
// the third place match when there is one (else the semifinal losers share 3rd), and each
// earlier round's losers share the place after everyone who got further.
function tnSinglePlacements(a){
  var rounds=a.rounds, out=[], n=rounds.length, W=a.won||{}, Lo=a.lost||{};
  if(!n) return out;
  var last=rounds[n-1], fin=last.filter(function(m){ return !m.fromLoser; })[0], third=last.filter(function(m){ return m.fromLoser; })[0];
  if(a.champion){ out.push({place:1, teamIds:[a.champion]}); if(fin&&Lo[fin.mid]) out.push({place:2, teamIds:[Lo[fin.mid]]}); }
  if(third&&W[third.mid]){ out.push({place:3, teamIds:[W[third.mid]]}); if(Lo[third.mid]) out.push({place:4, teamIds:[Lo[third.mid]]}); }
  for(var r=n-2;r>=0;r--){
    if(r===n-2&&third) continue;
    var lost=rounds[r].map(function(m){ return Lo[m.mid]; }).filter(Boolean);
    if(lost.length) out.push({place:rounds[r].length+1, teamIds:lost});
  }
  return out;
}

// Double elimination from tnSeedPlayoffs output. The winners bracket is tnBuildBracket's draw
// (byes to the top seeds, same pool first round swaps) with mids {prefix}de-w-r{r}-m{s}. The
// losers bracket ({prefix}de-l-r{r}-m{s}) starts with the round 1 losers in pairs, then
// alternates: a drop-in round where the losers of the next winners round come down to meet
// the losers bracket survivors (in reverse order, so teams from the same corner do not meet
// again straight away), then a round where those survivors play each other. A slot fed by a
// bye has no team: a losers match with one empty side is a bye, with two it is empty (void).
// The grand final {prefix}de-gf1 is the winners bracket champion against the losers bracket
// champion; with opts.finalReset, {prefix}de-gf2 is played only if the losers bracket team
// wins gf1. Returns { format:'double', opts, winners, losers, final }.
function tnBuildDoubleElim(seeds,idPrefix,opts){
  var o=opts||{}, pre=tnMidPrefix(idPrefix), single=tnBuildBracket(seeds,idPrefix);
  var out={format:'double', opts:{finalReset:!!o.finalReset}, winners:[], losers:[], final:[]};
  if(!single.rounds.length) return out;
  var from=pre+'po-r', to=pre+'de-w-r';
  var rn=function(mid){ return (mid&&mid.indexOf(from)===0)?to+mid.slice(from.length):mid; };
  var W=single.rounds.map(function(rd){ return rd.map(function(m){
    var c=tnClone(m); c.mid=rn(c.mid); if(c.fromA) c.fromA=rn(c.fromA); if(c.fromB) c.fromB=rn(c.fromB); return c;
  }); });
  var k=W.length, L=[], lm=function(r,s){ return pre+'de-l-r'+r+'-m'+s; };
  if(k>=2){
    var r1=[];
    for(var s=1;s<=W[0].length/2;s++){
      r1.push({mid:lm(1,s), round:1, slot:s, t1:null, t2:null, fromA:W[0][2*s-2].mid, fromALoser:true, fromB:W[0][2*s-1].mid, fromBLoser:true});
    }
    L.push(r1);
    for(var j=2;j<=k;j++){
      var prev=L[L.length-1], wr=W[j-1], rno=L.length+1, drop=[];
      for(var d=1;d<=wr.length;d++){
        drop.push({mid:lm(rno,d), round:rno, slot:d, t1:null, t2:null, fromA:prev[d-1].mid, fromB:wr[wr.length-d].mid, fromBLoser:true});
      }
      L.push(drop);
      if(j<k){
        var r2=L.length+1, pair=[];
        for(var q=1;q<=drop.length/2;q++) pair.push({mid:lm(r2,q), round:r2, slot:q, t1:null, t2:null, fromA:drop[2*q-2].mid, fromB:drop[2*q-1].mid});
        L.push(pair);
      }
    }
  }
  var wFinal=W[k-1][0].mid, lFinal=L.length?L[L.length-1][0].mid:null;
  var F=[{mid:pre+'de-gf1', round:1, slot:1, t1:null, t2:null, fromA:wFinal, fromB:lFinal||wFinal, fromBLoser:!lFinal}];
  if(o.finalReset) F.push({mid:pre+'de-gf2', round:2, slot:1, t1:null, t2:null, fromA:F[0].mid, fromB:F[0].mid, ifNeeded:true});
  var filled=tnAdvanceDouble({format:'double', winners:W, losers:L, final:F},{},null);
  out.winners=filled.winners; out.losers=filled.losers; out.final=filled.final;
  return out;
}

// Winners and losers carried forward through a copy of a double elimination bracket; nothing
// passed in is changed. Conflicts are reported as tnAdvance does, plus a result saved on an
// empty match or on an if needed final that is not (or not yet) needed. Returns { winners,
// losers, final, conflicts, champion, placements, needGf2, won, lost }: placements are 1st,
// 2nd, then the losers bracket final loser 3rd, and each earlier losers round's losers share
// the place after everyone who got further.
function tnAdvanceDouble(bracket,results,fmt){
  var b=bracket||{}, res=results||{}, conflicts=[], won={}, lost={}, dead={};
  var cp=function(rs){ return tnArr(rs).map(function(rd){ return tnArr(rd).map(function(m){ return tnClone(m); }); }); };
  var W=cp(b.winners), L=cp(b.losers), F=tnArr(b.final).map(function(m){ return tnClone(m); });
  var has=function(o,k){ return Object.prototype.hasOwnProperty.call(o,k); };
  var side=function(mid,loser){
    if(!mid||dead[mid+(loser?':l':':w')]) return {dead:true};
    var o=loser?lost:won; return {team:has(o,mid)?o[mid]:null};
  };
  var settle=function(m,fed){
    if(fed){
      var a=side(m.fromA,!!m.fromALoser), c=side(m.fromB,!!m.fromBLoser);
      delete m.bye; delete m.void;
      if(a.dead&&c.dead){ m.void=true; m.t1=null; m.t2=null; }
      else if(a.dead||c.dead){ m.bye=true; m.t1=a.dead?c.team:a.team; m.t2=null; }
      else { m.t1=a.team; m.t2=c.team; }
    }
    if(m.void){
      if(res[m.mid]) conflicts.push({mid:m.mid, kind:'void', reason:'A result is saved for a match that has no teams'});
      dead[m.mid+':w']=true; dead[m.mid+':l']=true; won[m.mid]=null; lost[m.mid]=null; return;
    }
    var w=tnBracketWinner(m,res[m.mid],fmt,conflicts);
    won[m.mid]=w;
    if(m.bye){ dead[m.mid+':l']=true; lost[m.mid]=null; }
    else lost[m.mid]=w?(w===m.t1?m.t2:m.t1):null;
  };
  W.forEach(function(rd,ri){ rd.forEach(function(m){ settle(m,ri>0); }); });
  L.forEach(function(rd){ rd.forEach(function(m){ settle(m,true); }); });
  var g1=F[0], g2=F[1], champion=null, runnerUp=null, needGf2=false;
  if(g1){
    settle(g1,true);
    var w1=won[g1.mid];
    if(g2){
      g2.ifNeeded=true; delete g2.void; delete g2.bye;
      if(w1&&w1===g1.t2){ needGf2=true; g2.t1=g1.t1; g2.t2=g1.t2; settle(g2,false); }
      else if(w1){
        g2.void=true; g2.t1=null; g2.t2=null; won[g2.mid]=null; lost[g2.mid]=null;
        if(res[g2.mid]) conflicts.push({mid:g2.mid, kind:'not_needed', reason:'A result is saved for the if needed final, but it was not needed'});
      } else {
        g2.t1=null; g2.t2=null; won[g2.mid]=null; lost[g2.mid]=null;
        if(res[g2.mid]) conflicts.push({mid:g2.mid, kind:'not_needed_yet', reason:'A result is saved for the if needed final before the first final is decided'});
      }
    }
    if(w1&&(w1===g1.t1||!g2)){ champion=w1; runnerUp=lost[g1.mid]; }
    else if(w1&&g2&&won[g2.mid]){ champion=won[g2.mid]; runnerUp=lost[g2.mid]; }
  }
  var places=[];
  if(champion){ places.push({place:1, teamIds:[champion]}); if(runnerUp) places.push({place:2, teamIds:[runnerUp]}); }
  var next=3;
  for(var i=L.length-1;i>=0;i--){
    var real=L[i].filter(function(m){ return !m.bye&&!m.void; });
    var out=real.map(function(m){ return lost[m.mid]; }).filter(Boolean);
    if(out.length) places.push({place:next, teamIds:out});
    next+=real.length;
  }
  return {winners:W, losers:L, final:F, conflicts:conflicts, champion:champion, placements:places, needGf2:needGf2, won:won, lost:lost};
}

// One view of any stored bracket, single or double: sections of rounds in display order, every
// match in one flat list (each with section, winner and loser filled in), the champion, the
// placements and the conflicts. A bracket with no format is single (build 2 stored rounds only).
function tnBracketView(bracket,results,fmt){
  var b=bracket||{}, out={format:b.format==='double'?'double':'single', sections:[], matches:[], champion:null, placements:[], conflicts:[], needGf2:false};
  var won, lost;
  if(out.format==='double'){
    var d=tnAdvanceDouble(b,results,fmt);
    out.sections=[{key:'winners', label:'Winners bracket', rounds:d.winners}, {key:'losers', label:'Losers bracket', rounds:d.losers},
      {key:'final', label:'Final', rounds:d.final.length?[d.final]:[]}];
    won=d.won; lost=d.lost; out.champion=d.champion; out.placements=d.placements; out.conflicts=d.conflicts; out.needGf2=d.needGf2;
  } else {
    var a=tnAdvance(b,results,fmt);
    out.sections=[{key:'main', label:'Bracket', rounds:a.rounds}];
    won=a.won; lost=a.lost; out.champion=a.champion; out.placements=tnSinglePlacements(a); out.conflicts=a.conflicts;
  }
  out.sections.forEach(function(sec){
    sec.rounds.forEach(function(rd){ rd.forEach(function(m){ m.section=sec.key; m.winner=won[m.mid]||null; m.loser=lost[m.mid]||null; out.matches.push(m); }); });
  });
  return out;
}

// Silver bracket seeds: the teams that did not advance, ranked across pools tier by tier the
// same way tnSeedPlayoffs ranks the advancing ones (every pool's first non-advancing team,
// then the next, and so on). Returns [ { seed, teamId, pool, poolRank } ].
function tnSeedSilver(divisionStandings,advancePerPool){
  var S=divisionStandings||{}, K=Math.max(0,Math.floor(+advancePerPool)||0), out=[], keys=Object.keys(S).sort(), max=0;
  var pct=function(r){ return r.mp?r.w/r.mp:0; };
  keys.forEach(function(pk){ max=Math.max(max,tnArr(S[pk]).length); });
  for(var k=K;k<max;k++){
    var tier=[];
    keys.forEach(function(pk){
      var rows=tnArr(S[pk]).slice().sort(function(a,b){ return (a.rank||0)-(b.rank||0); });
      if(rows[k]) tier.push({row:rows[k], pool:pk});
    });
    tier.sort(function(x,y){ return (pct(y.row)-pct(x.row))||tnStatCmp(x.row,y.row)||(x.pool<y.pool?-1:x.pool>y.pool?1:0); });
    tier.forEach(function(t){ out.push({seed:out.length+1, teamId:t.row.teamId, pool:t.pool, poolRank:k+1}); });
  }
  return out;
}

// Order and courts for a stored bracket (a copy is returned). A match's level is one more than
// its latest feeder's, so it can never be scheduled before what it waits on. Play order is by
// level, then winners before losers before the final, then round, then slot. Courts go round
// robin in that order, so each court plays its matches in sequence and the same court keeps
// a steady rhythm. Byes and empty matches get order and court null.
function tnScheduleBracket(bracket,courts){
  var b=tnClone(bracket)||{}, C=tnArr(courts).filter(function(c){ return c!=null&&c!==''; });
  var v=tnBracketView(b,{},null), byMid={}, level={};
  v.matches.forEach(function(m){ byMid[m.mid]=m; });
  var lv=function(mid){
    if(level[mid]!=null) return level[mid];
    var m=byMid[mid], l=1; if(!m) return 0;
    [m.fromA,m.fromB].forEach(function(f){ if(f&&f!==mid) l=Math.max(l,lv(f)+1); });
    level[mid]=l; return l;
  };
  var rank={main:0, winners:0, losers:1, final:2};
  var play=v.matches.filter(function(m){ return !m.bye&&!m.void; }).sort(function(x,y){
    return (lv(x.mid)-lv(y.mid))||(rank[x.section]-rank[y.section])||((x.round||0)-(y.round||0))||((x.slot||0)-(y.slot||0));
  });
  var at={};
  play.forEach(function(m,i){ at[m.mid]={order:i+1, court:C.length?C[i%C.length]:null}; });
  var each=function(rd){ tnArr(rd).forEach(function(m){ var a=at[m.mid]; m.order=a?a.order:null; m.court=a?a.court:null; }); };
  if(b.format==='double'){ tnArr(b.winners).forEach(each); tnArr(b.losers).forEach(each); each(b.final); }
  else tnArr(b.rounds).forEach(each);
  return b;
}

// Refs for a bracket's matches that have no result yet, in play order. An exec override
// (overrides[mid] = teamId) wins. Otherwise the loser of the most recent finished match (by
// order) on the same court. When there is none (the first match on a court, or that loser is
// playing this match), and every match in this match's round has both teams known, the ref is
// picked in this order:
//   1. a team in this bracket not playing in this round (a bye in the round first), not
//      already reffing in this round, and not busy at this order slot (opts.busy);
//   2. a team from opts.pool (the division's teams that did not make the playoffs), not in
//      this round, not reffing in it, and not busy at this order slot;
//   3. null.
// Ties go to the fewest ref assignments so far in the bracket, then the best pool finish
// (opts.finish[teamId], lower is better), then team id. A ref is never playing that match.
// A round is one round index of one section (winners and losers rounds are separate).
// opts.busy is { order: [teamIds] }: teams playing or reffing another bracket's match with
// the same order slot. Returns { mid: teamId|null } for every unplayed match with an order.
function tnPlayoffRefs(bracket,results,overrides,fmt,opts){
  var o=opts||{}, res=results||{}, ov=overrides||{}, out={}, v=tnBracketView(bracket,res,fmt);
  var finish=o.finish||{}, pool=tnArr(o.pool), busy=o.busy||{};
  var has=function(x,k){ return Object.prototype.hasOwnProperty.call(x,k); };
  var rk=function(m){ return m.section+':'+(m.round||0); };
  var rounds={}, inBracket={}, list=[];
  v.matches.forEach(function(m){
    var k=rk(m), r=rounds[k]||(rounds[k]={playing:{}, byes:{}, complete:true});
    if(m.void) return;
    if(m.bye){ var b=m.t1||m.t2; if(b) r.byes[b]=1; else r.complete=false; }
    else { if(m.t1) r.playing[m.t1]=1; if(m.t2) r.playing[m.t2]=1; if(!m.t1||!m.t2) r.complete=false; }
    [m.t1,m.t2].forEach(function(id){ if(id){ if(!has(inBracket,id)) list.push(id); inBracket[id]=1; } });
  });
  var done=v.matches.filter(function(m){ return m.order!=null&&m.loser; });
  var count={}, reffing={};
  var rank=function(a,b,byes){
    var ba=byes&&byes[a]?0:1, bb=byes&&byes[b]?0:1;
    return (ba-bb)||((count[a]||0)-(count[b]||0))||((has(finish,a)?+finish[a]:999)-(has(finish,b)?+finish[b]:999))||(a<b?-1:a>b?1:0);
  };
  v.matches.filter(function(m){ return m.order!=null&&!m.bye&&!m.void&&!res[m.mid]; })
    .sort(function(x,y){ return x.order-y.order; })
    .forEach(function(m){
      var k=rk(m), r=rounds[k], refs=reffing[k]||(reffing[k]={}), ref=null;
      var free=function(id){ return id&&id!==m.t1&&id!==m.t2&&!r.playing[id]&&!refs[id]&&tnArr(busy[m.order]).indexOf(id)<0; };
      if(has(ov,m.mid)&&ov[m.mid]) ref=String(ov[m.mid]);
      else {
        var prior=null;
        done.forEach(function(d){ if(String(d.court)===String(m.court)&&d.order<m.order&&(!prior||d.order>prior.order)) prior=d; });
        ref=prior?prior.loser:null;
        if((!ref||ref===m.t1||ref===m.t2)&&r.complete&&m.t1&&m.t2){
          var c1=list.filter(free).sort(function(a,b){ return rank(a,b,r.byes); });
          var c2=c1.length?[]:pool.filter(function(id){ return !inBracket[id]&&free(id); }).sort(function(a,b){ return rank(a,b,null); });
          ref=c1[0]||c2[0]||null;
        }
      }
      if(ref&&(ref===m.t1||ref===m.t2)) ref=null;
      out[m.mid]=ref;
      if(ref){ count[ref]=(count[ref]||0)+1; refs[ref]=1; }
    });
  return out;
}
// Refs for a whole division: the playoff bracket and the Silver bracket together, so a team
// is never asked to ref two matches in the same order slot or to ref while it plays Silver.
// o: { pools, bracket, silver, results, overrides, poolFmt, playoffFmt }. Pool finish (the
// rank in its pool) breaks ties; teams in no playoff bracket are the fallback refs. Silver
// refs come first, then the playoff bracket avoids every team playing or reffing a Silver
// match in the same order slot. Returns { playoff:{ mid: ref }, silver:{ mid: ref } }.
function tnDivisionPlayoffRefs(o){
  var res=o.results||{}, ov=o.overrides||{}, f=o.playoffFmt||null, finish={}, teams=[];
  Object.keys(o.pools||{}).sort().forEach(function(k){
    var p=o.pools[k]||{};
    tnPoolStandings(p.teamIds,p.matches,res,o.poolFmt||null).forEach(function(r){ finish[r.teamId]=r.rank; teams.push(r.teamId); });
  });
  var inMain={};
  if(o.bracket) tnBracketView(o.bracket,res,f).matches.forEach(function(m){ if(m.t1) inMain[m.t1]=1; if(m.t2) inMain[m.t2]=1; });
  var pool=teams.filter(function(id){ return !inMain[id]; });
  var silver=o.silver?tnPlayoffRefs(o.silver,res,ov,f,{finish:finish, pool:pool}):{};
  var busy={};
  if(o.silver){
    tnBracketView(o.silver,res,f).matches.forEach(function(m){
      if(m.order==null||m.bye||m.void) return;
      var b=busy[m.order]||(busy[m.order]=[]);
      [m.t1,m.t2,silver[m.mid]].forEach(function(id){ if(id) b.push(id); });
    });
  }
  var playoff=o.bracket?tnPlayoffRefs(o.bracket,res,ov,f,{finish:finish, pool:pool, busy:busy}):{};
  return {playoff:playoff, silver:silver};
}

// ---- Approximate times -----------------------------------------------------------------
// Estimates only; everything that shows one says "about". A day runs on minutes after
// midnight. minutesPerMatch is set per format (pool and playoff); with none set it is 20 for
// one game and 45 for best of 3.
function tnHHMMToMin(s){ var m=/^(\d{2}):(\d{2})$/.exec(String(s||'')); return m?(+m[1]*60+(+m[2])):null; }
function tnMinToHHMM(n){
  var v=((Math.round(+n)%1440)+1440)%1440, h=Math.floor(v/60), mm=v%60;
  return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm;
}
function tnAboutLabel(min){ return (min==null||!isFinite(min))?'':'about '+tnTimeLabel(tnMinToHHMM(min)); }
function tnMinutesPerMatch(fmt){
  var f=fmt||{}, n=tnNum(f.minutesPerMatch);
  return (n&&n>0)?n:((+f.bestOf===3)?45:20);
}
// Start times for one division. o: { startTime:'HH:MM', poolMpm, playoffMpm, pools, bracket,
// silver }. Pool matches: wave w starts at startTime + (w - 1) slots; pools that share a court
// take their waves in turn, so a slot there is one wave of each sharing pool. Playoff and
// Silver matches follow pool play, court by court in play order (main bracket first when two
// share an order number). Returns { times:{ mid: minutes }, poolEnd, end } (minutes after
// midnight), or empty times when there is no start time.
function tnApproxTimes(o){
  var start=tnHHMMToMin(o&&o.startTime), out={times:{}, poolEnd:null, end:null};
  if(start==null) return out;
  var pm=+o.poolMpm||20, om=+o.playoffMpm||20, P=o.pools||{}, keys=Object.keys(P).filter(function(k){ return !!P[k]; }).sort();
  var courtsOf={}, slots=0;
  keys.forEach(function(k){ courtsOf[k]=tnArr(P[k].courts).map(String); });
  keys.forEach(function(k){
    var share=keys.filter(function(j){ return j===k||courtsOf[j].some(function(c){ return courtsOf[k].indexOf(c)>=0; }); });
    var n=share.length, idx=share.indexOf(k);
    tnArr(P[k].matches).forEach(function(m){
      var w=Math.max(1,Math.floor(+m.wave)||1), slot=(w-1)*n+idx;
      out.times[m.mid]=start+slot*pm;
      slots=Math.max(slots,slot+1);
    });
  });
  out.poolEnd=start+slots*pm;
  var list=[];
  [o.bracket,o.silver].forEach(function(b,bi){
    if(!b) return;
    tnBracketView(b,{},null).matches.forEach(function(m){
      if(m.order==null||m.bye||m.void) return;
      list.push({mid:m.mid, court:String(m.court), order:+m.order, b:bi});
    });
  });
  list.sort(function(x,y){ return (x.order-y.order)||(x.b-y.b); });
  var free={}, end=out.poolEnd;
  list.forEach(function(x){
    var at=(free[x.court]!=null)?free[x.court]:out.poolEnd;
    out.times[x.mid]=at; free[x.court]=at+om; end=Math.max(end,at+om);
  });
  out.end=end;
  return out;
}
// Day at a glance for one division before anyone registers. o: { teams (expected count),
// poolSize, adv, courts, startTime, pool (format), playoff (format with format, thirdPlace,
// finalReset, silver, silverThirdPlace) }. Builds the pools and brackets that many teams
// would get and times them. Returns { poolCount, poolSizes, gamesPerTeam:{min,max},
// advancing, silverTeams, poolMinutes, playoffMinutes, silverExtra, doubleExtra, poolEnd,
// finish } (minutes; finish and poolEnd after midnight), or { error }.
function tnEstimateDay(o){
  var n=Math.floor(+o.teams)||0, size=Math.max(2,Math.floor(+o.poolSize)||4), adv=Math.max(1,Math.floor(+o.adv)||1);
  if(n<2) return {error:'At least 2 teams are needed for an estimate'};
  if(tnHHMMToMin(o.startTime)==null) return {error:'Add a play start time to see the estimate'};
  var courts=tnArr(o.courts).filter(function(c){ return c!=null&&c!==''; });
  if(!courts.length) return {error:'Add at least one court'};
  var P=Math.max(1,Math.min(16,Math.round(n/size)||1));
  var teams=[]; for(var i=0;i<n;i++) teams.push({id:'e'+(i+1), seed:i+1, name:'Team '+(i+1)});
  var pv=tnBuildPoolsPreview('e',teams,P,courts), keys=Object.keys(pv.pools).sort();
  var tier=function(from,to){
    var out=[];
    for(var k=from;k<to;k++) keys.forEach(function(pk){ var id=pv.pools[pk].teamIds[k]; if(id) out.push({seed:out.length+1, teamId:id, pool:pk, poolRank:k+1}); });
    return out;
  };
  var maxSize=0; keys.forEach(function(k){ maxSize=Math.max(maxSize,pv.pools[k].teamIds.length); });
  var f=o.playoff||{}, seeds=tier(0,adv), sil=f.silver?tier(adv,maxSize):[];
  var useSil=sil.length>=2, split=(useSil&&courts.length>=2)?tnSplitCourts(courts,2):[courts,courts];
  var build=function(fmt){
    if(seeds.length<2) return null;
    var b=fmt==='double'?tnBuildDoubleElim(seeds,'e',{finalReset:f.finalReset===undefined?true:!!f.finalReset})
      :Object.assign({format:'single', opts:{thirdPlace:!!f.thirdPlace}},tnBuildBracket(seeds,'e',{thirdPlace:!!f.thirdPlace}));
    return tnScheduleBracket(b,split[0]);
  };
  var main=build(f.format==='double'?'double':'single');
  var silver=useSil?tnScheduleBracket(Object.assign({format:'single', opts:{thirdPlace:!!f.silverThirdPlace}},tnBuildBracket(sil,'e-si',{thirdPlace:!!f.silverThirdPlace})),split[1]):null;
  var base={startTime:o.startTime, poolMpm:tnMinutesPerMatch(o.pool), playoffMpm:tnMinutesPerMatch(f), pools:pv.pools};
  var all=tnApproxTimes(Object.assign({},base,{bracket:main, silver:silver}));
  var noSil=tnApproxTimes(Object.assign({},base,{bracket:main}));
  var start=tnHHMMToMin(o.startTime), sizes=keys.map(function(k){ return pv.pools[k].teamIds.length; });
  var out={poolCount:keys.length, poolSizes:sizes, gamesPerTeam:{min:Math.min.apply(null,sizes)-1, max:Math.max.apply(null,sizes)-1},
    advancing:seeds.length, silverTeams:useSil?sil.length:0, poolMinutes:all.poolEnd-start, playoffMinutes:noSil.end-noSil.poolEnd,
    silverExtra:useSil?Math.max(0,all.end-noSil.end):0, doubleExtra:0, poolEnd:all.poolEnd, finish:all.end};
  if(f.format==='double'&&main){
    var single=tnApproxTimes(Object.assign({},base,{bracket:build('single')}));
    out.doubleExtra=Math.max(0,noSil.end-single.end);
  }
  return out;
}

// ===== TN ENGINE END =====
</script>
<script>
// FSU Grass Club tournament: public live page. Read only: it never writes to Firebase and

var DB_URL = 'https://leon-beach-volleyball-default-rtdb.firebaseio.com';

function feederText(m, side, byMid){

function refNote(m, v){

  var rk = m.section + ':' + m.round;

function standingsHtml(pool, div){

function wavesHtml(pool, div, key){

// ---- Playoffs ----
// The playoff bracket and the Silver bracket (teams that did not advance), single or double

function bracketsOf(divId){

    results:resultsOf(), overrides:(S.t.refOverrides && S.t.refOverrides[divId]) || {}, poolFmt:((S.t.divisions || {})[divId] || {}).pool, playoffFmt:fmt });

function withRef(m, refs){ return Object.assign({}, m, { ref: Object.prototype.hasOwnProperty.call(refs, m.mid) ? refs[m.mid] : null }); }
function roundName(sec, i, n, m, silver){

function placeLabel(n){ var s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function oneBracketHtml(divId, div, br){

}
function bracketHtml(divId, div){
  var main = S.t.bracket && S.t.bracket[divId];
  if(!main) return '<p class="muted">Playoffs start after pool play.</p>';
  return oneBracketHtml(divId, div, { key:'playoff', b:main });
}

// For each court, the earliest match not yet scored: pool matches by wave, then playoff
// matches by round once both teams are known.
function onCourtHtml(divId, div){
  var st = S.t.meta.status, res = resultsOf(), cand = [];
  if(st !== 'pools' && st !== 'playoffs') {
    return st === 'final' ? '<p class="muted">Play is done for the day. Thanks for coming out.</p>' : '<p class="muted">Matches show up here once play starts.</p>';
  }
  poolsOf(divId).forEach(function(p, pi){
    tnArr(p.pool.matches).forEach(function(m){
      if(!res[m.mid] && m.t1 && m.t2) cand.push({ m:m, order:[liveOf(m.mid) ? 0 : 1, 0, Number(m.wave) || 0, pi], label:'Pool ' + p.key, fmt:div.pool });
    });
  });
  bracketsOf(divId).forEach(function(br, bi){
    var v = tnBracketView(br.b, res, div.playoff), refs = refsFor(divId, br.b, div.playoff), names = roundNames(v, br.key === 'silver');
    v.matches.forEach(function(m){
      if(m.bye || m.void || !m.t1 || !m.t2 || res[m.mid]) return;
      cand.push({ m:withRef(m, refs), order:[liveOf(m.mid) ? 0 : 1, 1, m.order != null ? Number(m.order) : 999, bi], label:names[m.mid] + (m.order != null ? ' &middot; Match ' + m.order : ''), fmt:div.playoff });
    });
  });
  var cmp = function(a, b){ for(var i = 0; i < 4; i++){ if(a.order[i] !== b.order[i]) return a.order[i] - b.order[i]; } return 0; };
  var best = {}, keys = [];
  cand.forEach(function(c){
    var k = (c.m.court != null && c.m.court !== '') ? String(c.m.court) : '';
    if(!best[k]){ best[k] = c; keys.push(k); } else if(cmp(c, best[k]) < 0) best[k] = c;
  });
  if(!keys.length) return '<p class="muted">No matches waiting right now.</p>';
  keys.sort(function(a, b){ if(a === '') return 1; if(b === '') return -1; return (Number(a) - Number(b)) || a.localeCompare(b); });
  return '<div class="court-now">' + keys.map(function(k){
    var c = best[k], m = c.m, lv = liveOf(m.mid);
    return '<div class="cn' + (lv ? ' is-live' : '') + (isMine([m.t1, m.t2, m.ref]) ? ' mine' : '') + '"><div class="cn-court">' + (k ? 'Court ' + esc(k) : 'Court to be announced') + '</div>'
      + '<div class="cn-teams">' + teamLabel(m.t1) + '<span class="vs">vs</span>' + teamLabel(m.t2) + '</div>'
      + (lv ? liveLine(lv) : '')
      + '<div class="cn-meta">' + c.label.split(' &middot; ').map(esc).join(' &middot; ') + (m.wave ? ' &middot; Wave ' + esc(m.wave) : '') + (TIMES[m.mid] != null ? ' &middot; ' + esc(tnAboutLabel(TIMES[m.mid])) : '') + (m.ref ? ' &middot; Ref: ' + teamLabel(m.ref) : '') + '</div></div>';
  }).join('') + '</div>';
}

function renderHeader(){
  var meta = (S.t && S.t.meta) || {};
  $('t-name').textContent = meta.name || 'Tournament';
  document.title = (meta.name ? meta.name + ' Live' : 'FSU Grass Live');
  var when = [];
  if(meta.date) when.push(tnDayLabel(meta.date));
  if(meta.location) when.push(String(meta.location));
  $('t-when').textContent = when.join(' · ');
  var st = $('t-status');
  st.hidden = !STATUS_LABEL[meta.status];
  st.textContent = STATUS_LABEL[meta.status] || '';
}
function renderLive(){
  var el = $('t-live'); if(!S.updated){ el.hidden = true; return; }
  el.hidden = false;
  el.classList.toggle('slow', !S.sdkLive);
  var d = new Date(S.updated), h = d.getHours(), mm = String(d.getMinutes()).padStart(2, '0');
  $('t-live-txt').textContent = (S.sdkLive ? 'Live' : 'Refreshes every 15 seconds') + ' · updated ' + ((h % 12) || 12) + ':' + mm + (h >= 12 ? ' PM' : ' AM');
}

function notFound(){
  S.notFound = true;
  $('t-name').textContent = 'Tournament';
  $('t-when').textContent = '';
  $('t-status').hidden = true;
  $('app').innerHTML = '<div class="card center"><div class="cico" aria-hidden="true">🔎</div><h2>We could not find that tournament</h2>'
    + '<p class="muted">Double check the link, or ask the exec team for the live page link.</p></div>';
}

function render(){
  if(!S.t || !S.t.meta){ notFound(); return; }
  S.notFound = false;
  renderHeader(); renderLive();
  var divs = divisions(), D = S.t.divisions || {};
  if(!divs.length){ $('app').innerHTML = '<div class="card center"><h2>Divisions are on the way</h2><p class="muted">Check back closer to the tournament.</p></div>'; return; }
  if(divs.indexOf(S.div) < 0) S.div = divs[0];
  var div = D[S.div], teams = divTeams(S.div);
  if(S.mine && teams.indexOf(S.mine) < 0) S.mine = '';
  TIMES = computeTimes();
  var h = S.t.meta.status === 'final' ? finalHtml(divs) : '';
  if(divs.length > 1){
    h += '<div class="tabs" role="tablist">' + divs.map(function(k){
      return '<button class="tab' + (k === S.div ? ' on' : '') + '" type="button" role="tab" aria-selected="' + (k === S.div) + '" onclick="pickDiv(\'' + esc(k) + '\')">' + esc(D[k].name || 'Division') + '</button>';
    }).join('') + '</div>';
  }
  if(teams.length){
    h += '<div class="card find"><label for="mine">Find my team</label><select id="mine" onchange="pickTeam(this.value)"><option value="">Pick your team to highlight it</option>'
      + teams.map(function(k){ var x = teamsOf()[k]; return '<option value="' + esc(k) + '"' + (k === S.mine ? ' selected' : '') + '>' + esc((x.name || 'Team') + (x.demo === true ? ' (Practice)' : '')) + '</option>'; }).join('')
      + '</select></div>';
  }
  h += '<div class="card"><h2>On court now</h2>' + onCourtHtml(S.div, div) + '</div>';
  var pools = poolsOf(S.div);
  if(pools.length){
    pools.forEach(function(p){
      var courts = tnArr(p.pool.courts);
      h += '<div class="card"><h2>Pool ' + esc(p.key) + '</h2>' + (courts.length ? '<p class="muted">Court' + (courts.length > 1 ? 's ' : ' ') + courts.map(esc).join(', ') + '</p>' : '')
        + standingsHtml(p.pool, div) + wavesHtml(p.pool, div, p.key) + '</div>';
    });
  } else {
    h += '<div class="card"><h2>Pools</h2><p class="muted">Pools are posted when the exec team sets them on game day.' + (teams.length ? ' ' + teams.length + ' team' + (teams.length === 1 ? ' is' : 's are') + ' in this division.' : '') + '</p></div>';
  }
  h += '<div class="card"><h2>Playoffs</h2>' + bracketHtml(S.div, div) + '</div>';
  var silver = S.t.silver && S.t.silver[S.div];
  if(silver) h += '<div class="card"><h2>Silver bracket</h2><p class="muted">For the teams that did not advance from pools.</p>' + oneBracketHtml(S.div, div, { key:'silver', b:silver }) + '</div>';
  $('app').innerHTML = h;
}

function pickDiv(k){ S.div = k; S.mine = ''; savePick(); render(); }
function pickTeam(k){ S.mine = k; savePick(); render(); }

// ---- Loading: SDK listener first, REST polling as the fallback ----
function onData(val){
  S.t = val; S.updated = Date.now();
  render();
}
function startPoll(){
  if(S.poll) return;
  var go = async function(){
    try {
      var r = await fetch(DB_URL + '/' + ROOT + S.tid + '.json');
      if(r.ok && !S.sdkLive) onData(await r.json());
    } catch(e){ /* try again next round */ }
  };
  go();
  S.poll = setInterval(go, POLL_MS);
}
function startLive(){
  try {
    if(!window.firebase || !firebase.initializeApp) throw new Error('sdk missing');
    var app = firebase.initializeApp({ databaseURL: DB_URL }, 'tn-live');
    app.database().ref(ROOT + S.tid).on('value', function(snap){
      S.sdkLive = true;
      if(S.poll){ clearInterval(S.poll); S.poll = null; }
      onData(snap.val());
    }, function(){ S.sdkLive = false; startPoll(); });
    setTimeout(function(){ if(!S.sdkLive) startPoll(); }, 8000);
  } catch(e){ startPoll(); }
}

(function init(){
  var tid = new URLSearchParams(location.search).get('t') || '';
  if(!ID_RE.test(tid)){ notFound(); return; }
  S.tid = tid;
  loadPick();
  startLive();
  setInterval(renderLive, 30000);
})();
</script>
