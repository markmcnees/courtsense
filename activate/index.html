<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claim Your Account · CourtSense</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<!-- Old activation links (/activate/?token=...) used to set a password straight from
     the token. Those tokens are no longer accepted as proof of ownership, so this page
     now forwards to /join, where the person enters their email and gets a fresh
     set-password link sent to the address on file. The token is dropped on purpose
     and never sent anywhere. An email query param, when present, is carried over so
     /join can prefill it. The meta refresh is a no-JS fallback only. -->
<script>
(function(){
  var target = '/join/';
  try {
    var email = (new URLSearchParams(location.search).get('email') || '').trim();
    if(email) target += '?email=' + encodeURIComponent(email);
  } catch(e){}
  location.replace(target);
})();
</script>
<meta http-equiv="refresh" content="0; url=/join/">
<style>
  html,body{margin:0;height:100%;background:#0f2347;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center;}
  .card{max-width:420px;}
  h1{font-size:20px;margin:0 0 12px;letter-spacing:.5px;}
  p{font-size:15px;line-height:1.5;color:#cbd5e1;margin:0 0 18px;}
  a.btn{display:inline-block;background:#d4a843;color:#0f2347;font-weight:700;
    text-decoration:none;padding:13px 22px;border-radius:10px;font-size:15px;}
  a.plain{color:#d4a843;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Claiming your account moved</h1>
      <p>Enter your email on the next page and we will send you a fresh link to set your password.
         If you are not redirected, <a class="plain" href="/join/">tap here</a>.</p>
      <a class="btn" href="/join/">Go to courtsense.app/join</a>
    </div>
  </div>
</body>
</html>
