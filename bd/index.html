<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Business Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#082A4F;--blue:#0081AB;--gold:#F2B22E;--teal:#217F7F;--sand:#F7C880;--paper:#FBF7F0;--ink:#13243A;--slate:#5C6B7A;
  --bg:var(--paper);--card:#FFFFFF;--text:var(--ink);--muted:var(--slate);--line:#E4DCCD;--field:#FFFFFF;
  --head:var(--navy);--ok:#1E7A4C;--err:#B3261E;--errbg:#FDECEA;--danger:#B3261E;--dangertext:#FFFFFF;--chip:#F1EADD;--chipon:var(--navy);--chipontext:#FFFFFF;
  --focus:var(--blue);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B1828;--card:#13243A;--text:#EEF2F6;--muted:#A7B4C2;--line:#2A3D55;--field:#0F1E31;
    --head:var(--sand);--ok:#5FD39A;--err:#FF8A80;--errbg:#3A1D1D;--danger:#FF8A80;--dangertext:#13243A;--chip:#1C3150;--chipon:var(--gold);--chipontext:#13243A;
    --focus:#4FC3E8;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--bg);color:var(--text);font-family:'Barlow',system-ui,sans-serif;font-size:16px;line-height:1.4;}
h1,h2{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.5px;color:var(--head);margin:0;}
h1{font-size:34px;}
h2{font-size:24px;}
.wrap{max-width:1200px;margin:0 auto;padding:16px 16px 48px;}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.sub{color:var(--muted);font-size:14px;}
button,.btn{font:inherit;font-weight:600;min-height:44px;padding:0 16px;border-radius:10px;border:0;cursor:pointer;}
.b-gold{background:var(--gold);color:#13243A;}
.b-navy{background:var(--navy);color:#fff;}
.b-quiet{background:transparent;color:var(--text);border:1px solid var(--line);}
.b-danger{background:var(--danger);color:var(--dangertext);}
.b-link{background:transparent;color:var(--muted);text-decoration:underline;min-height:44px;padding:0 4px;}
button:disabled{opacity:.6;cursor:default;}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
input,select,textarea{font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:8px 10px;width:100%;}
textarea{resize:vertical;min-height:64px;}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
label.f > input,label.f > select,label.f > textarea{margin-top:4px;text-transform:none;letter-spacing:0;font-weight:400;font-size:16px;color:var(--text);}
.gate{max-width:420px;margin:48px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;}
.gate p{color:var(--muted);margin:8px 0 14px;}
.gate .row{display:flex;gap:8px;margin-top:10px;}
.err{color:var(--err);font-size:14px;margin-top:8px;}
.errbox{background:var(--errbg);color:var(--err);border-radius:8px;padding:8px 10px;font-size:14px;margin-top:8px;}
.tools{background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px;}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-top:10px;scrollbar-width:thin;}
.chip{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:22px;background:var(--chip);color:var(--text);font-weight:600;border:0;}
.chip[aria-pressed="true"]{background:var(--chipon);color:var(--chipontext);}
.chip .n{opacity:.75;font-weight:500;margin-left:4px;}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.actions .note{font-size:14px;color:var(--ok);align-self:center;}
.fallback{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;}
.fallback textarea{min-height:80px;font-size:14px;}
.fallback .h{font-size:14px;font-weight:600;margin-bottom:6px;}
.list{display:grid;gap:12px;}
.tabs{position:relative;display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);margin-bottom:12px;scrollbar-width:thin;}
.tab{flex:0 0 auto;min-height:44px;padding:0 14px;background:transparent;color:var(--muted);border-radius:10px 10px 0 0;border-bottom:3px solid transparent;margin-bottom:-2px;}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--gold);background:var(--card);}
.tab .n{opacity:.75;font-weight:500;margin-left:4px;}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--slate);border-radius:12px;padding:12px;display:grid;gap:10px;grid-template-columns:1fr 1fr;
  grid-template-areas:"head head" "cat status" "first last" "role role" "org org" "city county" "email email" "phone phone" "staff staff" "next next" "notes notes";}
.card .chead{grid-area:head;font-weight:700;font-size:18px;line-height:1.25;overflow-wrap:anywhere;}
.card .chead .org{display:block;font-weight:500;font-size:14px;color:var(--muted);}
.card .chead .staffsum{display:flex;flex-direction:column;gap:2px;margin-top:4px;font-weight:500;font-size:14px;color:var(--muted);}
.card .chead .staffsum[hidden]{display:none;}
.sline{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;}
.sline b{font-weight:700;color:var(--text);}
.sline a{color:var(--teal);font-weight:600;text-decoration:underline;overflow-wrap:anywhere;}
.card .staff{grid-area:staff;display:grid;gap:10px;}
.sgrp{border:1px solid var(--line);border-radius:10px;padding:6px 10px 10px;margin:0;display:grid;gap:8px;min-width:0;}
.sgrp legend{padding:0 4px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.addform .staff{grid-column:1 / -1;display:grid;gap:10px;}
.card [data-k="category"]{grid-area:cat;}
.card [data-k="status"]{grid-area:status;}
.card [data-k="firstName"]{grid-area:first;}
.card [data-k="lastName"]{grid-area:last;}
.card [data-k="phone"]{grid-area:phone;}
.prow{display:flex;gap:8px;align-items:stretch;margin-top:4px;}
.prow input{margin-top:0;flex:1 1 auto;min-width:0;font-size:16px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text);}
.call{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:64px;padding:0 14px;border-radius:8px;background:var(--teal);color:#fff;font-weight:700;text-decoration:none;text-transform:none;letter-spacing:0;font-size:16px;}
.call[hidden]{display:none;}
input[aria-invalid="true"]{border-color:var(--err);border-width:2px;}
.card [data-k="role"]{grid-area:role;}
.card [data-k="school"]{grid-area:org;}
.card [data-k="city"]{grid-area:city;}
.card [data-k="county"]{grid-area:county;}
.card [data-k="email"]{grid-area:email;}
.card [data-k="nextStep"]{grid-area:next;}
.card [data-k="notes"]{grid-area:notes;}
.card[data-status="Contacted"]{border-left-color:var(--slate);}
.card[data-status="Interested"]{border-left-color:var(--blue);}
.card[data-status="Committed"]{border-left-color:var(--gold);}
.card[data-status="Onboarded"]{border-left-color:var(--teal);}
.card[data-status="Live"]{border-left-color:#1E7A4C;}
.card[data-status="Not now"]{border-left-color:var(--line);opacity:.85;}
.card .wide{grid-column:1 / -1;}
.meta{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted);}
.state{font-weight:600;}
.state.ok{color:var(--ok);}
.state.bad{color:var(--err);}
.confirm{grid-column:1 / -1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--errbg);border-radius:10px;padding:8px 10px;}
.confirm span{flex:1 1 160px;color:var(--err);font-weight:600;}
.unsub{grid-column:1 / -1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;}
.unsub .badge{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:14px;background:var(--errbg);color:var(--err);font-weight:700;font-size:14px;}
.unsub .why{flex:1 1 180px;font-size:14px;color:var(--muted);}
.unsub .via{flex:0 0 auto;font-weight:600;}
.camp{background:var(--card);border:2px solid var(--navy, #082A4F);border-radius:12px;padding:12px;display:grid;gap:10px;margin-bottom:12px;}
.camp h2{margin:0;font-size:18px;}
.camp .subj{color:var(--muted);font-size:14px;}
.camp .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.camp .checks{display:flex;gap:12px;flex-wrap:wrap;}
.camp .checks label{display:inline-flex;gap:6px;align-items:center;font-weight:600;min-height:44px;}
.camp .checks input{width:20px;height:20px;min-height:0;margin:0;}
.camp .warn{background:var(--errbg);color:var(--err);border-radius:8px;padding:8px 10px;font-weight:600;font-size:14px;}
.camp details{border:1px solid var(--line);border-radius:10px;padding:6px 10px;}
.camp summary{cursor:pointer;font-weight:600;min-height:32px;}
.camp ul{margin:6px 0 4px 18px;padding:0;font-size:14px;}
.camp li{margin:2px 0;}
.camp .muted{color:var(--muted);font-size:14px;}
.camp iframe{width:100%;height:520px;border:1px solid var(--line);border-radius:10px;background:#fff;}
.camp .prog{font-weight:600;}
.addform{background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:12px;display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:12px;}
.addform .wide,.addform .row{grid-column:1 / -1;}
.addform .row{display:flex;gap:8px;flex-wrap:wrap;}
.empty{color:var(--muted);text-align:center;padding:32px 0;}
.foot{margin-top:24px;display:flex;justify-content:center;}
@media (min-width:900px){
  .tools{position:sticky;top:0;z-index:5;}
  .card{grid-template-columns:repeat(6,1fr);align-items:end;
    grid-template-areas:"head head head head head head" "cat first first last last status" "role role org org city county" "email email email phone phone phone" "staff staff staff staff staff staff" "next next next notes notes notes";}
  .card .staff,.addform .staff{grid-template-columns:1fr 1fr;}
  .sgrp{grid-template-columns:1fr 1fr 1fr;}
  .addform{grid-template-columns:repeat(4,1fr);}
  .addform .wide{grid-column:span 2;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Business Development</h1>
    <span class="sub">High schools, parks and rec, college clubs and club teams</span>
  </div>

  <div id="gate" class="gate" hidden>
    <h2>Admin key</h2>
    <p>This page is for CourtSense admins. Enter the admin key to continue. It stays on this device.</p>
    <form id="gate-form" autocomplete="off">
      <label class="f">Admin key<input id="key-input" type="password" autocomplete="off" spellcheck="false"></label>
      <div class="row"><button class="b-gold" type="submit" id="key-btn">Open</button></div>
      <div id="key-err" class="err" role="alert"></div>
    </form>
  </div>

  <div id="app" hidden>
    <div class="tools">
      <div class="tabs" id="tabs" role="tablist" aria-label="Category"></div>
      <label class="f">Search<input id="q" type="search" placeholder="Name, organization, role, city, county, email, phone or notes" autocomplete="off"></label>
      <div class="chips" id="chips" role="group" aria-label="Filter by status"></div>
      <div class="actions">
        <button class="b-gold" id="add-btn" type="button">Add contact</button>
        <button class="b-navy" id="bcc-btn" type="button">Copy emails for BCC</button>
        <button class="b-quiet" id="csv-btn" type="button">Export CSV</button>
        <button class="b-quiet" id="unsub-csv-btn" type="button">Export unsubscribe links</button>
        <button class="b-navy" id="camp-btn" type="button">Email campaign</button>
        <span class="note" id="act-note" role="status" aria-live="polite"></span>
      </div>
      <div id="fallback" class="fallback" hidden>
        <div class="h" id="fallback-h">Copy these emails</div>
        <textarea id="fallback-text" readonly aria-label="Emails to copy"></textarea>
        <div class="actions"><button class="b-quiet" id="fallback-close" type="button">Done</button></div>
      </div>
    </div>
    <div id="add-slot"></div>
    <div id="load-err" class="errbox" role="alert" hidden></div>
    <div class="list" id="list" aria-live="polite"></div>
    <div class="foot"><button class="b-link" id="forget-btn" type="button">Forget the admin key on this device</button></div>
  </div>
</div>

<script>
// Business Development. Admin only: every read and write goes through the worker's
// /admin/bd/* routes with the admin key, and the contacts live in a node clients
// cannot read. The key sits in localStorage['courtsenseAdminKey'], the same slot
// admin-players.html uses, and is checked first through /auth/admin-key-check.
(function(){
  const WORKER = 'https://courtsense-email-worker.markmcnees-479.workers.dev';
  const KEY_STORE = 'courtsenseAdminKey';
  const STATUSES = ['Contacted', 'Interested', 'Committed', 'Onboarded', 'Live', 'Not now'];
  // Category: tab label, and the label of the organization field (stored as "school").
  const CATEGORIES = [
    ['high_school', 'High school', 'School'],
    ['parks_rec', 'Parks and Rec', 'Department'],
    ['college_club', 'College club', 'University'],
    ['club_team', 'Club team', 'Club']
  ];
  const CAT_IDS = CATEGORIES.map(c => c[0]);
  const DEFAULT_CAT = 'high_school';
  const TAB_STORE = 'courtsenseBdTab';
  const SAVE_PAUSE_MS = 1200;
  const MSG_NET = "Can't reach CourtSense right now. Try again in a moment.";
  const $ = id => document.getElementById(id);

  let KEY = '';
  let coaches = [];     // { id, category, name, firstName, lastName, role, school, city, county, email, phone, status, nextStep, notes, lastTouch, doNotContact, unsubscribedAt, unsubVia, unsubAgent, unsubUrl, assistantName, assistantEmail, assistantPhone, adName, adEmail, adPhone }
  let tab = 'All';      // 'All' or a category id
  let filter = 'All';   // status
  let query = '';
  try{ const t = localStorage.getItem(TAB_STORE); if(t === 'All' || CAT_IDS.indexOf(t) !== -1) tab = t; }catch(e){}

  function catOf(c){ return CAT_IDS.indexOf(c.category) !== -1 ? c.category : DEFAULT_CAT; }
  function catName(id){ const c = CATEGORIES.find(x => x[0] === id); return c ? c[1] : 'High school'; }
  function orgLabel(id){ const c = CATEGORIES.find(x => x[0] === id); return c ? c[2] : 'School'; }

  function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
  function stored(){ try{ return (localStorage.getItem(KEY_STORE) || '').trim(); }catch(e){ return ''; } }
  function remember(k){ try{ localStorage.setItem(KEY_STORE, k); }catch(e){} }
  function forget(){ try{ localStorage.removeItem(KEY_STORE); }catch(e){} KEY = ''; }

  // POST to the worker. Resolves { status, j } and never throws; status 0 means no network.
  async function post(path, body){
    let r;
    try{
      r = await fetch(WORKER + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ adminKey: KEY }, body || {})) });
    }catch(e){ return { status: 0, j: null }; }
    let j = null;
    try{ j = await r.json(); }catch(e){}
    if(r.status === 403 && j && j.code === 'forbidden'){ forget(); showGate('That admin key no longer works. Enter it again.'); }
    return { status: r.status, j };
  }
  function errText(res, fallback){
    if(!res || res.status === 0) return MSG_NET;
    return (res.j && res.j.error) || fallback || 'Something went wrong. Try again.';
  }

  // ── Gate ──────────────────────────────────────────────────────────────────
  function showGate(msg){
    $('app').hidden = true; $('gate').hidden = false;
    $('key-err').textContent = msg || '';
    setTimeout(() => $('key-input').focus(), 0);
  }
  async function checkKey(k){
    let r;
    try{
      r = await fetch(WORKER + '/auth/admin-key-check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ adminKey: k }) });
    }catch(e){ return 'net'; }
    if(r.status === 401) return 'bad';
    if(r.status === 429) return 'rate';
    if(r.status !== 200) return 'net';
    try{ const j = await r.json(); return j && j.ok === true ? 'ok' : 'net'; }catch(e){ return 'net'; }
  }
  function gateMsg(result){ return result === 'rate' ? 'Too many attempts. Try again in 15 minutes.' : result === 'bad' ? 'Wrong admin key.' : MSG_NET; }
  $('gate-form').addEventListener('submit', async function(ev){
    ev.preventDefault();
    const typed = ($('key-input').value || '').trim();
    if(!typed){ $('key-err').textContent = 'Enter the admin key.'; return; }
    $('key-btn').disabled = true; $('key-err').textContent = '';
    const result = await checkKey(typed);
    $('key-btn').disabled = false;
    if(result !== 'ok'){ $('key-err').textContent = gateMsg(result); return; }
    remember(typed); KEY = typed; $('key-input').value = '';
    open();
  });
  $('forget-btn').addEventListener('click', function(){ forget(); coaches = []; $('list').textContent = ''; showGate(''); });

  async function open(){
    $('gate').hidden = true; $('app').hidden = false;
    $('load-err').hidden = true;
    $('list').textContent = '';
    $('list').appendChild(el('div', 'empty', 'Loading contacts...'));
    const res = await post('/admin/bd/list');
    if(!KEY) return;
    if(res.status !== 200 || !res.j || !res.j.ok){
      $('list').textContent = '';
      $('load-err').hidden = false;
      $('load-err').textContent = 'Could not load the list. ' + errText(res);
      return;
    }
    coaches = res.j.coaches || [];
    render();
  }

  // ── Filter, search, counts ────────────────────────────────────────────────
  function inTab(c){ return tab === 'All' || catOf(c) === tab; }
  function matches(c){
    if(!inTab(c)) return false;
    if(filter !== 'All' && c.status !== filter) return false;
    if(!query) return true;
    const phoneDigits = (c.phone || '').replace(/\D/g, '');
    const hay = [c.firstName, c.lastName, c.name, c.role, c.school, c.city, c.county, c.email, c.phone, phoneDigits, c.notes].join(' ').toLowerCase();
    return query.split(/\s+/).every(w => hay.indexOf(w) !== -1);
  }
  function visible(){
    return coaches.filter(matches).sort((a, b) =>
      STATUSES.indexOf(a.status) - STATUSES.indexOf(b.status) ||
      (a.school || a.name || a.email).localeCompare(b.school || b.name || b.email));
  }
  function setTab(t){
    tab = t;
    try{ localStorage.setItem(TAB_STORE, t); }catch(e){}
    render();
  }
  function drawTabs(){
    const box = $('tabs'); box.textContent = '';
    [['All', 'All']].concat(CATEGORIES.map(c => [c[0], c[1]])).forEach(([id, label]) => {
      const n = id === 'All' ? coaches.length : coaches.filter(c => catOf(c) === id).length;
      const b = el('button', 'tab', label);
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(tab === id));
      b.dataset.tab = id;
      b.appendChild(el('span', 'n', '(' + n + ')'));
      b.addEventListener('click', function(){ setTab(id); });
      box.appendChild(b);
    });
    // Keep the selected tab in view when the row scrolls on a phone.
    const on = box.querySelector('[aria-selected="true"]');
    if(on && (on.offsetLeft < box.scrollLeft || on.offsetLeft + on.offsetWidth > box.scrollLeft + box.clientWidth)) box.scrollLeft = Math.max(0, on.offsetLeft - 16);
  }
  // Tabs and status chips, both counted; status counts are for the current tab.
  function drawChips(){
    drawTabs();
    const box = $('chips'); box.textContent = '';
    const pool = coaches.filter(inTab);
    ['All'].concat(STATUSES).forEach(s => {
      const n = s === 'All' ? pool.length : pool.filter(c => c.status === s).length;
      const b = el('button', 'chip', s);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(filter === s));
      b.dataset.status = s;
      b.appendChild(el('span', 'n', '(' + n + ')'));
      b.addEventListener('click', function(){ filter = s; render(); });
      box.appendChild(b);
    });
  }
  function render(){
    drawChips();
    const list = $('list'); list.textContent = '';
    const rows = visible();
    if(!rows.length){ list.appendChild(el('div', 'empty', coaches.length ? 'No contacts match.' : 'No contacts yet. Tap Add contact to start.')); return; }
    rows.forEach(c => list.appendChild(card(c)));
  }
  let qTimer = 0;
  $('q').addEventListener('input', function(){
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { query = $('q').value.trim().toLowerCase(); render(); }, 150);
  });

  // ── One contact, edited in place ──────────────────────────────────────────
  function field(label, cls, input, key){
    const l = el('label', 'f ' + (cls || ''), label);
    if(key) l.dataset.k = key;
    l.appendChild(input);
    return l;
  }
  function categorySelect(value){
    const s = document.createElement('select');
    CATEGORIES.forEach(c => { const o = el('option', null, c[1]); o.value = c[0]; if(c[0] === value) o.selected = true; s.appendChild(o); });
    return s;
  }
  // The organization field's label and placeholder follow the category.
  function setOrgLabel(label, input, cat){
    label.firstChild.textContent = orgLabel(cat);
    input.placeholder = orgLabel(cat);
  }
  function textInput(value, max, type){
    const i = document.createElement('input');
    i.type = type || 'text'; i.value = value || ''; i.maxLength = max; i.autocomplete = 'off';
    return i;
  }
  function statusSelect(value){
    const s = document.createElement('select');
    STATUSES.forEach(v => { const o = el('option', null, v); o.value = v; if(v === value) o.selected = true; s.appendChild(o); });
    return s;
  }
  // An unsubscribe time (ISO) as a date on this device.
  function dayOf(iso){
    const d = new Date(iso || '');

  }

  // Phone box with a tap-to-call link beside it. The link follows the last saved
  // phone, so it never dials something the worker refused.
  function phoneField(value){
    const l = el('label', 'f', 'Phone');

    const rowEl = el('div', 'prow');

    input.inputMode = 'tel'; input.autocomplete = 'tel'; input.placeholder = 'Phone';
    const call = el('a', 'call', 'Call');
    rowEl.appendChild(input); rowEl.appendChild(call);
    l.appendChild(rowEl);
    function setCall(p){
      const digits = (p || '').replace(/[^\d+]/g, '');
      call.hidden = !digits;
      if(digits){ call.href = 'tel:' + digits; call.setAttribute('aria-label', 'Call ' + p); }
      else call.removeAttribute('href');
    }
    setCall(value);
    return { label: l, input, setCall };
  }
  // Assistant coach and athletic director: contacts on the lead only. Their emails are never
  // campaign recipients and never in Copy emails for BCC (the worker sends to email only).
  const STAFF = [['assistant', 'Assistant coach', 'Asst'], ['ad', 'Athletic director', 'AD']];
  function staffInputs(c){
    const o = {};
    STAFF.forEach(([p]) => {
      const n = textInput(c && c[p + 'Name'], 80), e = textInput(c && c[p + 'Email'], 200, 'email'), t = textInput(c && c[p + 'Phone'], 30, 'tel');
      n.placeholder = 'Name'; e.placeholder = 'Email'; t.placeholder = 'Phone'; t.inputMode = 'tel';
      o[p + 'Name'] = n; o[p + 'Email'] = e; o[p + 'Phone'] = t;
    });

  }
  function staffBlock(inp){
    const wrap = el('div', 'staff');
    STAFF.forEach(([p, title]) => {
      const g = el('fieldset', 'sgrp');
      g.dataset.staff = p;
      g.appendChild(el('legend', null, title));
      g.appendChild(field('Name', '', inp[p + 'Name'], p + 'Name'));
      g.appendChild(field('Email', '', inp[p + 'Email'], p + 'Email'));
      g.appendChild(field('Phone', '', inp[p + 'Phone'], p + 'Phone'));
      wrap.appendChild(g);
    });
    return wrap;
  }
  // The compact lines under the card header ("Asst: Danny Meinecke", then email and phone
  // links), drawn from the last saved values so a link never points at a refused value.
  function drawStaff(box, c){
    box.textContent = '';
    STAFF.forEach(([p, , short]) => {
      const name = (c[p + 'Name'] || '').trim(), mail = (c[p + 'Email'] || '').trim(), tel = (c[p + 'Phone'] || '').trim();
      if(!name && !mail && !tel) return;
      const line = el('span', 'sline');
      line.dataset.staff = p;
      line.appendChild(el('b', null, short + ':'));
      if(name) line.appendChild(el('span', 'sname', name));
      if(mail){ const a = el('a', 'smail', mail); a.href = 'mailto:' + mail; line.appendChild(a); }
      const digits = tel.replace(/[^\d+]/g, '');
      if(tel){ const a = el('a', 'stel', tel); if(digits) a.href = 'tel:' + digits; line.appendChild(a); }

      // How it arrived (worker unsubVia): the page button, or a mail app's one-click.
      const via = c.unsubVia === 'page' ? 'via page button' : c.unsubVia === 'one_click' ? 'via mail app' : '';

    }
    box.appendChild(meta);
    const err = el('div', 'errbox wide', '');
    err.hidden = true; err.setAttribute('role', 'alert');
    box.appendChild(err);

    const inputs = Object.assign({ category, firstName, lastName, role, school, city, county, email, phone, status, nextStep, notes }, staffIn);
    const SELECTS = { category: 1, status: 1 };
    let timer = 0, busy = false, again = false, dirty = false;
    function read(){
      const o = { id: c.id };
      for(const k in inputs) o[k] = inputs[k].value;

    function fail(msg, bad){

  function csvCell(v){
    let s = String(v == null ? '' : v);
    if(/^[=+\-@\t\r]/.test(s)) s = "'" + s; // keeps a spreadsheet from running a cell as a formula

  }
  function today(){

  // ── Email campaign ────────────────────────────────────────────────────────

  const REASONS = { not_now: 'Not now', unsubscribed: 'Unsubscribed', no_email: 'No email', already_sent: 'Already sent this campaign', stuck: 'Stuck mid-send (check Resend before anything else)', status_changed: 'Status changed', in_progress: 'Another send has it', gone: 'Deleted', cap_reached: 'Daily cap reached', send_failed: 'Resend refused it', busy: 'Busy, try again', network: 'No answer from CourtSense', not_sent: 'Not sent (the run stopped)' };

    const subj = el('div', 'subj', 'Loading...');

    const warn = el('div', 'warn', ''); warn.hidden = true; warn.dataset.k = 'postal';
    const today = el('div', 'muted', '');
    const counts = el('div', 'row', '');
    const recDetails = el('details'); const recSum = el('summary', null, 'Recipients'); const recList = el('ul');
    recDetails.appendChild(recSum); recDetails.appendChild(recList);
    const skDetails = el('details'); const skSum = el('summary', null, 'Skipped'); const skList = el('ul');
    skDetails.appendChild(skSum); skDetails.appendChild(skList);
    const pick = document.createElement('select'); pick.setAttribute('aria-label', 'Lead to preview');
    const pvBtn = el('button', 'b-quiet', 'Preview'); pvBtn.type = 'button';
    const testBtn = el('button', 'b-quiet', 'Send test to Mark'); testBtn.type = 'button';
    const pvRow = el('div', 'row'); pvRow.appendChild(pick); pvRow.appendChild(pvBtn); pvRow.appendChild(testBtn);
    const pvMeta = el('div', 'muted', ''); pvMeta.hidden = true;
    const frame = document.createElement('iframe');
    frame.setAttribute('sandbox', '');
    frame.setAttribute('title', 'Email preview');
    frame.setAttribute('referrerpolicy', 'no-referrer');
    frame.hidden = true;
    const sendBtn = el('button', 'b-gold', 'Send to all'); sendBtn.type = 'button';
    const sendRow = el('div', 'row'); sendRow.appendChild(sendBtn);
    const prog = el('div', 'prog', ''); prog.setAttribute('role', 'status'); prog.setAttribute('aria-live', 'polite');
    const err = el('div', 'errbox', ''); err.hidden = true; err.setAttribute('role', 'alert');
    const failList = el('ul');
    const retryBtn = el('button', 'b-quiet', 'Retry failed'); retryBtn.type = 'button'; retryBtn.hidden = true;
    [head, subj, checks, warn, today, counts, recDetails, skDetails, pvRow, pvMeta, frame, sendRow, prog, failList, retryBtn, err].forEach(x => box.appendChild(x));
    close.addEventListener('click', function(){ if(!st.busy) slot.textContent = ''; });

    function showErr(msg){ err.hidden = !msg; err.textContent = msg || ''; }
    function drawChecks(sendable){
      checks.textContent = '';
      sendable.forEach(v => {
        const l = el('label', null, '');
        const c = document.createElement('input'); c.type = 'checkbox'; c.value = v; c.checked = st.statuses.indexOf(v) !== -1;
        c.addEventListener('change', function(){
          const on = Array.from(checks.querySelectorAll('input')).filter(x => x.checked).map(x => x.value);
          if(!on.length){ c.checked = true; return; }
          st.statuses = on; load();
        });
        l.appendChild(c); l.appendChild(document.createTextNode(v));
        checks.appendChild(l);
      });
    }
    function draw(){
      const d = st.data;
      subj.textContent = d.campaign.name + ': ' + d.campaign.subject;
      warn.hidden = d.postalAddressSet;
      warn.textContent = d.postalAddressSet ? '' : 'No mailing address is set (BD_POSTAL_ADDRESS), so Send to all is locked. Preview and Send test to Mark still work.';
      today.textContent = 'Sent today: ' + d.today.sent + ' of ' + d.today.cap + ' (' + d.today.remaining + ' left)';
      counts.textContent = d.recipients.length + (d.recipients.length === 1 ? ' recipient' : ' recipients') + ', ' + d.skipped.length + ' skipped';
      recSum.textContent = 'Recipients (' + d.recipients.length + ')';
      recList.textContent = '';
      d.recipients.forEach(r => recList.appendChild(el('li', null, (r.name || r.email) + (r.school ? ', ' + r.school : '') + '. ' + lastLine(r) + (r.retry ? '. Last try failed' : ''))));
      skSum.textContent = 'Skipped (' + d.skipped.length + ')';
      skList.textContent = '';
      d.skipped.forEach(r => skList.appendChild(el('li', null, (r.name || r.email || r.school || 'Contact') + (r.school ? ', ' + r.school : '') + ': ' + (REASONS[r.reason] || r.reason) + '. ' + lastLine(r))));
      const keep = pick.value;
      pick.textContent = '';
      d.recipients.concat(d.skipped).forEach(r => { const o = el('option', null, (r.name || r.email) + (r.school ? ' (' + r.school + ')' : '')); o.value = r.id; pick.appendChild(o); });
      if(keep && Array.from(pick.children).some(o => o.value === keep)) pick.value = keep;
      pvBtn.disabled = testBtn.disabled = !pick.children.length;
      sendBtn.disabled = st.busy || !d.postalAddressSet || !d.recipients.length;
      sendBtn.textContent = 'Send to all (' + d.recipients.length + ')';
    }
    async function load(keepErr){
      if(!keepErr) showErr('');
      const res = await post('/admin/bd/campaign/overview', { statuses: st.statuses });
      if(res.status !== 200 || !res.j || !res.j.ok){ subj.textContent = ''; showErr('Could not load the campaign. ' + errText(res)); return; }
      st.data = res.j;
      st.statuses = res.j.statuses;
      drawChecks(res.j.sendable);
      draw();
    }
    pvBtn.addEventListener('click', async function(){
      if(!pick.value) return;
      pvBtn.disabled = true; showErr('');
      const res = await post('/admin/bd/campaign/preview', { id: pick.value });
      pvBtn.disabled = false;
      if(res.status !== 200 || !res.j || !res.j.ok){ showErr('Could not preview. ' + errText(res)); return; }
      pvMeta.hidden = false;
      pvMeta.textContent = 'To ' + res.j.to + ', from ' + res.j.from + '. Subject: ' + res.j.subject + (res.j.excluded ? '. This lead is skipped: ' + (REASONS[res.j.excluded] || res.j.excluded) : '') + (res.j.warning ? '. ' + res.j.warning : '');
      frame.hidden = false;
      frame.srcdoc = res.j.html;
    });
    testBtn.addEventListener('click', async function(){
      testBtn.disabled = true; showErr('');
      const res = await post('/admin/bd/campaign/test', { id: pick.value || '' });
      testBtn.disabled = false;
      if(res.status === 200 && res.j && res.j.ok) note('Test sent to ' + res.j.to + '. Nothing was logged.');
      else showErr('Test not sent. ' + errText(res));
    });

    async function run(ids){
      st.busy = true; sendBtn.disabled = true; retryBtn.hidden = true; failList.textContent = ''; showErr('');
      const all = [];
      let stop = '';
      for(let i = 0; i < ids.length && !stop; i += CAMP_BATCH){
        const batch = ids.slice(i, i + CAMP_BATCH);
        prog.textContent = 'Sending ' + Math.min(i + batch.length, ids.length) + ' of ' + ids.length + '...';
        const res = await post('/admin/bd/campaign/send', { campaignId: st.data.campaign.id, statuses: st.statuses, ids: batch });
        if(res.status === 200 && res.j && res.j.ok){
          res.j.results.forEach(r => all.push(r));
          if(res.j.capReached) stop = 'cap';
        } else if(res.status === 0){
          batch.forEach(id => all.push({ id, result: 'failed', reason: 'network' }));
        } else {
          stop = errText(res);
          batch.forEach(id => all.push({ id, result: 'failed', reason: (res.j && res.j.code) || 'busy' }));
        }
        if(i + CAMP_BATCH < ids.length && !stop) await new Promise(r => setTimeout(r, CAMP_PAUSE_MS));
      }
      ids.forEach(id => { if(!all.some(r => r.id === id)) all.push({ id, result: stop === 'cap' ? 'cap_reached' : 'not_sent' }); });
      const sent = all.filter(r => r.result === 'sent').length;
      const failed = all.filter(r => r.result === 'failed' || r.result === 'stuck');
      const skipped = all.length - sent - failed.length;
      prog.textContent = 'Sent ' + sent + ', skipped ' + skipped + ', failed ' + failed.length + '.' + (stop === 'cap' ? ' Stopped at the daily cap.' : '');
      const label = id => { const r = st.data.recipients.concat(st.data.skipped).find(x => x.id === id); return r ? (r.name || r.email) : 'A contact'; };
      all.filter(r => r.result !== 'sent').forEach(r => failList.appendChild(el('li', null, label(r.id) + ': ' + (r.result === 'stuck' ? REASONS.stuck : (REASONS[r.reason] || REASONS[r.result] || r.result)))));
      st.results = all;
      const retry = all.filter(r => r.result === 'failed').map(r => r.id);
      retryBtn.hidden = !retry.length;
      retryBtn.dataset.ids = retry.join(',');
      const stopped = stop && stop !== 'cap';
      if(stopped) showErr('Sending stopped. ' + stop);
      st.busy = false;
      await load(stopped);
    }
    sendBtn.addEventListener('click', function(){
      if(st.busy || !st.data || box.querySelector('.confirm')) return;
      const n = st.data.recipients.length;
      const row = el('div', 'confirm');
      row.dataset.confirm = 'send';
      row.appendChild(el('span', null, 'Send "' + st.data.campaign.subject + '" to ' + n + (n === 1 ? ' coach' : ' coaches') + ' now? This cannot be undone.'));
      const yes = el('button', 'b-gold', 'Send ' + n); yes.type = 'button';
      const no = el('button', 'b-quiet', 'Cancel'); no.type = 'button';
      row.appendChild(yes); row.appendChild(no);
      box.insertBefore(row, prog);
      no.focus();
      no.addEventListener('click', function(){ row.remove(); sendBtn.focus(); });
      yes.addEventListener('click', function(){ row.remove(); run(st.data.recipients.map(r => r.id)); });
    });
    retryBtn.addEventListener('click', function(){
      if(st.busy) return;
      const ids = (retryBtn.dataset.ids || '').split(',').filter(Boolean);
      if(ids.length) run(ids);
    });
    load();
    return box;
  }
  $('camp-btn').addEventListener('click', function(){
    const slot = $('add-slot');
    if(slot.firstChild && slot.firstChild.dataset && slot.firstChild.dataset.panel === 'campaign') return;
    campaignPanel();
  });

  // ── Start ─────────────────────────────────────────────────────────────────
  (async function(){
    const k = stored();
    if(!k){ showGate(''); return; }
    const result = await checkKey(k);
    if(result === 'bad'){ forget(); showGate('That admin key no longer works. Enter it again.'); return; }
    if(result !== 'ok'){ showGate(gateMsg(result)); return; }
    KEY = k;
    open();
  })();
})();
</script>
</body>
</html>
