<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Unsubscribe | CourtSense</title>
<link rel="icon" type="image/png" href="/favicon_large.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#082A4F;--gold:#F2B22E;--red:#B3261E;
  --paper:#FBF7F0;--ink:#13243A;--slate:#5C6B7A;--line:#E6DDCC;--white:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Barlow',-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.55;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;}
.hdr{background:var(--navy);padding:12px 16px;display:flex;align-items:center;gap:10px;}
.hdr img{height:32px;width:auto;display:block;}
.hdr span{color:var(--gold);font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2.5px;line-height:1;}
main{max-width:480px;margin:0 auto;padding:28px 16px 48px;}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:22px 18px;}
h1{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:1.2px;line-height:1.1;color:var(--navy);margin-bottom:10px;}
p{margin:0 0 10px;}
.btn{display:block;width:100%;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.5px;padding:12px;border:none;border-radius:12px;background:var(--navy);color:#fff;cursor:pointer;margin-top:14px;}
.btn:disabled{opacity:.55;cursor:default;}
.msg{font-size:15px;margin-top:12px;min-height:1.2em;color:var(--slate);}
.msg.err{color:var(--red);font-weight:600;}
.hidden{display:none;}
</style>
</head>
<body>
<div class="hdr"><img src="/logo.png" alt="" width="32" height="32"><span>CourtSense</span></div>
<main>
  <div class="card" aria-live="polite">
    <h1 id="u-title">One moment...</h1>
    <p id="u-text">We're taking you off Mark's CourtSense emails.</p>
    <button type="button" class="btn" id="u-btn">Unsubscribe</button>
    <p class="msg" id="u-msg" role="status"></p>
  </div>
</main>
<script>
(function(){
  // The unsubscribe link in one of Mark's outreach emails: /u/?t={token}. Opening the page
  // does nothing on its own server side; the worker acts only on the POST below, sent once
  // after a short pause (the button is the fallback). A mail scanner that only fetches the
  // link changes nothing.
  var ENDPOINT = 'https://courtsense-email-worker.markmcnees-479.workers.dev/bd/unsubscribe';
  var TOKEN_RE = /^[A-Za-z0-9_-]{22}$/;
  var DELAY_MS = 1200;
  var COPY = {
    ok: "You're unsubscribed. You won't get more emails from Mark about CourtSense. If you change your mind, just reply to any earlier email.",
    bad: "This link isn't working. Reply to the email and we'll take care of it.",
    throttled: 'Too many tries just now. Wait a few minutes, then tap Unsubscribe again.',
    network: "We couldn't reach CourtSense just now. Check your connection, then tap Unsubscribe again."
  };
  var title = document.getElementById('u-title');
  var text = document.getElementById('u-text');
  var btn = document.getElementById('u-btn');
  var msg = document.getElementById('u-msg');

  var t = '';
  try { t = new URLSearchParams(location.search).get('t') || ''; } catch (e) { t = ''; }
  // Keep the token out of the address bar and history once it is read.
  try { if (location.search && history.replaceState) history.replaceState(null, '', location.pathname); } catch (e) {}

  var busy = false, done = false, timer = 0;
  function finish(head, body){
    done = true;
    title.textContent = head;
    text.textContent = body;
    btn.classList.add('hidden');
    btn.disabled = true;
    msg.textContent = '';
    msg.className = 'msg';
  }
  function retryable(line){
    busy = false;
    btn.disabled = false;
    btn.classList.remove('hidden');
    msg.textContent = line;
    msg.className = 'msg err';
  }

  if (!TOKEN_RE.test(t)) { finish("This link isn't working", COPY.bad); return; }

  function send(){
    if (busy || done) return;     // one request at a time, and never after an answer
    busy = true;
    if (timer) { clearTimeout(timer); timer = 0; }
    btn.disabled = true;
    msg.className = 'msg';
    msg.textContent = 'Unsubscribing...';
    var p;
    try {
      p = fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: t }), credentials: 'omit', cache: 'no-store' });
    } catch (e) { retryable(COPY.network); return; }
    p.then(function(r){
      return r.json().catch(function(){ return null; }).then(function(j){ return { status: r.status, j: j }; });
    }).then(function(res){
      var j = res.j || {};
      if (res.status === 200 && j.ok === true) finish("You're unsubscribed", COPY.ok);
      else if (j.code === 'bad_link') finish("This link isn't working", COPY.bad);
      else if (res.status === 429 || j.code === 'throttled') retryable(COPY.throttled);
      else retryable(COPY.network);
    }, function(){ retryable(COPY.network); });
  }

  btn.addEventListener('click', send);
  timer = setTimeout(send, DELAY_MS);
})();
</script>
</body>
</html>
