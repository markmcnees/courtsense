<style>
:root{
  --navy:#082A4F;--blue:#0081AB;--gold:#F2B22E;--teal:#217F7F;
  --paper:#FBF7F0;--ink:#13243A;--slate:#5C6B7A;--line:#E6DDCC;--white:#ffffff;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Barlow',-apple-system,sans-serif;font-size:16px;line-height:1.55;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;}
.hdr{background:var(--navy);padding:14px 16px;}
.hdr-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{display:flex;align-items:center;gap:10px;color:var(--gold);font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2.5px;text-decoration:none;min-height:44px;}
.brand img{height:30px;width:auto;}
.hdr-link{color:#fff;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1.5px;text-decoration:none;padding:10px 14px;border-radius:8px;background:rgba(255,255,255,.12);min-height:44px;display:inline-flex;align-items:center;}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px;}
h1{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:1.5px;line-height:1.05;color:var(--navy);}
.lead{font-size:16px;color:var(--ink);margin:8px 0 20px;}
.status{font-size:15px;color:var(--slate);padding:18px 0;}
.status.err{color:#9b1c1c;font-weight:600;}

.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
.card.featured{border:2px solid var(--gold);box-shadow:0 8px 24px rgba(8,42,79,.10);}
.card summary{list-style:none;cursor:pointer;padding:16px 16px 14px;display:block;min-height:44px;}
.card summary::-webkit-details-marker{display:none;}
.t-name{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1px;line-height:1.1;color:var(--navy);}
.t-meta{font-size:14px;color:var(--slate);margin-top:4px;}
.t-counts{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:8px;}
.t-count{font-size:14px;color:var(--slate);}
.chev{float:right;font-size:14px;font-weight:600;color:#145757;text-decoration:underline;text-underline-offset:3px;margin:2px 0 0 10px;}
.quiets{display:flex;flex-wrap:wrap;align-items:center;gap:0 18px;margin-top:12px;}
.flash{margin:0 0 10px;}
details[open] .chev .closed, details:not([open]) .chev .open{display:none;}
.body{padding:0 16px 16px;border-top:1px solid var(--line);}
.sec-h{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:1.2px;color:var(--navy);margin:16px 0 8px;}
.divs{font-size:13px;color:var(--slate);margin-top:12px;}
.divs div{margin-bottom:2px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:none;}
.who{font-weight:700;font-size:15px;color:var(--ink);}
.rating{display:inline-block;margin-left:6px;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.5px;color:var(--white);background:var(--navy);border-radius:5px;padding:0 6px;vertical-align:1px;}
.needs{font-size:13px;color:var(--slate);margin-top:2px;}
.empty{font-size:14px;color:var(--slate);padding:6px 0 2px;}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 16px;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1.2px;text-decoration:none;white-space:nowrap;border:none;cursor:pointer;}
.btn-p{background:var(--navy);color:#fff;}
.btn-o{background:transparent;color:var(--navy);border:1.5px solid var(--navy);}
.btn-gold{background:var(--gold);color:var(--navy);}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;}
.actions .btn{flex:1;min-width:150px;}
.ext{color:var(--blue);font-weight:600;font-size:14px;}
.note{font-size:12px;color:var(--slate);margin-top:10px;line-height:1.5;}
/* Reach out, teams and conversations */
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 16px;}
.compose{background:#F7F3EA;border:1px solid var(--line);border-radius:10px;padding:12px;margin:4px 0 12px;}
.compose label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin:6px 0 4px;}
.compose select,.compose textarea,.panel textarea,.panel input[type=text]{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);}
.compose textarea,.panel textarea{min-height:84px;resize:vertical;}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink);margin:8px 0;}
.chk input{margin-top:3px;width:18px;height:18px;flex:none;}
.count{font-size:12px;color:var(--slate);text-align:right;}
.msg-err{font-size:13px;color:#9b1c1c;font-weight:600;margin-top:6px;}
.msg-ok{font-size:13px;color:var(--teal);font-weight:600;margin-top:6px;}
.team{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
.team:last-child{border-bottom:none;}
.team .who{font-size:15px;}
.done{color:var(--teal);font-weight:700;font-size:13px;}
.reg-chip{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:999px;background:var(--teal);color:#fff;font-weight:700;font-size:13px;}
.thread-msg{padding:10px 12px;border-radius:10px;margin:8px 0;background:#EEF3F7;max-width:92%;}
.thread-msg.mine{background:#FDF1D6;margin-left:auto;}
.thread-msg.answer{border-left:4px solid var(--gold);}
.thread-msg.sys{background:transparent;color:var(--slate);font-size:13px;text-align:center;max-width:100%;padding:4px;}
.thread-msg .from{font-size:12px;font-weight:700;color:var(--slate);margin-bottom:2px;}
.thread-msg .text{white-space:pre-wrap;word-wrap:break-word;font-size:15px;}
.linkbtn{background:none;border:none;color:var(--slate);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:6px 0;min-height:32px;}
.req{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;}
.req .state{font-size:13px;color:var(--slate);margin-top:2px;}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.btns .btn{flex:1;min-width:90px;}
.req .quote{margin:8px 0;padding:10px 12px;border-left:4px solid var(--gold);background:#FAF7EF;white-space:pre-wrap;word-wrap:break-word;font-size:15px;}
.req.pinned{border:2px solid var(--gold);background:#FFFDF8;}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px;}
.opts .btn{flex:1;min-width:70px;}
.opts .btn.sel{background:var(--navy);color:#fff;border-color:var(--navy);}
.req label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin:8px 0 4px;}
footer{text-align:center;font-size:14px;color:var(--slate);padding:24px 16px 32px;border-top:1px solid var(--line);}
footer a{color:var(--navy);font-weight:600;text-decoration:none;margin:0 6px;display:inline-block;min-height:44px;line-height:44px;}
@media (min-width:600px){h1{font-size:48px;}}
</style>

<body>

<div class="hdr">
  <div class="hdr-inner">
    <a href="/" class="brand"><img src="/logo.png" alt="" onerror="this.style.display='none'"><span>CourtSense</span></a>
    <a class="hdr-link" id="hdr-account" href="/pickup/?view=tournaments">Sign in</a>
  </div>
</div>

<main>
  <h1>Find a tournament partner</h1>
  <p class="lead">See who is looking for a team at upcoming events. Sign in free to reach out or post yourself.</p>
  <div id="panel"></div>
  <div id="board"><div class="status">Loading tournaments...</div></div>
</main>

<footer>
  <a href="/">Home</a><a href="/privacy/">Privacy</a><a href="/sms-terms/">Text Terms</a>
</footer>

<script src="/partner-contact.js?v=11"></script>
<script>
// Public partner board. Everything shown comes from the worker's sanitized
// /pickup/partner-board route: short display names, ratings, division labels, team
// cards and opaque refs. Signed-in players can Reach out, Ask to join, and read and
// answer their conversations through the /partners/* worker routes, which check the
// stored session token on every call. Every value, including message text, is set
// through textContent, never innerHTML.
(function(){
  const WORKER = 'https://courtsense-email-worker.markmcnees-479.workers.dev';
  const PICKUP = '/pickup/';
  const params = new URLSearchParams(location.search);
  const tid = (params.get('t') || '').trim();
  const board = document.getElementById('board');

  function el(tag, cls, text){
    const n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text != null) n.textContent = text;
    return n;
  }
  function link(cls, text, href){ const a = el('a', cls, text); a.href = href; return a; }

  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  // 'YYYY-MM-DD' read as a calendar date, never through a time zone.
  function parts(iso){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? { y:+m[1], m:+m[2], d:+m[3] } : null; }
  function dayShort(iso){
    const p = parts(iso); if(!p) return '';
    const wd = new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay();
    return DAYS[wd] + ', ' + MONTHS[p.m - 1] + ' ' + p.d;
  }
  function dateRange(a, b){
    if(!b || a === b) return dayShort(a);
    const pa = parts(a), pb = parts(b);
    if(pa && pb && pa.m === pb.m) return dayShort(a) + ' to ' + pb.d;
    return dayShort(a) + ' to ' + dayShort(b);
  }
  function plural(n, one, many){ return n + ' ' + (n === 1 ? one : many); }
  function trnHref(id){ return PICKUP + '?view=tournaments&trn=' + encodeURIComponent(id); }

  // ── Signed-in player, read from the stored session (no Firebase, no auth.js). The
  // worker checks the token on every call, so nothing here is trusted on its own.
  // Token, worker calls and the compose box live in /partner-contact.js, shared with
  // the pickup pool roster. ──
  const PC = window.CourtSensePartner;
  // Sign-in happens on pickup; return= brings the player back here afterward.
  function signInHref(back){ return PICKUP + '?view=tournaments&return=' + encodeURIComponent(back || (location.pathname + location.search)); }
  const SIGN_IN = signInHref();
  const token = PC.storedToken();
  let me = null; // { display, adult, hsBlocked, partnerEmails, teamsEnabled, configured } when signed in
  let meFail = null; // { reason, error } when a stored token was refused or could not be checked

  function post(path, data){ return PC.post(path, data, token); }
  async function loadMe(){
    const r = await PC.loadMe(token);
    if(!r.me && r.reason !== 'no_token') meFail = r;
    return r.me;
  }
  const canMessage = () => !!(me && me.configured && !me.hsBlocked);
  // The signed-in player's own rows and teams, by the refs the worker hands back on
  // /partners/me. Nobody gets Ask to team up on their own row or Ask to join on their own team.
  const isMine = (tid, ref) => !!(me && me.selfRefs && ref && (me.selfRefs[tid] || []).indexOf(ref) !== -1);
  function signInLink(text, back){ return PC.goldLink(text, signInHref(back)); }
  // Back from signing in with ?ask=<ref>: the row's button, opened once the board is drawn.
  const askRef = (params.get('ask') || '').trim();
  const askDiv = (params.get('div') || '').trim();
  let askOpen = null;
  function btn(cls, text, onClick){
    const b = el('button', 'btn ' + cls, text);
    b.type = 'button';
    b.addEventListener('click', onClick);
    return b;
  }
  function threadHref(id){ return '/partners/?thread=' + encodeURIComponent(id); }

  function textBox(placeholder){ return PC.textBox(placeholder); }
  function adultBox(){ return PC.adultBox(me); }

  // Compose under a row (partner-contact.js): Ask to team up with a person, invite
  // them to your team, or Ask to join a team. A 401 on send offers Sign in again,
  // which comes back to this row. The open box is kept by ref so a board refresh
  // puts it back in the redrawn row instead of losing it.
  let kept = null; // { ref, box }; ref is the row's key (a person or team ref, or a match key)
  function openCompose(host, opts, key){
    const box = PC.openCompose(host, opts, {
      me: me, token: token, ui: { primary: 'btn btn-p', secondary: 'btn btn-o' },
      onSignIn: function(){ location.href = signInHref('/partners/?t=' + encodeURIComponent(opts.tid) + '&ask=' + encodeURIComponent(opts.ref)); },
      onSent: function(){ refresh(); },
    });
    kept = box ? { ref: key || opts.ref, box: box } : null;
  }
  // A box closed with Cancel has no parent and stays closed.
  function reattach(host, ref){
    if(kept && kept.ref === ref && kept.box.parentNode && !host.contains(kept.box)) host.appendChild(kept.box);
  }

  // Division choices for a person: every division behind their needs, labelled the
  // way the tournament lists it.
  function personDivs(t, p){
    const byId = {};
    (t.divisions || []).forEach(d => { byId[d.div] = d; });
    const out = [];
    (p.needs || []).forEach(n => (n.divs || []).forEach(id => { if(byId[id]) out.push({ div: id, day: byId[id].day, label: dayShort(byId[id].day) + ': ' + byId[id].label }); }));
    return out;
  }
  function reachOutBtn(t, p, holder){
    if(!p.ref || isMine(t.id, p.ref)) return null;
    const teamUp = !!(me && me.teamsEnabled);
    const divs = personDivs(t, p);
    // Back to this tournament, with this player's box opened and the division kept.
    if(!token || !me) return signInLink('Sign in to team up', '/partners/?t=' + encodeURIComponent(t.id) + '&ask=' + encodeURIComponent(p.ref) + (divs[0] ? '&div=' + encodeURIComponent(divs[0].div) : ''));
    if(!canMessage()) return null;
    // A request to this player is still open: no second send.
    if(PC.isSent(me, t.id, p.ref)) return PC.sentBtn();
    // On a forming team that day in their division: Invite to your team. On a complete
    // team (or one in another division) that day: nothing for that day.
    const plan = teamUp ? PC.contactPlan(t, me.selfRefs && me.selfRefs[t.id], divs) : (divs.length ? { kind: 'ask', divs: divs } : null);
    if(!plan) return null;
    const open = plan.kind === 'invite'
      ? function(){ openCompose(holder(), { tid: t.id, ref: p.ref, divs: plan.divs, optional: true, title: PC.inviteTitle(p.display, plan.team), prompt: 'Add a note (optional)', placeholder: 'Say hi and why they would fit the team.', sendText: 'Send invite' }); }
      : teamUp
        ? function(){ openCompose(holder(), { tid: t.id, ref: p.ref, divs: plan.divs, preset: askDiv, optional: true, title: 'Ask ' + p.display + ' to team up for ' + t.name, prompt: 'Add a note (optional)', placeholder: 'Say hi and why you would make a good team.', sendText: 'Send request' }); }
        : function(){ openCompose(holder(), { tid: t.id, ref: p.ref, divs: plan.divs, preset: askDiv, prompt: 'Message to ' + p.display, placeholder: 'Say hi and why you would make a good team.', sendText: 'Send' }); };
    if(askRef && p.ref === askRef && !askOpen && !askDone) askOpen = { open: open, holder: holder };
    return PC.goldBtn(plan.kind === 'invite' ? 'Invite to your team' : teamUp ? 'Ask to team up' : 'Reach out', open);
  }
  let askDone = false;

  // Leave a team from its board row. Confirmed first; the result shows in the row.
  function leaveBtn(t, tm, out){
    return PC.quietBtn('Leave team', async function(){
      if(!window.confirm('Leave ' + PC.teamNames(tm).join(' + ') + '? Your teammates will be told and the spot opens up.')) return;
      out.textContent = '';
      const x = await post('/partners/leave', { tid: t.id, teamRef: tm.ref });
      if(!x.j.ok){ out.appendChild(el('div', 'msg-err', x.j.error || 'That did not work. Try again.')); return; }
      out.appendChild(el('div', 'msg-ok', 'You left the team.'));
      refresh();
    });
  }

  // Every team on the tournament, forming first and complete after, each in
  // division order with its division under the names.
  function teamRows(t){
    const rows = [];
    (t.divisions || []).forEach(d => (d.teams || []).forEach(tm => rows.push([d, tm])));
    return rows.sort((a, b) => (a[1].status === 'complete' ? 1 : 0) - (b[1].status === 'complete' ? 1 : 0));
  }

  // Post your team lists per tournament (/partners/me with its id): fetched when a
  // card is open, kept while the page lives, and fetched again after every change.
  // The last answer stays on screen until the new one lands.
  const extras = {}; // tid -> { data, gender, loading, stale, err }
  const boardById = {};
  function wantExtras(tid){
    if(!token || !me || !me.teamsEnabled || !canMessage()) return;
    const x = extras[tid] = extras[tid] || { data: null, gender: 'everyone' };
    if(x.loading || (x.data && !x.stale)) return;
    x.loading = true;
    const gender = x.gender;
    PC.loadMe(token, tid, gender).then(r => {
      x.loading = false; x.stale = false;
      if(r.me){ x.data = r.me; x.err = ''; }
      else x.err = r.error || 'Could not load your team details. Refresh to try again.';
      if(x.gender !== gender){ x.stale = true; wantExtras(tid); }
      drawTeams(tid);
    });
  }
  function teamsCtx(t){
    const x = extras[t.id] || {};
    return {
      me: me, token: token, extras: x.data, mine: (me && me.selfRefs && me.selfRefs[t.id]) || [],
      signedIn: !!(token && me), canMessage: canMessage(), dayLabel: dayShort, eventLink: t.eventLink,
      signIn: function(text){ return signInLink(text, '/partners/?t=' + encodeURIComponent(t.id)); },
      onChanged: function(msg, isErr){ flash[t.id] = { text: msg, err: !!isErr }; refresh(); },
      onGender: function(g){ const e = extras[t.id] = extras[t.id] || { data: null }; e.gender = g; e.stale = true; wantExtras(t.id); },
      compose: function(host, opts, key){ openCompose(host, opts, key); },
      reattach: reattach,
      threadOf: function(ref){ return (me && me.teamThreads && me.teamThreads[t.id] && me.teamThreads[t.id][ref]) || ''; },
      leave: function(tm, out){ return leaveBtn(t, tm, out); },
      askToJoin: function(c, d, tm, cb){
        openCompose(c.box, { tid: t.id, ref: tm.ref, divs: [{ div: d.div, label: d.label }], optional: true, title: cb ? PC.combineTitle(cb) : 'Ask ' + PC.teamNames(tm).join(' + ') + ' to team up for ' + t.name, prompt: 'Add a note (optional)', placeholder: cb ? 'Say hi and why your teams would work together.' : 'Tell them a bit about your game.', sendText: 'Send request' }, 'team:' + tm.ref);
      },
    };
  }
  // Always shown, with an empty line when there are no teams yet (partner-contact.js).
  function teamsSection(t){
    const host = el('div');
    host.id = 'teams-' + t.id;
    boardById[t.id] = t;
    fillTeams(t, host);
    return host;
  }
  function fillTeams(t, host){
    host.textContent = '';
    const x = extras[t.id];
    if(x && x.err) host.appendChild(el('div', 'msg-err', x.err));
    host.appendChild(PC.teamsSection(t, teamsCtx(t)));
  }
  function drawTeams(tid){
    const host = document.getElementById('teams-' + tid);
    if(host && boardById[tid]) fillTeams(boardById[tid], host);
  }

  // Always shown, with an empty line when nobody is looking. The viewer's own row
  // carries a You badge and no button.
  function playersSection(t, players){
    const s = PC.section('players', 'Players looking for a team', players.length);
    if(!players.length) s.list.appendChild(PC.emptyLine('No one is looking yet. Join the pool to be first.'));
    // The buttons are the ones each list had: a post keeps Offer to partner (and,
    // signed in, its own reach out); a free agent keeps theirs, or View event.
    players.forEach(x => {
      const mineRow = isMine(t.id, x.p.ref) || !!(x.post && isMine(t.id, x.post.ref));
      const c = PC.playerCard({
        name: x.p.display, rating: x.p.rating, mine: mineRow,
        lines: (x.p.needs || []).map(n => dayShort(n.day) + ': ' + n.label),
        note: (x.post && x.post.note) || x.p.note || '',
      });
      if(!mineRow){
        const b = (x.fa || (token && me)) ? reachOutBtn(t, x.p, () => c.box) : null;
        if(b) c.act.appendChild(b);
        if(x.post){
          const href = PICKUP + '?invite=' + encodeURIComponent(x.post.inviteId);
          c.act.appendChild(b ? PC.quietLink('Offer to partner', href) : PC.goldLink('Offer to partner', href));
        }
        if(x.fa && !b && !x.post) c.act.appendChild(PC.quietLink('View event', trnHref(t.id)));
      }
      if(x.p.ref) reattach(c.box, x.p.ref);
      s.list.appendChild(c.card);
    });
    return s.sec;
  }

  function shareBtn(t){
    const b = PC.quietBtn('Share this event');
    b.type = 'button';
    b.addEventListener('click', async function(){
      const url = location.origin + '/partners/?t=' + encodeURIComponent(t.id);
      const data = { title: t.name + ': find a team', text: 'Looking for a team for ' + t.name + '? See who is in on CourtSense.', url: url };
      try {
        if(navigator.share){ await navigator.share(data); return; }
      } catch(e){ if(e && e.name === 'AbortError') return; }
      try {
        await navigator.clipboard.writeText(url);
        b.textContent = 'Link copied';
      } catch(e){
        window.prompt('Copy this link', url);
      }
      setTimeout(function(){ b.textContent = 'Share this event'; }, 2200);
    });
    return b;
  }

  // Free agents and partner posts as one list, each player once. The board gives
  // no shared id across the two, so a post and a free agent with the same display
  // name (and no ratings that disagree) are one player: one row, with both the
  // free agent's button and the post's Offer to partner.
  function playersFor(t){
    const out = t.freeAgents.map(p => ({ p: p, fa: true, post: null }));
    t.posts.forEach(post => {
      const hit = out.find(x => x.fa && !x.post && x.p.display === post.display &&
        (typeof x.p.rating !== 'number' || typeof post.rating !== 'number' || x.p.rating === post.rating));
      if(hit) hit.post = post;
      else out.push({ p: post, fa: false, post: post });
    });
    return out.sort((a, b) => a.p.display.localeCompare(b.p.display));
  }

  function card(t, featured, open){
    const d = el('details', 'card' + (featured ? ' featured' : ''));
    d.id = 'trn-' + t.id;
    if(open) d.open = true;
    const s = el('summary');
    const chev = el('span', 'chev');
    chev.appendChild(el('span', 'open', 'Hide'));
    chev.appendChild(el('span', 'closed', 'Show'));
    s.appendChild(chev);
    // Name, then date and place, then the sign-up tag, then the counts.
    s.appendChild(el('div', 't-name', t.name));
    s.appendChild(el('div', 't-meta', dateRange(t.startDate, t.endDate) + (t.location ? ' · ' + t.location : '')));
    // Registered for this tournament (any division): one banner to the team page instead of
    // the finder, and no looking counts.
    const reg = me && me.registeredIn && me.registeredIn[t.id];
    if(reg){
      d.appendChild(s);
      const rb = el('div', 'body');
      rb.appendChild(PC.registeredBanner(reg));
      d.appendChild(rb);
      d.open = true;
      return d;
    }
    const tag = PC.tagEl(PC.trnTag(t.divisions));
    const players = playersFor(t);
    const nTeams = teamRows(t).length;
    const counts = el('div', 't-counts');
    if(tag) counts.appendChild(tag);
    counts.appendChild(el('span', 't-count', plural(nTeams, 'team', 'teams') + ' · ' + plural(players.length, 'player', 'players') + ' looking'));
    s.appendChild(counts);
    d.appendChild(s);

    const body = el('div', 'body');
    // The viewer's open requests on this event, answerable right here.
    const strip = requestStripFor(t);
    if(strip){ body.appendChild(strip); d.open = true; }
    if(t.divisionsByDay && t.divisionsByDay.length){
      const dv = el('div', 'divs');
      t.divisionsByDay.forEach(x => dv.appendChild(el('div', null, dayShort(x.day) + ': ' + x.divisions.join(', '))));
      body.appendChild(dv);
    }

    body.appendChild(teamsSection(t));
    body.appendChild(playersSection(t, players));
    // Post your team details load once the card is open.
    if(d.open) wantExtras(t.id);
    d.addEventListener('toggle', function(){ if(d.open) wantExtras(t.id); });

    // Secondary actions, quiet so they never compete with the gold buttons.
    const actions = el('div', 'quiets');
    actions.appendChild(PC.quietLink('Post yourself', trnHref(t.id)));
    if(featured) actions.appendChild(shareBtn(t));
    if(t.eventLink) actions.appendChild(PC.quietLink('Tournament registration page', t.eventLink, true));
    body.appendChild(actions);
    body.appendChild(el('div', 'note', 'Sign in to reach out, offer, or post. Names show as first name and last initial. Messages stay inside CourtSense, so nobody sees your email or phone. Partner messaging is for players 18 and older. Junior divisions are not part of partner matching.'));
    d.appendChild(body);
    return d;
  }

  function fetchBoard(t, fresh){ return PC.fetchBoard(t, fresh); }

  // The strip of open requests at the top of a tournament card. Answering or
  // withdrawing refreshes the board and the strip at once.
  // What just happened shows on the redrawn card once.
  const flash = {};
  function requestStripFor(t){
    const said = flash[t.id];
    delete flash[t.id];
    const list = me && me.requests && me.requests[t.id];
    const strip = (list && list.length && canMessage())
      ? PC.requestStrip(list, { me: me, token: token, onDone: function(j, msg){ flash[t.id] = msg; refresh(); } })
      : null;
    if(!said) return strip;
    const wrap = el('div');
    wrap.setAttribute('role', 'status');
    if(typeof said === 'string') wrap.appendChild(el('div', 'msg-ok flash', said));
    else wrap.appendChild(el('div', (said.err ? 'msg-err' : 'msg-ok') + ' flash', said.text));
    if(strip) wrap.appendChild(strip);
    return wrap;
  }

  // ── The team-up request card, used by the email link view (?req=) and pinned at the
  // top of a conversation. q: { label, state, note, canRespond, canWithdraw }.
  // ctx: { where, preset, send(answer, text, adultConfirmed) -> {ok, error}, withdraw() }.
  // Picking an answer only selects it; Send posts it. Ignore closes the request and
  // sends nothing to the other side. ──
  const ANSWERS = [['yes', 'Yes'], ['maybe', 'Maybe'], ['no', 'No'], ['ignore', 'Ignore']];
  function requestCard(q, ctx){
    const rb = el('div', 'req pinned');
    rb.appendChild(el('div', 'who', q.label));
    if(ctx.where) rb.appendChild(el('div', 'state', ctx.where));
    if(q.note) rb.appendChild(el('div', 'quote', q.note));
    if(!q.canRespond){
      rb.appendChild(el('div', 'state', q.state));
      if(q.canWithdraw && ctx.withdraw){
        const bs = el('div', 'btns');
        bs.appendChild(btn('btn-o', 'Withdraw request', ctx.withdraw));
        rb.appendChild(bs);
      }
      return rb;
    }
    let choice = ANSWERS.some(a => a[0] === ctx.preset) ? ctx.preset : '';
    const opts = el('div', 'opts');
    const lab = el('label');
    const t = textBox('');
    const adult = adultBox();
    const out = el('div');
    function paint(){
      Array.prototype.forEach.call(opts.childNodes, b => { b.className = 'btn btn-o' + (b.dataset.a === choice ? ' sel' : ''); });
      lab.textContent = choice === 'maybe' ? 'Your question or condition (they see it)' : 'Add a message (optional)';
      send.textContent = choice === 'ignore' ? 'Ignore it' : 'Send';
      t.ta.placeholder = choice === 'maybe' ? 'Ask a question or set a condition' : 'Add a message (optional)';
      const quiet = choice === 'ignore';
      [lab, t.ta, t.count].forEach(n => { n.style.display = quiet ? 'none' : ''; });
      // Only Yes and Maybe need the 18+ box; No and Ignore never do.
      if(adult) adult.lab.style.display = (choice === 'yes' || choice === 'maybe') ? '' : 'none';
    }
    ANSWERS.forEach(a => {
      const b = btn('btn-o', a[1], function(){ choice = a[0]; out.textContent = ''; paint(); });
      b.dataset.a = a[0];
      opts.appendChild(b);
    });
    rb.appendChild(opts);
    rb.appendChild(lab); rb.appendChild(t.ta); rb.appendChild(t.count);
    if(adult) rb.appendChild(adult.lab);
    const bs = el('div', 'btns');
    const send = btn('btn-p', 'Send', async function(){
      out.textContent = '';
      if(!choice){ out.appendChild(el('div', 'msg-err', 'Pick an answer first.')); return; }
      if(choice === 'maybe' && !t.ta.value.trim()){ out.appendChild(el('div', 'msg-err', 'Add your question or condition for a maybe.')); return; }
      const needsAdult = choice === 'yes' || choice === 'maybe';
      if(adult && needsAdult && !adult.cb.checked){ out.appendChild(el('div', 'msg-err', 'Please confirm you are 18 or older.')); return; }
      send.disabled = true;
      const x = await ctx.send(choice, choice === 'ignore' ? '' : t.ta.value, adult && needsAdult ? adult.cb.checked : undefined);
      send.disabled = false;
      if(!x.ok){ out.appendChild(el('div', 'msg-err', x.error || 'That did not work.')); return; }
      if(me && needsAdult) me.adult = true;
    });
    bs.appendChild(send);
    rb.appendChild(bs);
    rb.appendChild(out);
    paint();
    return rb;
  }

  // ── A request from an email link (?req=token&answer=yes|maybe|no|ignore) ─────
  // Opening the link changes nothing: the card loads read only with that answer
  // picked, and the answer (Ignore too) is only sent with Send.
  const panel = document.getElementById('panel');
  const reqToken = (params.get('req') || '').trim();
  const presetAnswer = (params.get('answer') || '').trim();
  const RETURN_KEY = 'cs_partner_return';
  async function renderRequest(){
    panel.textContent = '';
    const box = el('div', 'panel');
    panel.appendChild(box);
    if(!token || !me){
      // Keep this page (and its answer) to come back to after signing in.
      try { localStorage.setItem(RETURN_KEY, JSON.stringify({ url: location.pathname + location.search, at: Date.now() })); } catch(e){}
      box.appendChild(el('div', 'sec-h', 'Team-up request'));
      box.appendChild(el('p', 'needs', 'Sign in to answer. Your answer is not sent until you press Send.'));
      const a = el('div', 'actions');
      const s = link('btn btn-p', 'Sign in', SIGN_IN); s.target = '_blank'; s.rel = 'noopener';
      a.appendChild(s);
      a.appendChild(btn('btn-o', 'I signed in, continue', function(){ location.reload(); }));
      box.appendChild(a);
      return;
    }
    try { localStorage.removeItem(RETURN_KEY); } catch(e){}
    if(me.hsBlocked){ box.appendChild(el('div', 'status', 'Partner messaging is for adult players.')); return; }
    box.appendChild(el('div', 'status', 'Loading the request...'));
    const r = await post('/partners/request', { req: reqToken });
    box.textContent = '';
    if(!r.j.ok){ box.appendChild(el('div', 'status err', r.j.error || 'That request is not available.')); return; }
    const q = r.j;
    box.appendChild(el('div', 't-name', q.tournamentName));
    box.appendChild(el('div', 't-meta', (q.divLabel ? q.divLabel + ' · ' : '') + q.size + 's'));
    if(q.team) box.appendChild(el('div', 'needs', 'Their team: ' + q.team.members.join(' + ') + (q.team.need ? ' · looking for ' + q.team.need + ' more' : '')));
    const result = el('div');
    // canRespond: this side's turn. An older worker sent only open.
    box.appendChild(requestCard({ label: q.label, state: q.state, note: q.note, canRespond: q.canRespond !== undefined ? q.canRespond : q.open }, {
      preset: presetAnswer,
      send: async function(answer, text, adultConfirmed){
        const x = await post('/partners/team/respond', { req: reqToken, answer: answer, text: text, adultConfirmed: adultConfirmed });
        if(!x.j.ok) return x.j;
        refresh();
        box.querySelector('.req').remove();
        const msg = answer === 'yes'
          ? (x.j.complete ? 'You said yes. Your team is complete.' : 'You said yes. You are a team' + (x.j.need ? ', looking for ' + x.j.need + ' more.' : '.'))
          : answer === 'no' ? 'You said no thanks. They have been told.'
            : answer === 'ignore' ? 'Ignored. Nothing was sent to them.'
              : 'Sent. It is their turn to answer now. You will hear when they do.';
        result.appendChild(el('div', 'msg-ok', msg));
        try { history.replaceState(null, '', '/partners/?thread=' + encodeURIComponent(x.j.threadId || q.threadId)); } catch(e){}
        return x.j;
      },
    }));
    box.appendChild(result);
    const a = el('div', 'actions'); a.appendChild(link('btn btn-o', 'Open the conversation', threadHref(q.threadId))); box.appendChild(a);
  }

  // ── One conversation (?thread=) ───────────────────────────────────────────
  const threadId = (params.get('thread') || '').trim();
  function when(ms){
    try { return new Date(ms).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); } catch(e){ return ''; }
  }
  async function renderThread(){
    panel.textContent = '';
    const box = el('div', 'panel');
    panel.appendChild(box);
    if(!token || !me){
      box.appendChild(el('div', 'sec-h', 'Your conversation'));
      box.appendChild(el('p', 'needs', 'Sign in to read and reply. Your messages stay inside CourtSense.'));
      const a = el('div', 'actions'); a.appendChild(link('btn btn-p', 'Sign in', SIGN_IN)); box.appendChild(a);
      return;
    }
    box.appendChild(el('div', 'status', 'Loading conversation...'));
    const r = await post('/partners/thread', { threadId: threadId });
    box.textContent = '';
    if(!r.j.ok){ box.appendChild(el('div', 'status err', r.j.error || 'That conversation is not available.')); return; }
    const th = r.j;
    box.appendChild(el('div', 't-name', th.tournamentName));
    box.appendChild(el('div', 't-meta', (th.divLabel ? th.divLabel + ' · ' : '') + 'You and ' + (th.people.join(', ') || 'a player')));
    // Withdraw and Leave team failures show here.
    const threadErr = el('div');
    box.appendChild(threadErr);

    // The newest team-up request, pinned: Yes / Maybe / No / Ignore for the one
    // answering; for the one who asked, where it stands, with Withdraw while open.
    // Once answered, the recipient sees it only while it is still open.
    const reqs = th.requests || [];
    const pin = reqs[reqs.length - 1];
    if(pin && (pin.mine || pin.status === 'pending' || pin.status === 'maybe')){
      box.appendChild(requestCard(pin, {
        where: (th.divLabel ? th.divLabel + ' at ' : '') + th.tournamentName,
        preset: '',
        send: async function(answer, text, adultConfirmed){
          const x = await post('/partners/team/respond', { tid: th.tid, reqId: pin.id, answer: answer, text: text, adultConfirmed: adultConfirmed });
          if(x.j.ok){ renderThread(); refresh(); }
          return x.j;
        },
        withdraw: async function(){
          const x = await post('/partners/team/withdraw', { reqId: pin.id });
          if(!x.j.ok){ threadErr.textContent = ''; threadErr.appendChild(el('div', 'msg-err', x.j.error || 'That did not work. Try again.')); return; }
          renderThread();
          refresh();
        },
      }));
    } else if(pin){
      const rb = el('div', 'req');
      rb.appendChild(el('div', 'who', pin.label));
      rb.appendChild(el('div', 'state', pin.state));
      box.appendChild(rb);
    }

    // The team this conversation is about, when there is one.
    if(th.team){
      const tb = el('div', 'req');
      tb.appendChild(el('div', 'who', th.team.members.join(' + ')));
      if(th.team.registered) tb.appendChild(el('span', 'reg-chip', 'Registered'));
      else tb.appendChild(el('div', th.team.status === 'complete' ? 'done' : 'state', th.team.status === 'complete' ? 'Team complete' : 'Looking for ' + th.team.need + ' more (' + th.team.size + 's)'));
      if(th.team.sizeChanged) tb.appendChild(el('div', 'state', 'This team formed as ' + th.team.size + 's. The event has since changed its format.'));
      const bs = el('div', 'btns');
      if(!th.team.registered && th.team.status === 'complete' && th.registrationLink){ const a = link('btn btn-gold', 'Register your team', th.registrationLink); a.target = '_blank'; a.rel = 'noopener noreferrer nofollow'; bs.appendChild(a); }
      if(th.team.mine && th.team.ref) bs.appendChild(btn('btn-o', 'Leave team', async function(){
        if(!window.confirm('Leave this team? Your teammates will be told and the spot opens up.')) return;
        const x = await post('/partners/leave', { tid: th.tid, teamRef: th.team.ref });
        if(!x.j.ok){ threadErr.textContent = ''; threadErr.appendChild(el('div', 'msg-err', x.j.error || 'That did not work. Try again.')); return; }
        renderThread();
        refresh();
      }));
      if(bs.childNodes.length) tb.appendChild(bs);
      box.appendChild(tb);
    }

    // Earlier requests in this conversation, one line each. The newest is pinned above.
    (th.requests || []).slice(0, -1).forEach(q => {
      const rb = el('div', 'req');
      rb.appendChild(el('div', 'who', q.label));
      rb.appendChild(el('div', 'state', q.state));
      box.appendChild(rb);
    });

    // Messages, oldest first. An answer with a note reads as the answer itself:
    // "Ana B. said maybe: Can we play Upper instead?". Report sits on everything
    // someone else wrote.
    const SAID = { yes: 'said yes', maybe: 'said maybe', no: 'said no thanks' };
    const list = el('div');
    (th.messages || []).forEach(m => {
      const said = m.kind === 'answer' && SAID[m.answer];
      const mb = el('div', 'thread-msg' + (m.kind === 'system' ? ' sys' : m.mine ? ' mine' : '') + (said ? ' answer' : ''));
      if(m.kind !== 'system') mb.appendChild(el('div', 'from', (said ? '' : (m.mine ? 'You' : m.from) + ' · ') + when(m.at)));
      mb.appendChild(el('div', 'text', said ? (m.mine ? 'You' : m.from) + ' ' + said + ': ' + m.text : m.text));
      if(!m.mine && m.kind !== 'system'){
        const rep = el('button', 'linkbtn', 'Report');
        rep.type = 'button';
        rep.addEventListener('click', function(){
          if(mb.querySelector('.compose')) return;
          const f = el('div', 'compose');
          f.appendChild(el('label', null, 'What is wrong with this message?'));
          const why = el('input'); why.type = 'text'; why.maxLength = 300;
          f.appendChild(why);
          const o = el('div');
          const bs = el('div', 'btns');
          bs.appendChild(btn('btn-p', 'Send report', async function(){
            const x = await post('/partners/report', { threadId: th.threadId, msgId: m.id, reason: why.value });
            f.textContent = '';
            f.appendChild(el('div', x.j.ok ? 'msg-ok' : 'msg-err', x.j.ok ? 'Thanks. We will take a look.' : (x.j.error || 'That did not send.')));
          }));
          bs.appendChild(btn('btn-o', 'Cancel', function(){ f.remove(); }));
          f.appendChild(bs); f.appendChild(o);
          mb.appendChild(f);
        });
        mb.appendChild(rep);
      }
      list.appendChild(mb);
    });
    box.appendChild(list);

    // Reply.
    const t = textBox('Write a reply');
    box.appendChild(t.ta); box.appendChild(t.count);
    const adult = adultBox();
    if(adult) box.appendChild(adult.lab);
    const out = el('div');
    const bs = el('div', 'btns');
    const send = btn('btn-p', 'Send', async function(){
      out.textContent = '';
      if(!t.ta.value.trim()) return;
      if(adult && !adult.cb.checked){ out.appendChild(el('div', 'msg-err', 'Please confirm you are 18 or older.')); return; }
      send.disabled = true;
      const x = await post('/partners/reply', { threadId: th.threadId, text: t.ta.value, adultConfirmed: adult ? adult.cb.checked : undefined });
      send.disabled = false;
      if(!x.j.ok){ out.appendChild(el('div', 'msg-err', x.j.error || 'That did not send.')); return; }
      if(me) me.adult = true;
      renderThread();
    });
    bs.appendChild(send);
    box.appendChild(bs);
    box.appendChild(out);
    const fine = el('div', 'note', 'Links are removed from messages. Your email and phone are never shared. ');
    fine.appendChild(link('ext', 'Email settings', '/partners/?settings=1'));
    box.appendChild(fine);
    const back = el('div', 'actions'); back.appendChild(link('btn btn-o', 'Back to the board', '/partners/' + (th.tid ? '?t=' + encodeURIComponent(th.tid) : ''))); box.appendChild(back);
  }

  // ── Partner email setting (?settings=1) ───────────────────────────────────
  function renderSettings(){
    panel.textContent = '';
    const box = el('div', 'panel');
    box.appendChild(el('div', 'sec-h', 'Partner emails'));
    panel.appendChild(box);
    if(!token || !me){
      box.appendChild(el('p', 'needs', 'Sign in to change your partner email setting.'));
      const a = el('div', 'actions'); a.appendChild(link('btn btn-p', 'Sign in', SIGN_IN)); box.appendChild(a);
      return;
    }
    const state = el('p', 'needs', me.partnerEmails ? 'Partner emails are on. You get an email when someone reaches out, answers, or your team changes.' : 'Partner emails are off. Messages still wait for you on CourtSense.');
    box.appendChild(state);
    const out = el('div');
    const bs = el('div', 'btns');
    bs.appendChild(btn(me.partnerEmails ? 'btn-o' : 'btn-p', me.partnerEmails ? 'Turn off partner emails' : 'Turn on partner emails', async function(){
      const x = await post('/partners/prefs', { partnerEmails: !me.partnerEmails });
      if(!x.j.ok){ out.textContent = ''; out.appendChild(el('div', 'msg-err', x.j.error || 'That did not save.')); return; }
      me.partnerEmails = x.j.partnerEmails;
      renderSettings();
    }));
    box.appendChild(bs);
    box.appendChild(out);
  }

  async function load(){
    try {
      me = await loadMe();
      // Back from signing in after opening a request link: return to it once.
      if(me && !reqToken && !threadId){
        let back = null;
        try { back = JSON.parse(localStorage.getItem(RETURN_KEY) || 'null'); localStorage.removeItem(RETURN_KEY); } catch(e){}
        if(back && typeof back.url === 'string' && back.url.indexOf('/partners/?req=') === 0 && Date.now() - back.at < 3600000){ location.replace(back.url); return; }
      }
      // A stored sign-in the worker refused or could not check: say so, with a way back in.
      if(meFail && !reqToken && !threadId){
        const box = el('div', 'panel');
        box.appendChild(el('div', 'status err', meFail.error));
        if(meFail.reason === 'expired'){ const a = el('div', 'actions'); a.appendChild(link('btn btn-p', 'Sign in again', SIGN_IN)); box.appendChild(a); }
        panel.appendChild(box);
      }
      if(reqToken) await renderRequest();
      else if(threadId) await renderThread();
      else if(params.get('settings') === '1') renderSettings();
      else if(me && me.hsBlocked){ panel.appendChild(el('div', 'status', 'Partner messaging is for adult players.')); }
      else if(me && !me.configured){ panel.appendChild(el('div', 'status', 'Messaging is not set up yet.')); }
      await drawBoard(false);
    } catch(e){
      board.textContent = '';
      board.appendChild(el('div', 'status err', (e && e.message) || 'Could not load the partner board. Refresh to try again.'));
    }
  }

  // After a team action (send, answer, leave): reload who the viewer is (their team
  // refs change) and redraw the board from a fresh copy, so the change shows at once.
  // An open compose box is put back in its row. A failure says so above the board and
  // leaves the last board in place.
  let refreshing = null;
  function refresh(){
    if(refreshing) return refreshing;
    refreshing = (async function(){
      try {
        const m = await loadMe();
        if(m) me = m;
        // Team lists are fetched again for every open card as it redraws.
        Object.keys(extras).forEach(k => { extras[k].stale = true; });
        await drawBoard(true);
      } catch(e){
        const s = el('div', 'status err', ((e && e.message) || 'Could not refresh the board.') + ' Refresh the page to see the latest.');
        board.insertBefore(s, board.firstChild);
      } finally {
        refreshing = null;
      }
    })();
    return refreshing;
  }

  async function drawBoard(fresh){
    const [featuredList, all] = await Promise.all([tid ? fetchBoard(tid, fresh) : Promise.resolve([]), fetchBoard('', fresh)]);
    // Cards keep whether they were open across a redraw.
    const wasOpen = {};
    board.querySelectorAll('details.card').forEach(d => { wasOpen[d.id] = d.open; });
    board.textContent = '';
    const featured = featuredList[0] || null;
    if(tid && !featured){
      board.appendChild(el('div', 'status', 'That event is not on the board any more. Here is everything coming up.'));
    }
    if(featured) board.appendChild(card(featured, true, true));
    const rest = all.filter(t => !featured || t.id !== featured.id);
    if(!featured && !rest.length){
      board.appendChild(el('div', 'status', 'No upcoming tournaments are listed yet.'));
      const a = el('div', 'actions');
      a.appendChild(link('btn btn-p', 'Add a tournament', PICKUP + '?view=tournaments'));
      board.appendChild(a);
      return;
    }
    if(featured && rest.length) board.appendChild(el('div', 'sec-h', 'More upcoming events'));
    const openAll = !featured && rest.length <= 3;
    rest.forEach(t => board.appendChild(card(t, false, ('trn-' + t.id) in wasOpen ? wasOpen['trn-' + t.id] : openAll)));
    if(askOpen){
      const host = askOpen.holder();
      const d = host && host.closest('details');
      if(d) d.open = true;
      askOpen.open();
      askOpen = null; askDone = true;
      if(host) host.scrollIntoView({ block: 'center' });
      try { history.replaceState(null, '', '/partners/' + (tid ? '?t=' + encodeURIComponent(tid) : '')); } catch(e){}
    }
  }
  load();
})();
</script>
