<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>CourtSense - New School Setup</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{ --red:#e4002b; --blk:#111827; --gry:#6b7280; --sand:#f5f5f5; --wht:#fff; }
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;background:var(--sand);font-family:'Barlow',sans-serif;color:var(--blk);}
main{max-width:520px;margin:0 auto;padding:56px 16px;}
.card{background:var(--wht);border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:28px 22px;text-align:center;}
h1{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:1px;margin-bottom:10px;}
p{font-size:15px;line-height:1.6;color:var(--gry);margin-bottom:18px;}
a.btn{display:inline-block;background:var(--red);color:#fff;text-decoration:none;font-weight:700;border-radius:8px;padding:12px 22px;min-height:44px;}
</style>
</head>
<body>
<!-- Retired 2026-11-25. This page used to generate a school shell and a service-account
     populate script by hand. School setup now runs through /coach/ and the worker, which
     writes the school's config itself. -->
<main>
  <div class="card">
    <h1>New School Setup</h1>
    <p>School setup now happens through the coach sign-up page. Tell us about your program there and we set everything up for you.</p>
    <a class="btn" href="/coach/">Go to coach sign-up</a>
  </div>
</main>
</body>
</html>
